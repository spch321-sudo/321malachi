<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玛拉基书讲义">
<meta name="application-name" content="321玛拉基书讲义">
<meta name="description" content="321玛拉基书讲义：全书四章逐节原文解经、讲章逐字稿、教学讲章与321生命应用。">
<title>321玛拉基书讲义</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

}

</script><script id="DATA" type="application/json">{"ch":[{"n":1,"t":"我曾愛你們","sub":"問、藐、名","lv":"B","arc":"愛","sec":[["1:1--1","一個使者傳的默示"],["1:2--5","我曾愛你們：你們卻說，你在何事上愛我們呢"],["1:6--7","我既為父親，尊敬我的在哪裡呢"],["1:8--10","瞎眼的、瘸腿的，獻給你的省長試試"],["1:11--11","我的名在外邦中必尊為大"],["1:12--14","何等煩瑣：大君王的名是可畏的"]],"serm":{"pts":[["神先說：我曾愛你們","1:1--5","神回答疑問的方式，是先把愛放在桌上；愛在前面，回應在後面。"],["人回嘴：尊敬我的在哪裡","1:6--10","百姓把最差的獻上壇，卻不覺得有問題；敬拜不是動作，是一顆心。"],["名要被尊為大","1:11--14","神的名本來就大，不靠我們撐場；我們是來領受，不是來伺候。"]]},"q":"一個人可以天天站在神的殿裡，心裡卻一直在問：你真的愛我嗎？可以。被擄歸回的百姓，殿重建了，壇上有火了，日子卻不如想像中順利，疲憊與失望慢慢滲進敬拜裡。瑪拉基書一開口，神沒有責備這個疑問，反而先說一句：「我曾愛你們。」這一章回答：愛看不見的時候，我們要怎麼認出它？神的答案是：先回頭看那份先給的愛，再看自己把什麼放上壇——愛在前面，敬拜才不會變成交差。","truth":"神回答「你在何事上愛我們呢」，是先說愛；人回應愛的方式，卻是把最差的獻上壇。可是這位大君王的名不靠誰撐大，祂先愛了，才邀請人來敬畏。","mv":{"t":"耶和華說：「我曾愛你們。」","r":"瑪1:2--2"},"card":["被擄歸回的百姓問：你在何事上愛我們呢？神不辯護，先說：我曾愛你們，並指向雅各被揀選的歷史。接著神轉過來問：我既為父親，尊敬我的在哪裡呢？百姓獻上瞎眼、瘸腿、有病的祭牲，還嫌事奉煩瑣。然而神說，他的名在外邦中必尊為大，因為他是大君王。","「我曾愛你們」（אָהַבְתִּי）是完成式：愛已經發生，而且到今天仍在。","恩典的次序：愛在前面，回應在後面。不是獻得好才被愛，是先被愛，才有力氣獻上最好的。","無己，是不再用表現換一個被愛的位置，而是在已經被愛裡安息，把最好的放回祂面前。","「我先愛了你，不是因為你獻得好。你只管來，先領受。」","這一週，挑一個固定的十分鐘，放下手機，對自己和對神唸一遍：「我曾愛你們」，然後說：謝謝你，先愛了我。","最終整合：他問：「你在何事上愛我們呢？」\n這不是挑釁。\n是一個累了很久的人，\n不敢明說的哭。\n\n神沒有罵他。\n神只說了一句：\n「我曾愛你們。」\n\n愛，已經發生過了。\n在雅各還詭詐的時候，\n在你還什麼都沒有賺到的時候。\n\n然後神回頭問：\n你把什麼放上了我的壇？\n不是要算帳，\n是要把我們的心，\n從「交差」帶回「獻上」。\n\n從日出之地到日落之處，\n他的名本來就大。\n我們不是去撐場，\n我們是被邀請，\n站進那束光裡。"],"self":"有己的定義：想用表現換一個被愛的位置；把最好的給別人看，把剩下的才給神。","t321":{"k":"耶穌受洗時，天上有聲音說：「這是我的愛子，我所喜悅的。」（太3:17）\\ > 祂還沒有開始傳道、沒有行任何神蹟，父已經先說了愛。\\ > 祂是我的榜樣：先在被愛裡站穩，才開始事奉；不是為了贏得愛而事奉。","g":"百姓把最好的給了省長，把剩下的給了神（1:8）。\\ > 讓耶穌作王，就是把「最後才輪到祂」的那個位置，交還給祂。\\ > 這一章要我放下的，是那隻總想先照顧別人眼光的手。","p":"1:11「從日出之地到日落之處」，神的名在列國中被尊為大。\\ > 屬神的體系，是每一個家、每一個小組，都在回應同一位先愛了我們的王，而不是各自撐一個場面。\\ > 從今天起，在聚會前先說一句：主，謝謝你先愛我們。"},"grp":["【一、破冰】有沒有一句「我想你了」或「我愛你」，是你當時沒有好好回應，後來想起來很可惜的？","【二、扎心】1:2 百姓問「你在何事上愛我們呢」。最近有沒有一件事，讓你心裡也冒出這個問題？你願意說出來嗎？","【三、福音】神回答之前，先說了「我曾愛你們」。當你知道愛在你做任何事之前就已經發生，你的心有什麼感覺？","【四、行動】1:8 說我們常把最好的給了「省長」。你的時間、精神、金錢，哪一樣最常是「剩下的」才給神？這一週你願意怎樣調整一個小地方？","【五、代禱】兩人一組，彼此說出一個覺得「神好像沒有看見」的地方，為對方禱告：「主啊，求你讓他再聽見，你說過：我曾愛你。」"],"prac":{"main":"這一週，挑一個固定的十分鐘，放下手機，唸一遍：「我曾愛你們。」然後對神說：謝謝你，先愛了我。","items":["對神：每天睡前說一句「謝謝你，先愛了我」，不求什麼，只說這一句","對自己：寫下一件你一直覺得「我得做得更好，才配被愛」的事，在旁邊寫：我先被愛了","對人：這一週對一位家人說一句具體的「我愛你」，不附帶任何要求","對生活：檢查本週行事曆，找出一個「總是剩下才給神」的時段，改成排在前面","對使命：下次服事前，先花一分鐘安靜：我不是去證明自己，我是帶著被愛去服事"]},"safe":["① 用 1:2--3「愛雅各，惡以掃」講成神愛某些人、恨某些人，或拿來論斷任何民族（以東或今日任何國家）\n「愛」與「惡」在這裡是比較的語言，意思是選了或沒有選，說的是神的揀選，不是神對某個族群的態度。\n不可拿這節去說哪個民族被神厭棄，也不可說某一地的災難是 1:4 的應驗。\n檢驗標準：講完之後，會眾是更感恩自己被揀選，還是對某一群人多了輕看？","② 對正在受苦的人說「神愛你，所以你要感恩、不要難過」，用「我曾愛你們」堵住真實的問\n本章的百姓連問都不敢明問，神卻沒有罵他。神回答的方式，是先陪著他把問題問完。\n不可拿愛當作要人閉嘴的蓋子。受傷的人需要先被聽見，再被提醒愛一直在。\n檢驗標準：一位正在哭的人聽完，是覺得被接住，還是覺得不該哭？","③ 把「你在何事上愛我們呢」講成不信的記號，責備提問的人\n這個問句是整卷書「你們說」的第一個，神每一次都肯回答。\n誠實地問神，與冷冷地論斷神不同。要區分的是心，不是問題本身。\n檢驗標準：會眾聽完，是更敢向神開口，還是更怕被說不屬靈？","④ 用 1:8 的瞎眼瘸腿祭牲去責備貧窮的人「獻得不夠好」，或拿來要求奉獻金額\n神責備的是「有好的，卻拿壞的來」的心，不是在比較誰的財力。\n貧窮人用僅有的所獻上，神是看見的。講台不可借此向會眾施壓。\n檢驗標準：經濟困難的弟兄姊妹聽完，是被安慰，還是被羞辱？","⑤ 把 1:6、1:10 對祭司的責備，變成攻擊牧者或同工的子彈\n這裡的「祭司」指當時帶領敬拜的人，今天的對應是「所有肩上有託付的人」，包括講的人自己。\n不可借此在會眾面前點名批評某位牧者；也不可讓牧者拿來責怪會眾冷淡。\n檢驗標準：講完之後，大家是各自照鏡子，還是在找誰是被責備的那一位？","⑥ 把 1:11 講成「各宗教都在拜同一位神」，或反過來貶低其他信仰的人\n1:11 的重點是耶和華的名要被認出來，不是在比較宗教，也不是替各教背書。\n不可拿這節去貶低別人，也不可拿這節去說「怎麼拜都一樣」。\n檢驗標準：講完後，會眾是對神的名更敬畏，還是對別人更輕看，或對福音更含糊？","⑦ 把「獻上最好的」講成要人付出更多時間、才幹、金錢，造成過勞和績效的壓力\n神要的是一顆誠實的心，不是一份愈來愈長的清單。\n若一個人把「最好的」解成無止境的付出，他就會在倦怠裡離開。\n檢驗標準：講完之後，會眾是更靠近神，還是更焦慮自己做得不夠？","⑧ 把 1:10「甚願你們中間有一人關上殿門」講成叫人不要來聚會，或教會可以排斥不來的人\n這是神對虛假敬拜的沉痛，不是叫人離開，也不是邀請教會設立門檻。\n不可借此對疲累、失落、暫時離開的人貼標籤。\n檢驗標準：疲累的人聽完，是覺得還有回來的路，還是更覺得被趕出去？","⑨ 把 1:14 的「可咒詛」講成對許願沒做到的人的詛咒，讓人活在恐懼裡\n神責備的是「有好的卻用壞的」的詭詐，不是在恐嚇每一個軟弱的人。\n講的時候要區分：悔改的人可以回來，不是一次失敗就永遠被定罪。\n檢驗標準：曾經失信的人聽完，是想回來，還是想躲起來？","⑩ 把「名要被尊為大」講成我們要努力為神撐場面，讓神的名「看起來」更大\n經文說的是神的名本來就大，我們不是替祂撐腰，是回應祂。\n講成「神需要我們」，會讓事奉變成焦慮與表演。\n檢驗標準：會眾聽完，是更安息地回應祂，還是更焦慮地為祂工作？"]},{"n":2,"t":"我們豈不都是一位父嗎","sub":"約、淚、謹","lv":"A","arc":"約","sec":[["2:1--3","眾祭司啊，這誡命是傳給你們的"],["2:4--9","利未的約：從口中領人回頭，到使人跌倒"],["2:10--12","我們豈不都是一位父嗎"],["2:13--16","前妻的眼淚，與「謹守你們的心」"],["2:17--17","用言語煩瑣耶和華：公義的神在哪裡"]],"serm":{"pts":[["祭司與約：口中該有的話","2:1--9","約是用口說出來的；同一張嘴，可以使人回頭，也可以使人跌倒。"],["弟兄與妻子：不要以詭詐待人","2:10--16","神是婚禮的見證人；他看見眼淚，比看見供物更清楚。"],["言語煩瑣神：公義的神在哪裡","2:17--17","誠實的哭是靠近，冷冷的判是離開；神要回答這句話。"]]},"q":"二十年前站在台前說「我願意」的兩個人，今天坐在同一張餐桌上，卻誰也不說話。這樣的安靜，算不算背約？瑪拉基書第二章從祭司的口開始，一路問到每一個家：我們豈不都是一位父嗎？為什麼還要以詭詐待弟兄、待妻子？神看見的不只是供物，也包括壇上的眼淚。這一章回答：約是怎樣被守住的？答案不是更用力的忍耐，而是一次一次謹守自己的心。","truth":"約是用口說出來的，也是用心守住的；神看見供物，更看見眼淚，他是每一個婚約的見證人，也要我們不再以詭詐待人。","mv":{"t":"我們豈不都是一位父嗎？豈不是一位神所造的嗎？","r":"瑪2:10--10"},"card":["神先對祭司說：你們的口本該存知識，領人回頭，如今卻偏離正道、使人跌倒。接著神把話帶進每一個家：我們豈不都是一位父嗎？卻以詭詐待弟兄、背棄了約。前妻的眼淚遮蓋耶和華的壇，神不再看顧供物。最後，百姓還說：公義的神在哪裡呢？","「約」（בְּרִית）從利未的約，到列祖的約，到婚姻的約，一路是同一個字；「詭詐」（בָּגַד）反覆出現在 2:10–16。","神是約的見證人，也是先守約的那一位。人背約，他沒有撤約；他親自來，把約守住。","無己，是不再用「我先被公平對待」守約，而是先放下，因為我已經先被愛了。","「你婚禮那天說的話，我都聽見了；今天你說的話，我也聽見了。」","這一週，找一位與你有約的人，說一句一直沒說的話：謝謝你，或者對不起。","最終整合：相簿翻到那一頁，\n兩個人笑得很傻。\n誰也沒想到，\n二十年後最難守的，\n不是風暴，\n是一頓安靜的晚餐。\n\n神說：\n我是你們共同的父。\n你們說過的話，\n我在場，我聽見了。\n\n壇上有供物，\n也有眼淚。\n他先看見了眼淚。\n\n他沒有說：忍下去。\n他說：謹守你們的心。\n不是守住面子，\n是守住那一顆\n曾經說「我願意」的心。\n\n若那顆心已經碎了，\n他也在，\n他不離席。"],"self":"有己的定義：把婚姻與關係的約，守成「他先改，我才改」；用計算代替信實，用詭詐代替誠實。","t321":{"k":"耶穌復活後第一次站在門徒中間，說：「願你們平安。」（約20:19）\\ > 這些人三天前才丟下祂逃走。祂沒有先算帳，先說了平安。\\ > 祂是我的榜樣：守約的人，先伸出手，而不是先等對方道歉。","g":"2:16「所以當謹守你們的心，不可行詭詐」，守的是心，不是面子。\\ > 讓耶穌作王，就是交出「他先錯，所以我可以冷淡」的權利。\\ > 這一章要我放下的，是那份為自己保留退路的詭詐。","p":"2:10「我們豈不都是一位父嗎」：同一位父，同一個家。\\ > 屬神的體系，從家的約開始：夫妻、父母與兒女、弟兄姊妹，先在神面前守約，教會才不會變成沒有根的人群。\\ > 從今天起，先為你最親近的那一位禱告，再為事工禱告。"},"grp":["【一、破冰】你有沒有一張舊照片，每次看到都會想起一個承諾？那是什麼承諾？","【二、扎心】2:6–9 說祭司的口，從使人回頭變成使人跌倒。你最近說過的一句話，是使人回頭，還是使人跌倒？","【三、福音】2:13–14 神看見眼淚，也在婚禮上作見證。當你知道神一直都在場，你心裡有什麼感覺？","【四、行動】2:15–16 說「謹守你們的心」。有一個人，你的心最近悄悄離開了嗎？這一週你願意做哪一件很小的事，把心往回守一步？","【五、代禱】兩人一組，說出一個你想為之禱告的「約」（婚姻、家人、朋友），彼此禱告：「主啊，求你讓他再守住這份約。」"],"prac":{"main":"這一週，找一位與你有約的人，說一句一直沒有說的話：謝謝你，或者對不起。","items":["對神：每天花三分鐘，把你和最親近的人之間的一個約，帶到神面前，說：請你作見證，也幫我守","對自己：誠實寫下一件你一直沒有說出口的委屈，不寫給誰看，只寫給神","對人：今晚吃飯時把手機翻過去，問對方一句：你今天累不累？","對生活：這一週有一次，在說出一句重話之前，先停三秒，問：這句話是使人回頭，還是使人跌倒？","對使命：若你帶領他人，這一週先為你的家人禱告十分鐘，再為事工禱告"]},"safe":["① 用 2:16 講成「神恨離婚，所以離婚一定是罪」，並逼受暴者留下\n2:16 譯法有爭議（上帝版：「休妻的事和以強暴待妻的人都是我所恨惡的」），神恨的是詭詐、棄絕與強暴，不是一個走出危險的人。\n不可要求受害者為了「維持婚姻」留在暴力、持續背叛的處境。安全優先，並協助轉介專業協助。\n檢驗標準：一位受傷的姊妹聽完，是覺得被保護，還是覺得自己該回去？","② 把 2:11「娶事奉外邦神的女子」講成排外、禁止跨族群婚姻，或嫌棄外邦配偶\n這裡的重點是信仰之約被背離（事奉外邦神），不是族群、國籍或膚色。\n不可拿這節對跨國婚姻、跨族群的夫妻說三道四，也不可傷害已經信主的外邦配偶。\n檢驗標準：講完之後，會眾是更忠於神，還是對某一類人多了偏見？","③ 只把 2:13–14 講成「男人不可離棄妻子」，而忽略眼淚的主人、孩子，以及被離棄的人\n經文的重心是神看見眼淚。任何人，不論男女，都可能在關係裡行詭詐，也可能成為被傷害的一方。\n不可把整段經文變成對某一方的指控。\n檢驗標準：被離棄的人聽完，是覺得神看見他，還是覺得自己又被論斷一次？","④ 對離婚的人說「你的敬拜神不看顧，你的禱告不蒙垂聽」\n2:13 說的是以詭詐待妻、卻照常獻供物的人；不是說所有經歷離婚的人，神都不收納。\n神特別看顧被離棄者的眼淚。不可借此讓離婚的人離開教會。\n檢驗標準：曾經離婚的人聽完，是敢回來敬拜，還是更不敢進教會？","⑤ 把 2:15 這節難解的經文，只講成一種譯法，並說成唯一的解釋\n2:15 在原文有多種斷句與譯法（見議題），不同的翻譯會影響意思。\n講台要誠實說：這節有不同譯法，但無論哪一種，「謹守你們的心」都是清楚的。\n檢驗標準：講完之後，會眾是更清楚這節的重心，還是被一個過度肯定的說法帶偏？","⑥ 用 2:15「虔誠的後裔」去要求人生育，或讓不孕、單身、沒有孩子的人覺得被定罪\n這節話的重點是婚姻的聖潔與家庭裡的信仰傳承，不是對生育的指令。\n不可借此對沒有孩子的夫妻施壓。\n檢驗標準：沒有孩子的人聽完，是被安慰，還是被刺痛？","⑦ 把 2:2「我就使咒詛臨到你們」講成「現代的病痛與失敗是被咒詛」\n這是針對不守約的祭司職任的警告，不是每一個疾病或失敗的因果公式。\n講成公式，會讓受苦的人在羞愧裡離開教會。\n檢驗標準：正在受苦的人聽完，是更想求神，還是更覺得自己被神處罰？","⑧ 把 2:4–9 祭司的標準，變成要求牧者完美，或貶低沒有受過神學訓練的人\n2:7「祭司的嘴裡當存知識」，強調的是認識神的知識與真實的口，不是文憑。\n不可拿這節當作對任何牧者的攻擊，也不可讓會眾用它來挑剔同工。\n檢驗標準：講完之後，大家是各自照鏡子，還是在挑別人的毛病？","⑨ 把 2:17「公義的神在哪裡呢」講成不信，禁止受害者提出這個問題\n這句話在經文裡是用言語煩瑣神的例子，但詩篇裡也有很多誠實的哭問。\n要區分的是：誠實的哭，與冷冷的判斷。不可對真正受傷的人說「你不可以這樣問」。\n檢驗標準：受害者聽完，是更敢開口向神，還是更沉默？","⑩ 把 2:10「一位父」講成所有人都已自動成為神的兒女，或相反地否定神是萬人的造物主\n2:10 的「一位父、一位神所造」主要強調同源與同約，是向以色列的百姓說的。\n不可借此推論所有人都已得救，也不可否定神的創造之愛。\n檢驗標準：講完之後，會眾對福音是更清楚，還是更模糊？","⑪ 用「謹守你們的心」要求被傷害的一方先改變、先原諒、先挽回\n「謹守你們的心」是對行詭詐的人說的，不是對受害者的責任清單。\n不可讓受害者承擔不屬於他的責任，也不可讓傷害者以此逃避。\n檢驗標準：被傷害的人聽完，是覺得有出路，還是覺得自己更該忍耐？","⑫ 把婚姻的約講成「為了維持婚姻，什麼都要忍」\n約的核心是信實與誠實，不是單方面的忍受。神恨惡詭詐與強暴，也看見眼淚。\n不可拿約的名義，對正在受傷害的人說「忍一忍就好了」。\n檢驗標準：一位正被虐待的人聽完，是覺得有安全的路，還是覺得只能繼續忍？","⑬ 把這一章只講成已婚者的功課，讓單身、喪偶、離婚的人覺得自己被排除\n這一章的核心是「約」與「詭詐」：朋友、同工、父母子女、弟兄姊妹，每一種關係都有約。\n講章要包含各種處境的人。\n檢驗標準：單身或喪偶的人聽完，是覺得與自己有關，還是覺得這是別人的課？"]},{"n":3,"t":"現在你們要轉向我","sub":"使者、轉向、記念","lv":"A","arc":"歸","sec":[["3:1--5","立約的使者忽然進殿：如煉金的火、漂布的鹼"],["3:6--7","我耶和華是不改變的：現在你們要轉向我"],["3:8--12","奪取的供物與敞開的窗戶"],["3:13--15","事奉神是徒然的：疲累人的真話"],["3:16--18","紀念冊與「特特歸我」"]],"serm":{"pts":[["主要忽然進殿：那把火，是為了潔淨","3:1--5","那一天的火是衝著雜質來的，不是衝著人；煉銀的人是坐著的，他不離開。"],["轉向與奉獻：你們要轉向我","3:6--12","神不改變，所以人能轉身；轉向是把心裡留下的那一塊，交還給神。"],["事奉是徒然的嗎？有一本紀念冊","3:13--18","神連疲累的人的懷疑都接得住；他側耳而聽，他記得，他說：特特歸我。"]]},"q":"一個人可以事奉了多年，心裡卻悄悄覺得「這一切都是徒然」嗎？可以。瑪拉基書第三章把這句話原原本本記下來：事奉神是徒然的，遵守神所吩咐的，有什麼益處呢？神沒有罵他，反而先說：我必差遣使者，主要忽然進殿；我是不改變的；現在你們要轉向我，我就轉向你們。這一章回答：疲累的人怎樣回家？答案是轉身，而轉身的路，神早就鋪好了。","truth":"神不改變，所以人能轉身：現在你們要轉向我，我就轉向你們。那團火是為了潔淨，那本紀念冊是為了記念，疲累的人在其中沒有一個被忘記。","mv":{"t":"現在你們要轉向我，我就轉向你們。","r":"瑪3:7--7"},"card":["神說要差遣使者預備道路，百姓所尋求的主必忽然進殿，如煉金的火。因為神是不改變的，所以雅各之子沒有滅亡。神向他們說：現在你們要轉向我，我就轉向你們。百姓問如何轉向，神指出奪取供物的事。後來有人說事奉神是徒然的，但敬畏耶和華的彼此談論，神側耳而聽，有紀念冊，說：他們必屬我，特特歸我。","「轉向」（שׁוּבוּ／וְאָשׁוּבָה）同一個動詞：你轉向我，我就轉向你，神不是站著等，是迎上來。","恩典的次序：神的不改變（3:6）在先，轉身的邀請（3:7）在後；他先記得，我們才有力氣回家。","無己，是承認心裡留下了一塊不肯交出的地方，並且願意交還給神，不再靠自己證明什麼。","「你轉過身來，我的臉早就在那裡了。」","這一週，找一個只有你和神的時間，把心裡一塊「一直沒交出去」的地方，說出來。","最終整合：車停在陌生的山路上。\n他終於把油門鬆開。\n不是因為想通了，\n是因為累了。\n\n神說：現在。\n不是等你整理好，\n不是等你更好，\n就是現在。\n\n煉銀的人坐下來，\n眼睛一直看著火候。\n他不走開。\n他說：\n火是為了雜質，\n不是為了你。\n\n有一本冊子，\n記著暗處的禱告，\n記著沒人看見的忍耐。\n有人側著耳朵，\n聽你低聲說完沒說完的話。\n\n他說：\n特特歸我。\n如同人憐恤服事自己的兒子。"],"self":"有己的定義：心裡留下一塊「這個我自己來」的地方；把事奉算成交易，用「有什麼益處」代替「你是我的神」。","t321":{"k":"耶穌說浪子的比喻：「相離還遠，他父親看見，就動了慈心，跑去抱著他。」（路15:20）\\ > 沒有人要求浪子先把事情交代清楚，父親先跑過去。\\ > 祂是我的榜樣：這就是「我就轉向你們」的樣子，也是父的心。","g":"3:8 神指出的是一塊「留下的地方」：不是錢本身，是不肯交出去的那一塊。\\ > 讓耶穌作王，就是把這一塊也交出來，包括錢、時間、一段關係、一個不肯饒恕的人。\\ > 這一章要我放下的，是那份「這一塊我自己管」的權利。","p":"3:16「敬畏耶和華的彼此談論」：這是屬靈同伴的雛形。\\ > 屬神的體系，不是靠一個人撐住，而是兩三個敬畏神的人彼此談論、彼此扶持，神側耳而聽。\\ > 從今天起，找一位同伴，每週固定十分鐘，彼此說說：這一週神在哪裡與我同行。"},"grp":["【一、破冰】你有沒有開車開到一半，才發現自己走錯路的經驗？當時你的第一個反應是什麼？","【二、扎心】3:7 神說「現在你們要轉向我」，百姓卻問「如何才是轉向呢」。你生命裡有哪一塊，其實知道偏了，卻一直不知道怎麼轉？","【三、福音】3:6 說「我耶和華是不改變的，所以你們沒有滅亡」。當你知道你不是靠自己夠好才沒被丟下，你心裡有什麼回應？","【四、行動】3:8 說有一塊東西被留下。你願意這一週，哪一個小地方，先把它交給神？（不需要說金額或隱私，只需要說「哪一類」。）","【五、代禱】兩人一組，彼此說出一個「事奉到有點累」的地方，為對方禱告：「主啊，求你側耳聽他，也讓他知道，他不是徒然。」"],"prac":{"main":"這一週，找一個只有你和神的時間，把心裡一塊一直沒有交出去的地方，說出來。","items":["對神：每天睡前用一分鐘說：主，我轉向你，並把今天一件放不下的事交給你","對自己：誠實寫下一件你覺得「事奉是徒然」的時刻，不修飾，只寫給神","對人：找一位屬靈同伴，約一個十分鐘的時間，彼此說：這一週神在哪裡與我同行","對生活：留意這一週有沒有一次「用交易的心」做事（我做了，神就該…），改成「因為你先愛我」","對使命：這一週為一位疲累的同工禱告，並寫一張小卡片告訴他：我記得你的忠心"]},"safe":["① 用 3:8–12 講成「你奉獻，神必加倍賜福」的成功神學\n這段話是對守約的以色列民族整體說的，神要的是回到約裡，不是一個投資公式。\n不可保證奉獻之後必得財富、健康、順利；那會把神當成機器，把人當成客戶。\n檢驗標準：會眾聽完，是更愛神，還是更想靠神發財？","② 用 3:8–9 向會眾施壓奉獻，責怪貧窮的人「奪取神的物」\n這段在當時是供養利未人、孤兒寡婦的制度，倉庫空了，被忘記的人就挨餓。\n講台不可借此羞辱會眾，不可點名誰奉獻多少。\n檢驗標準：經濟困難的人聽完，是被安慰，還是被羞辱？","③ 對經濟困難的人說「你窮是因為沒有十分之一奉獻」\n貧窮的原因很多，不是奉獻不足的因果公式。\n神看的是心，不是金額。\n檢驗標準：一位正在失業的弟兄聽完，是覺得有盼望，還是覺得自己被神處罰？","④ 把 3:10「以此試試我」講成可以拿來測試神、操作神\n這是神在約之內的邀請，不是人對神的測試工具。\n不可教人「你放一份，神就必須回一份」，那是把神當成自動販賣機。\n檢驗標準：講完之後，會眾對神的態度，是更信靠，還是更算計？","⑤ 把 3:1「我的使者」「立約的使者」亂配對，或把某個現代人講成「那位使者」\n新約自己引用 3:1 前半，指向施洗約翰（太11:10、可1:2、路7:27）；「立約的使者」指向基督，是教會傳統的讀法，經文本身並沒有直接點名。\n講台要分清楚：哪些是新約自己做的連結，哪些是我們的領受。\n檢驗標準：講完之後，會眾是更認識耶穌，還是被一個過度肯定的說法帶偏？","⑥ 把 3:2–3「煉金的火」講成「所有的苦難都是神在煉你，所以不要抱怨」\n這是對祭司與百姓整體的潔淨，不是每一個人受苦的因果解釋。\n對正在受暴、受害、喪親的人說「這是神的煉淨」，會造成二次傷害。\n檢驗標準：受苦的人聽完，是覺得有陪伴，還是覺得連哭都不被允許？","⑦ 用 3:5 的審判名單去點名羞辱某一類人，或只挑自己不犯的那幾項講\n這份名單包括邪術、姦淫、假誓、虧負工價、欺壓寡婦孤兒和寄居者，也包括「不敬畏我的」，範圍相當廣。\n不可用來標籤任何群體，也不可只講「別人的罪」。\n檢驗標準：講完之後，會眾是各自照鏡子，還是各自在心裡指向某個人？","⑧ 只把 3:5 的公義講成個人敬虔，不談職場、工價與弱勢者的實際對待\n「虧負人之工價」「欺壓寡婦孤兒」「屈枉寄居的」，是很具體的社會公義。\n講台若只談內在敬虔，會讓人忽略自己手下的人。\n檢驗標準：老闆、主管與僱主聽完，是否看見自己要如何對待員工？","⑨ 把 3:6「我耶和華是不改變的」講成「神不會憐憫、不會回應禱告」\n「不改變」說的是神的信實與約，不是機械的命運。\n3:7 同一段就說：你轉向我，我就轉向你，神是有回應的。\n檢驗標準：會眾聽完，是更確信神的信實，還是覺得神很遙遠？","⑩ 把 3:7「轉向」講成「人要先做到，神才轉向你」\n3:6 說神不改變，1:2 說神先愛，「我就轉向你們」是神迎上來的樣子。\n不可把轉向變成條件交換，不可讓人覺得「我還沒夠好，神還沒轉向我」。\n檢驗標準：疲累的人聽完，是更敢轉身，還是覺得自己還沒資格？","⑪ 對事奉疲累的人，直接斥責 3:14「事奉神是徒然的」是不信\n這句話被神原原本本記在經文裡，神沒有罵說話的人，而是回答他。\n不可對倦怠的同工說「你信心不夠」，應該先陪伴，再談休息與調整。\n檢驗標準：疲累的同工聽完，是覺得被接住，還是更想躲起來？","⑫ 把 3:16 紀念冊講成得救的條件，或讓人活在「我有沒有被記在冊上」的恐懼裡\n3:16 的重點是神側耳而聽、神記得敬畏他的人，不是一份決定救恩的名冊。\n救恩是因恩典，不是因為我們留下的紀錄。\n檢驗標準：不確定的人聽完，是更安穩，還是更焦慮？","⑬ 把 3:17–18 的「善人惡人分別」講成我們現在就能分辨誰是惡人，在教會內貼標籤\n分別是神的事，而且是在「我所定的日子」。\n我們的責任是今天站在敬畏神的人中間，不是判決別人。\n檢驗標準：講完後，會眾是更謙卑，還是更容易論斷？","⑭ 把 3:12「萬國必稱你們為有福的」講成教會要追求外在成功，被世人稱讚\n這是約內的福，是神的同在與土地的豐盛，不是教會的績效目標。\n不可拿來鼓勵人追求名聲與規模。\n檢驗標準：講完後，會眾是更單純地敬畏神，還是更在意別人怎麼看？"]},{"n":4,"t":"必有公義的日頭出現","sub":"爐、翅、轉","lv":"C","arc":"日","sec":[["4:1--1","那日臨近，勢如燒著的火爐"],["4:2--3","公義的日頭，光線有醫治之能"],["4:4--4","你們當記念我僕人摩西的律法"],["4:5--6","先知以利亞與父子之心"]],"serm":{"pts":[["那日如爐","4:1--1","那團火是衝著狂傲來的，不是衝著人；狂傲的人看起來很高，卻沒有根。"],["日頭與跳躍","4:2--3","同一個日子，對狂傲是火，對敬畏是光；日頭升起，圈門打開。"],["記念律法，轉向父子","4:4--6","在等候的日子裡守著他的話；舊約的最後一個動作，是心轉向。"]]},"q":"一個人可以在黑夜裡等了很久，甚至不知道天還會不會亮嗎？可以。舊約三十九卷走到最後，沒有一個圓滿的結局，只有一個應許：必有公義的日頭出現，其光線有醫治之能。瑪拉基書第四章只有六節，卻把整個舊約收在一個還沒有升起來的清晨前面。這一章回答：等候的人要怎麼活？答案是守著他的話，並且讓心先轉向身邊的人。","truth":"那一天對狂傲是火，對敬畏的人是日頭；舊約沒有以句點結束，而是停在一個正在轉向的心，和一個還沒有升起來的清晨前。","mv":{"t":"但向你們敬畏我名的人必有公義的日頭出現，其光線有醫治之能。","r":"瑪4:2--2"},"card":["神宣告那日臨近，勢如燒著的火爐，狂傲的和行惡的必如碎秸。但向敬畏他名的人，必有公義的日頭出現，光線有醫治之能，他們必出來跳躍如圈裡的肥犢。神吩咐當記念摩西的律法，並應許在那大而可畏之日以前，差遣以利亞，使父親的心轉向兒女，兒女的心轉向父親，免得他來咒詛遍地。","「翅膀」（כָּנָף）：日頭的光線像翅膀，醫治在翅膀之下，像母鳥把雛鳥攏在懷裡。","盼望的次序：日頭不是人升起的，是神升起的；等候的人只需要敬畏、記念，並轉向。","無己，是放下「我要算好那一天」的控制，改成每天守著他的話，與身邊的人和好。","「天快亮了。你只要把臉轉過來，迎著光。」","這一週，找一個早晨，早起十分鐘，看著天一點一點亮起來，對主說：我在等你。","最終整合：夜很長，\n長到有人以為不會亮了。\n\n舊約走了三十九卷，\n停在一個還沒有發生的清晨前面。\n\n有一座爐，\n燒著所有想坐在神位置上的東西。\n看起來很高，\n其實沒有根。\n\n也有一個日頭，\n不是人升起來的。\n光線像翅膀，\n把敬畏他名的人，\n攏進懷裡。\n\n你要記念他的話，\n守著燈。\n然後，把心轉向身邊的人，\n父親轉向兒女，\n兒女轉向父親。\n\n夜還在，\n可是天，就快亮了。"],"self":"有己的定義：想要自己坐在神的位置上，自己決定那一天怎麼來、誰該被燒盡，卻忘了先看自己心裡的狂傲。","t321":{"k":"耶穌的門徒問，一個生來瞎眼的人，是誰犯了罪（約9:2–3）。祂的回答不是指控任何人，而是說，這裡有神要顯出來的作為。\\ > 祂沒有對任何一個病人說「你信心不夠」。\\ > 祂是我的榜樣：站在受苦的人身邊，先看見人，而不是先找原因。","g":"4:1「狂傲」，就是離開本位、抓住權力、想要代替神。\\ > 讓耶穌作王，就是放下「由我來判誰是惡人、由我來算那一天」的權力。\\ > 這一章要我放下的，是那份想要掌控結局的手。","p":"4:6「使父親的心轉向兒女，兒女的心轉向父親」，這是屬靈父母與兒女關係的雛形。\\ > 屬神的體系，不是靠制度撐起來，而是一顆一顆彼此轉向的心。\\ > 從今天起，找一位你可以陪伴的年輕人，或一位可以向他學習的長者，每個月聯絡一次。"},"grp":["【一、破冰】你有沒有一次，在黑夜裡等天亮的經驗（病床旁、機場、守夜）？那段時間你心裡在想什麼？","【二、扎心】4:1 說狂傲的人如碎秸。你最近有沒有哪一件事，是「我要自己決定，不需要被糾正」的？","【三、福音】4:2 說敬畏神的人有日頭、有翅膀。當你知道你不是靠自己撐過黑夜，你心裡有什麼感覺？","【四、行動】4:6 說父親與兒女的心要彼此轉向。有沒有一個家人，你願意這一週先踏出一小步？（不需要和好，只需要願意開始。若有傷害，請先確保安全。）","【五、代禱】兩人一組，說出一個你還在「黑夜」等待的地方，彼此禱告：「主啊，求你的日頭升起，也求你陪著他等。」"],"prac":{"main":"這一週，找一個早晨，早起十分鐘，看著天一點一點亮起來，對主說：我在等你。","items":["對神：每天早上用一分鐘，對神說：你是我的日頭，我在這裡等你","對自己：誠實寫下一個「還在黑夜」的地方，不求立刻有答案，只求被神看見","對人：這一週主動聯絡一位久未聯絡的家人，說一句簡單的問候；若有受傷害的歷史，請先確保安全再決定","對生活：這一週留意一個「想控制結局」的時刻，改說：主，這個交給你","對使命：找一位年輕人或長者，約一次咖啡，單純彼此分享，不帶任何目的"]},"safe":["① 把 4:1「那日如爐」講成末世時間表，或指認某國某人就是「狂傲的、行惡的」\n經文沒有給日期，也沒有點名任何人或國家。\n不可算日子，不可製造恐慌，也不可把一個民族放進「惡人」的名字裡。\n檢驗標準：講完之後，會眾是更儆醒愛主，還是更焦慮、更怕世界？","② 對病人說 4:2 的醫治，就是「只要有信心就會好」\n4:2 說的是神親自來醫治他百姓最深的傷，不是每一個病的因果公式。\n不可說「你還沒好，是因為你信心不夠」。病痛中的人，仍然可以敬畏他的名、等候他。\n檢驗標準：正在生病的人聽完，是更安慰，還是更覺得自己被定罪？","③ 把 4:3「踐踏惡人」拿來鼓勵報復、勝利主義，或對別人幸災樂禍\n這句話說的是邪惡不再有轄制人的力量，是公義的盼望，不是報復的許可。\n不可借此鼓勵人踩踏他人，也不可對敵對者多一分仇恨。\n檢驗標準：講完之後，會眾是更盼望公義，還是對某一群人更多怨恨？","④ 把 4:5 的以利亞對應到某一位現代人，或說某人就是「那位以利亞」\n新約自己作過的連結只有：施洗約翰（太11:14、17:10–13、可9:11–13、路1:17）。\n不可把這個稱呼貼在任何今天的人身上，也不可借此建立個人權威。\n檢驗標準：講完之後，會眾是更認識耶穌與約翰，還是開始尋找某個人？","⑤ 把 4:6 講成要求人與傷害自己的父母或兒女和好，或要求受害者先原諒\n4:6 說的是神心意的方向：家的修復；不是對受害者的命令。\n有傷害、有暴力的關係，安全第一；和好需要真實的悔改、時間與適當的協助。\n檢驗標準：曾被家人傷害的人聽完，是覺得有出路，還是覺得自己該回去忍受？","⑥ 把 4:6 結尾「咒詛遍地」講成對家庭不和、父母兒女不親的恐嚇\n這句話是在宣告那日的嚴肅，不是對每一個家庭的威脅。\n講台不可借此讓家庭有困難的人感到被神詛咒。\n檢驗標準：家庭破碎的人聽完，是想回家，還是更想躲起來？","⑦ 把 4:4「記念摩西的律法」講成律法主義，或反過來叫人輕看律法\n經文的重點是在等候的日子裡，守著神的話，不是靠守律法換得救恩。\n不可把律法講成救恩的條件，也不可說舊約的律法與福音對立。\n檢驗標準：講完之後，會眾是更靠恩典，還是更靠行為？","⑧ 把全卷結尾講成「舊約以咒詛結束，舊約的神很可怕」\n4:6 的咒詛，是被日頭、翅膀、醫治、跳躍，還有父子之心圍在中間的。\n不可把舊約與新約的神講成兩位不同的神。\n檢驗標準：講完之後，會眾是更認識神的慈愛，還是對舊約更害怕？","⑨ 把 4:2「出來跳躍如圈裡的肥犢」講成要求人在黑夜裡必須歡喜\n這是日頭升起之後的畫面，不是對正在黑夜中的人的命令。\n悲傷、等候、哭泣的人，不需要假裝沒事。\n檢驗標準：正在黑夜裡的人聽完，是覺得被陪伴，還是覺得自己該笑？"]}],"txt":{"1":["耶和華藉瑪拉基傳給以色列的默示。","耶和華說：「我曾愛你們。」你們卻說：「你在何事上愛我們呢？」耶和華說：「以掃不是雅各的哥哥嗎？我卻愛雅各，","惡以掃，使他的山嶺荒涼，把他的地業交給曠野的野狗。」","以東人說：「我們現在雖被毀壞，卻要重建荒廢之處。」萬軍之耶和華如此說：「任他們建造，我必拆毀；人必稱他們的地為『罪惡之境』；稱他們的民為『耶和華永遠惱怒之民』。」","你們必親眼看見，也必說：「願耶和華在以色列境界之外被尊為大！」","「藐視我名的祭司啊，萬軍之耶和華對你們說：兒子尊敬父親，僕人敬畏主人；我既為父親，尊敬我的在哪裡呢？我既為主人，敬畏我的在哪裡呢？你們卻說：『我們在何事上藐視你的名呢？』","你們將污穢的食物獻在我的壇上，且說：『我們在何事上污穢你呢？』因你們說，耶和華的桌子是可藐視的。","你們將瞎眼的獻為祭物，這不為惡嗎？將瘸腿的、有病的獻上，這不為惡嗎？你獻給你的省長，他豈喜悅你，豈能看你的情面嗎？這是萬軍之耶和華說的。","「現在我勸你們懇求神，他好施恩與我們。這妄獻的事，既由你們經手，他豈能看你們的情面嗎？這是萬軍之耶和華說的。","甚願你們中間有一人關上殿門，免得你們徒然在我壇上燒火。萬軍之耶和華說：我不喜悅你們，也不從你們手中收納供物。","萬軍之耶和華說：從日出之地到日落之處，我的名在外邦中必尊為大。在各處，人必奉我的名燒香，獻潔淨的供物，因為我的名在外邦中必尊為大。","你們卻褻瀆我的名，說：『耶和華的桌子是污穢的，其上的食物是可藐視的。』","你們又說：『這些事何等煩瑣！』並嗤之以鼻。這是萬軍之耶和華說的。你們把搶奪的、瘸腿的、有病的拿來獻上為祭。我豈能從你們手中收納呢？這是耶和華說的。","行詭詐的在群中有公羊，他許願卻用有殘疾的獻給主，這人是可咒詛的。因為我是大君王，我的名在外邦中是可畏的。這是萬軍之耶和華說的。"],"2":["「眾祭司啊，這誡命是傳給你們的。","萬軍之耶和華說：你們若不聽從，也不放在心上，將榮耀歸與我的名，我就使咒詛臨到你們，使你們的福分變為咒詛；因你們不把誡命放在心上，我已經咒詛你們了。","我必斥責你們的種子，又把你們犧牲的糞抹在你們的臉上；你們要與糞一同除掉。","你們就知道我傳這誡命給你們，使我與利未〔或譯：利未人〕所立的約可以常存。這是萬軍之耶和華說的。","我曾與他立生命和平安的約。我將這兩樣賜給他，使他存敬畏的心，他就敬畏我，懼怕我的名。","真實的律法在他口中，他嘴裡沒有不義的話。他以平安和正直與我同行，使多人回頭離開罪孽。","祭司的嘴裡當存知識，人也當由他口中尋求律法，因為他是萬軍之耶和華的使者。","你們卻偏離正道，使許多人在律法上跌倒。你們廢棄我與利未所立的約。這是萬軍之耶和華說的。","所以我使你們被眾人藐視，看為下賤；因你們不守我的道，竟在律法上瞻徇情面。」","我們豈不都是一位父嗎？豈不是一位神所造的嗎？我們各人怎麼以詭詐待弟兄，背棄了神與我們列祖所立的約呢？","猶大人行事詭詐，並且在以色列和耶路撒冷中行一件可憎的事；因為猶大人褻瀆耶和華所喜愛的聖潔〔或譯：聖地〕，娶事奉外邦神的女子為妻。","凡行這事的，無論何人〔何人：原文是叫醒的，答應的〕，就是獻供物給萬軍之耶和華，耶和華也必從雅各的帳棚中剪除他。","你們又行了一件這樣的事，使前妻嘆息哭泣的眼淚遮蓋耶和華的壇，以致耶和華不再看顧那供物，也不樂意從你們手中收納。","你們還說：「這是為什麼呢？」因耶和華在你和你幼年所娶的妻中間作見證。她雖是你的配偶，又是你盟約的妻，你卻以詭詐待她。","雖然神有靈的餘力能造多人，他不是單造一人嗎？為何只造一人呢？乃是他願人得虔誠的後裔。所以當謹守你們的心，誰也不可以詭詐待幼年所娶的妻。","耶和華－以色列的神說：「休妻的事和以強暴待妻的人都是我所恨惡的！所以當謹守你們的心，不可行詭詐。」這是萬軍之耶和華說的。","你們用言語煩瑣耶和華，你們還說：「我們在何事上煩瑣他呢？」因為你們說：「凡行惡的，耶和華眼看為善，並且他喜悅他們」；或說：「公義的神在哪裡呢？」"],"3":["萬軍之耶和華說：「我要差遣我的使者在我前面預備道路。你們所尋求的主必忽然進入他的殿；立約的使者，就是你們所仰慕的，快要來到。」","他來的日子，誰能當得起呢？他顯現的時候，誰能立得住呢？因為他如煉金之人的火，如漂布之人的鹼。","他必坐下如煉淨銀子的，必潔淨利未人，熬煉他們像金銀一樣；他們就憑公義獻供物給耶和華。","那時，猶大和耶路撒冷所獻的供物必蒙耶和華悅納，彷彿古時之日、上古之年。","萬軍之耶和華說：「我必臨近你們，施行審判。我必速速作見證，警戒行邪術的、犯姦淫的、起假誓的、虧負人之工價的、欺壓寡婦孤兒的、屈枉寄居的，和不敬畏我的。」","「因我－耶和華是不改變的，所以你們雅各之子沒有滅亡。","萬軍之耶和華說：從你們列祖的日子以來，你們常常偏離我的典章而不遵守。現在你們要轉向我，我就轉向你們。你們卻問說：『我們如何才是轉向呢？』","人豈可奪取神之物呢？你們竟奪取我的供物。你們卻說：『我們在何事上奪取你的供物呢？』就是你們在當納的十分之一和當獻的供物上。","因你們通國的人都奪取我的供物，咒詛就臨到你們身上。","萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。","萬軍之耶和華說：我必為你們斥責蝗蟲〔原文是吞噬者〕，不容牠毀壞你們的土產。你們田間的葡萄樹在未熟之先也不掉果子。","萬軍之耶和華說：萬國必稱你們為有福的，因你們的地必成為喜樂之地。」","耶和華說：「你們用話頂撞我，你們還說：『我們用什麼話頂撞了你呢？』","你們說：『事奉神是徒然的，遵守神所吩咐的，在萬軍之耶和華面前苦苦齋戒，有什麼益處呢？","如今我們稱狂傲的人為有福，並且行惡的人得建立；他們雖然試探神，卻得脫離災難。』」","那時，敬畏耶和華的彼此談論，耶和華側耳而聽，且有紀念冊在他面前，記錄那敬畏耶和華、思念他名的人。","萬軍之耶和華說：「在我所定的日子，他們必屬我，特特歸我。我必憐恤他們，如同人憐恤服事自己的兒子。","那時你們必歸回，將善人和惡人，事奉神的和不事奉神的，分別出來。」"],"4":["萬軍之耶和華說：「那日臨近，勢如燒著的火爐，凡狂傲的和行惡的必如碎秸，在那日必被燒盡，根本枝條一無存留。","但向你們敬畏我名的人必有公義的日頭出現，其光線〔原文是翅膀〕有醫治之能。你們必出來跳躍如圈裡的肥犢。","你們必踐踏惡人；在我所定的日子，他們必如灰塵在你們腳掌之下。這是萬軍之耶和華說的。","「你們當記念我僕人摩西的律法，就是我在何烈山為以色列眾人所吩咐他的律例典章。","「看哪，耶和華大而可畏之日未到以前，我必差遣先知以利亞到你們那裡去。","他必使父親的心轉向兒女，兒女的心轉向父親，免得我來咒詛遍地。」"]},"blk":{"1":[{"a":1,"z":1,"star":0,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מַשָּׂא דְבַר־יְהוָה אֶל־יִשְׂרָאֵל בְּיַד מַלְאָכִֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華的話的重擔，藉著『我的使者』之手，臨到以色列。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>默示<\/td><td>מַשָּׂא<\/td><td>massa’<\/td><td>H4853<\/td><td>√נשׂא（舉、扛）<\/td><td>重擔、擔子；神諭<\/td><td>字面是「扛起來的東西」——先知把這句話扛在肩上<\/td><\/tr><tr><td>話<\/td><td>דְבַר<\/td><td>devar<\/td><td>H1697<\/td><td>√דבר（說）<\/td><td>話語、事件<\/td><td>不是意見，是耶和華的話<\/td><\/tr><tr><td>瑪拉基<\/td><td>מַלְאָכִֽי<\/td><td>mal’akhi<\/td><td>H4401<\/td><td>מַלְאָךְ（使者）+ ־י（我的）<\/td><td>我的使者<\/td><td>本書只此一次當人名；3:1 同樣的子音拼法又出現<\/td><\/tr><\/table>","gram":"<p><strong>「瑪拉基」是人名，還是稱號？<\/strong><\/p><ul><li><strong>人名說<\/strong>：先知名叫瑪拉基，意思是「我的使者」。<\/li><li><strong>稱號說<\/strong>：這是「我的使者」的略稱，作者沒有留名；古譯本有這樣的讀法。<\/li><\/ul><p>全書只有這一處把這個字當作標題。3:1 又有「我的使者」，子音拼法相同。<\/p><blockquote><p><strong>最好的理解：不裁定。<\/strong>無論先知叫什麼名字，這本書的重量不在作者，在「耶和華的話」。<\/p><\/blockquote>","exp":"<p><strong>全書第一個字，就是「重擔」。<\/strong><\/p><p>這個字從「舉起、扛起」來。先知不是在發表看法，是把一件重的東西扛在肩上，送到人面前。<\/p><p>這句話是對「以色列」說的。殿已經重建，城牆已經立起，人回來了，日子也過了一段。<\/p><p>最容易被忽略的，常常是這種時候：不是外面的敵人，是裡面慢慢涼了。<\/p><p>「以色列」這個名字，在歸回之後，已經是一個小小的、微弱的群體。他們不是沒有熱心：殿有了，祭壇也有了火。<\/p><p>這裡沒有說先知是誰、哪一年。作者把名字留得很淡，叫讀者的眼睛直接落在「耶和華的話」上。<\/p><p>全書的標題只有一句，卻交代了三件事：這是一個重擔（分量），是耶和華的話（來源），是對以色列說的（對象）。先知是誰，在這裡排在最後。<\/p><p>先知不叫人去建什麼。他先替神問一句：你們現在，心在哪裡？<\/p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָהַבְתִּי אֶתְכֶם אָמַר יְהוָה וַאֲמַרְתֶּם בַּמָּה אֲהַבְתָּנוּ הֲלוֹא־אָח עֵשָׂו לְיַֽעֲקֹב נְאֻם־יְהוָה וָאֹהַב אֶֽת־יַעֲקֹֽב׃ וְאֶת־עֵשָׂו שָׂנֵאתִי וָאָשִׂים אֶת־הָרָיו שְׁמָמָה וְאֶת־נַחֲלָתוֹ לְתַנּוֹת מִדְבָּֽר׃<\/p><\/blockquote>","lit":"<blockquote><p>「『我愛過你們，也一直愛著你們』，耶和華說。你們卻說：『你在何事上愛我們呢？』『以掃不是雅各的哥哥嗎？』耶和華說，『我卻愛了雅各，卻恨了以掃，使他的山嶺荒涼，把他的地業交給曠野的野狗。』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>愛<\/td><td>אָהַבְתִּי<\/td><td>’ahavti<\/td><td>H157<\/td><td>√אהב（愛）<\/td><td>愛（完成式：我已愛了，且愛仍在）<\/td><td>★ 全書的第一個動詞，是神的，不是人的<\/td><\/tr><tr><td>何事上<\/td><td>בַּמָּה<\/td><td>bammah<\/td><td>H4100<\/td><td>בְּ（在）+ מָה（什麼）<\/td><td>在什麼事上？<\/td><td>人的第一個反問；全書「你們說」的原型<\/td><\/tr><tr><td>恨<\/td><td>שָׂנֵאתִי<\/td><td>sana’ti<\/td><td>H8130<\/td><td>√שׂנא（恨）<\/td><td>恨；愛得較少、不選<\/td><td>與創 29:30–31 並讀：「愛／恨」是比較的語言<\/td><\/tr><tr><td>以東<\/td><td>אֱדוֹם<\/td><td>’edom<\/td><td>H123<\/td><td>אָדֹם（紅）<\/td><td>以東（以掃的別名，創 36:1）<\/td><td>神的愛，用一個鄰居的歷史作對比<\/td><\/tr><tr><td>野狗<\/td><td>לְתַנּוֹת<\/td><td>tannot<\/td><td>H8568<\/td><td>תַּן（豺狼、野狗）<\/td><td>曠野的野獸<\/td><td>荒涼的畫面，不是對今日誰的預言<\/td><\/tr><\/table>","gram":"<p><strong>① 「我愛雅各，恨以掃」是什麼意思？<\/strong><\/p><ul><li><strong>兩個民族的歷史<\/strong>：以色列得了土地與約，以東的山地荒涼。<\/li><li><strong>比較的語言<\/strong>：「愛／恨」在聖經常指「選了／沒選」，如創 29:30–31 的利亞被「恨」，實是「不如拉結被愛」。路 14:26 與太 10:37 也是同一種說法。<\/li><li><strong>新約的引用<\/strong>：羅 9:13 引用本節，談神的揀選出於他自己，不出於人的行為。<\/li><\/ul><p><strong>② 「我曾愛你們」是什麼時態？<\/strong>完成式的 אָהַבְתִּי：愛已經發生，並且仍在。<\/p><blockquote><p><strong>最好的理解：<\/strong>「愛」是神先開口說的，而且是在人還沒有感覺的時候說的。本講義不拿這節去論斷任何國家或族群，也不講成「神棄絕某些人」。<\/p><\/blockquote>","exp":"<p><strong>神開口的第一句，不是責備，是「我愛你們」。<\/strong><\/p><p>接著是人的回嘴：「你在何事上愛我們呢？」這不是不信的人在問，是回來了、重建了、卻覺得日子還是不順的人在問。<\/p><p>你有沒有過這樣的時候：別人說「我愛你」，你心裡的聲音卻是「哪裡看得出來」？<\/p><p>神沒有惱，也沒有改口。他拿出的不是一個理論，是一段歷史：同樣是一對孿生兄弟，同樣的起點，神選了這一邊，叫他們回到這塊地。<\/p><p>這句話要小心用。它不是拿來比較人、排名次，也不是拿來看別人的荒涼。它只說一件事：你今天還在這裡，是因為有人先愛了你。<\/p><p>「愛」的動詞在這一節出現三次：神說「我愛了」，人問「你愛了嗎」，神又說「我愛了雅各」。一個被問到的愛，神不改口，只是再說一次。<\/p><p>被拿來比較的，是兩個起頭一樣的人：孿生，同一個母腹。神不是拿一個好的去比一個壞的，是拿「同一個起點」說：你被揀選，不是因為你比較好。這使人謙卑，不使人驕傲。<\/p><p><strong>愛在前面，回應在後面。<\/strong>這個次序，是全書的第一個次序，也是我們生命的次序。<\/p>"},{"a":4,"z":5,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי־תֹאמַר אֱדוֹם רֻשַּׁשְׁנוּ וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת כֹּה אָמַר יְהוָה צְבָאוֹת הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרוֹס וְקָרְאוּ לָהֶם גְּבוּל רִשְׁעָה וְהָעָם אֲשֶׁר־זָעַם יְהוָה עַד־עוֹלָֽם׃ וְעֵינֵיכֶם תִּרְאֶינָה וְאַתֶּם תֹּֽאמְרוּ יִגְדַּל יְהוָה מֵעַל לִגְבוּל יִשְׂרָאֵֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「以東若說：『我們被打碎了，卻要回來重建荒廢之處』，萬軍之耶和華如此說：『任他們建造，我必拆毀；人必稱他們為「罪惡之境」，稱他們為「耶和華永遠發怒的百姓」。你們的眼睛必親眼看見，你們也必說：「願耶和華在以色列境界之外被尊為大！」』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>重建<\/td><td>וְנִבְנֶה<\/td><td>nivneh<\/td><td>H1129<\/td><td>√בנה（建）<\/td><td>建造<\/td><td>人說「我們要重建」，神說「我必拆毀」——人的建造與神的建造相對<\/td><\/tr><tr><td>拆毀<\/td><td>אֶהֱרוֹס<\/td><td>’eheros<\/td><td>H2040<\/td><td>√הרס（拆毀）<\/td><td>拆毀、推倒<\/td><td>不是人的努力，是神的主權在說話<\/td><\/tr><tr><td>萬軍<\/td><td>צְבָאוֹת<\/td><td>tseva’ot<\/td><td>H6635<\/td><td>צָבָא（軍旅）<\/td><td>萬軍、眾軍<\/td><td>全書出現 24 次的稱呼，從這裡第一次出現<\/td><\/tr><tr><td>尊為大<\/td><td>יִגְדַּל<\/td><td>yigdal<\/td><td>H1431<\/td><td>√גדל（大）<\/td><td>被尊為大、被顯為大<\/td><td>第一次的「大」；1:11、1:14 還要再出現<\/td><\/tr><\/table>","gram":"<p>「萬軍之耶和華」從這節第一次出現，之後全書出現 24 次。這個稱呼把「耶和華」與「天上、地上一切的軍旅」連在一起，是說：說話的那位，沒有誰能壓過他。<\/p><p><strong>「以色列境界之外」<\/strong>是指耶和華的名被人看見、被尊為大，不限於以色列自己的邊界。這個「大」，在 1:11、1:14 還要再出現兩次。<\/p>","exp":"<p><strong>人想重建，神說拆毀。<\/strong><\/p><p>這不是兩種建築師在比賽，是兩種「靠誰」的人在說話。<\/p><p>以東說：我們被打碎了，我們自己來。神說：你們看吧。<\/p><p>最後那一句有趣：<strong>連神的百姓，也要學會說：「願耶和華被尊為大。」<\/strong><\/p><p>不是「願我被看見」，不是「願我的重建成功」，是「願他被尊為大」。<\/p><p>以東人的話，很像今天許多人的話：塌了，沒關係，我們再來。這句話本身不壞。經文給的理由是「罪惡之境」：問題不在建，在他們建在什麼上面。<\/p><p>神的建造與人的建造，在這裡短短碰了一次面。<\/p><p>這一小段看起來在說以東，其實是在為下一段鋪路：神的名要在以色列境界之外被尊為大，那麼，在境界之內、天天站在壇前的祭司呢？<\/p><p>往下，這句話將變成一個問題：既然這樣，你們獻給他的，配得上這句話嗎？<\/p>"},{"a":6,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בֵּן יְכַבֵּד אָב וְעֶבֶד אֲדֹנָיו וְאִם־אָב אָנִי אַיֵּה כְבוֹדִי וְאִם־אֲדוֹנִים אָנִי אַיֵּה מוֹרָאִי אָמַר יְהוָה צְבָאוֹת לָכֶם הַכֹּֽהֲנִים בּוֹזֵי שְׁמִי וַאֲמַרְתֶּם בַּמֶּה בָזִינוּ אֶת־שְׁמֶֽךָ׃ מַגִּישִׁים עַֽל־מִזְבְּחִי לֶחֶם מְגֹאָל וַאֲמַרְתֶּם בַּמֶּה גֵֽאַלְנוּךָ בֶּאֱמָרְכֶם שֻׁלְחַן יְהוָה נִבְזֶה הֽוּא׃<\/p><\/blockquote>","lit":"<blockquote><p>「『兒子尊榮父親，僕人尊敬主人。我若是父，我的尊榮在哪裡呢？我若是主，我的敬畏在哪裡呢？』萬軍之耶和華對你們說，藐視我名的祭司啊。你們卻說：『我們在何事上藐視你的名呢？』你們把污穢的食物獻在我的壇上，卻說：『我們在何事上污穢你呢？』因為你們說，耶和華的桌子是可藐視的。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>父<\/td><td>אָב<\/td><td>’av<\/td><td>H1<\/td><td>אָב<\/td><td>父親<\/td><td>神自稱為父——責備從「關係」開口，不從「規條」開口<\/td><\/tr><tr><td>尊榮<\/td><td>כְבוֹדִי<\/td><td>kevodi<\/td><td>H3519<\/td><td>√כבד（重）<\/td><td>重量、榮耀、尊重<\/td><td>★ 「榮耀」的字根是「有重量」：你把我放得多重？<\/td><\/tr><tr><td>敬畏<\/td><td>מוֹרָאִי<\/td><td>mora’i<\/td><td>H4172<\/td><td>√ירא（懼、敬）<\/td><td>敬畏、可畏<\/td><td>2:5 要再出現：敬畏我的祭司<\/td><\/tr><tr><td>藐視<\/td><td>בּוֹזֵי<\/td><td>bozei<\/td><td>H959<\/td><td>√בזה（藐視）<\/td><td>輕看、看為無用<\/td><td>1:7 的「可藐視」是同一個字的被動<\/td><\/tr><tr><td>污穢<\/td><td>מְגֹאָל<\/td><td>meg’o’al<\/td><td>H1351<\/td><td>√גאל（污染）<\/td><td>被玷污的<\/td><td>與「贖回」的 גאל（H1350）同形不同字，這裡是「玷污」<\/td><\/tr><\/table>","gram":"<p><strong>「在何事上……？」是什麼樣的問法？<\/strong><\/p><ul><li>這是全書的句式：神一句，人回一句「你說我哪裡……」。<\/li><li>這樣的問，不是在求知，是在<strong>辯護<\/strong>：我沒有，哪裡有。<\/li><\/ul><p>「נִבְזֶה」（1:7）是 בָּזָה 的被動：人們說，耶和華的桌子「被看為無用」。<\/p><blockquote><p><strong>最好的理解：<\/strong>祭司嘴上沒有說「我輕看神」，是行動、態度、獻上的東西，把這句話說出來了。<\/p><\/blockquote>","exp":"<p><strong>「我若是父，我的尊榮在哪裡呢？」<\/strong><\/p><p>神把話說在「家」裡，不說在「廟」裡。他先說「我是父」，才說「你們是祭司」。<\/p><p>「尊榮」的字根，意思是「有重量」。這句話其實是在問：你把我放得多重？<\/p><p>被問的人，卻說：「哪有？」<\/p><p>這是最難的一種光景：<strong>人不覺得自己有問題。<\/strong><\/p><p>神沒有一開始就列罪狀，他只指著一樣東西：你們獻在我壇上的。<\/p><p>祭司的位置很特別：他們站在神與百姓之間。他們的敷衍，百姓看得最清楚，也學得最快。<\/p><p>「耶和華的桌子」在以西結書也指祭壇（結 41:22；44:16）。神把壇叫作「我的桌子」：他是主人，人是被招待的那一邊。<\/p><p>還有一個細節：神說「藐視我名」，百姓卻問「何事上」。他們看不見自己的輕看，因為輕看不是一個動作，是一種習慣。<\/p><p>我們也常常如此。嘴上沒有輕看，帳目上、時間上、精神上，把最好的留給了別處。<\/p>"},{"a":8,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְכִֽי־תַגִּשׁוּן עִוֵּר לִזְבֹּחַ אֵין רָע וְכִי תַגִּישׁוּ פִּסֵּחַ וְחֹלֶה אֵין רָע הַקְרִיבֵהוּ נָא לְפֶחָתֶךָ הֲיִּרְצְךָ אוֹ הֲיִשָּׂא פָנֶיךָ אָמַר יְהוָה צְבָאֽוֹת׃ וְעַתָּה חַלּוּ־נָא פְנֵי־אֵל וִֽיחָנֵנוּ מִיֶּדְכֶם הָיְתָה זֹּאת הֲיִשָּׂא מִכֶּם פָּנִים אָמַר יְהוָה צְבָאֽוֹת׃ מִי גַם־בָּכֶם וְיִסְגֹּר דְּלָתַיִם וְלֹֽא־תָאִירוּ מִזְבְּחִי חִנָּם אֵֽין־לִי חֵפֶץ בָּכֶם אָמַר יְהוָה צְבָאוֹת וּמִנְחָה לֹֽא־אֶרְצֶה מִיֶּדְכֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「『你們把瞎眼的獻為祭物，這不為惡嗎？把瘸腿的、有病的獻上，這不為惡嗎？把它獻給你的省長，他豈喜悅你，豈肯看你的情面？』萬軍之耶和華說。『現在，求你們懇求神，叫他施恩給我們。這事既由你們的手而來，他豈肯看你們的情面？』萬軍之耶和華說。『甚願你們中間有一人關上殿門，免得你們徒然在我壇上燒火。我不喜悅你們，也不從你們手中收納供物。』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>瞎眼<\/td><td>עִוֵּר<\/td><td>‘iwwer<\/td><td>H5787<\/td><td>עִוֵּר<\/td><td>瞎的<\/td><td>律法明禁（利 22:22；申 15:21）<\/td><\/tr><tr><td>瘸腿<\/td><td>פִּסֵּחַ<\/td><td>pisseach<\/td><td>H6455<\/td><td>פִּסֵּחַ<\/td><td>瘸的<\/td><td>與「有病的」同列<\/td><\/tr><tr><td>省長<\/td><td>לְפֶחָתֶךָ<\/td><td>pechatekha<\/td><td>H6346<\/td><td>פֶּחָה（總督）<\/td><td>省長、總督<\/td><td>哈 1:1 稱所羅巴伯同一個字——同一時代的人<\/td><\/tr><tr><td>喜悅<\/td><td>הֲיִּרְצְךָ<\/td><td>yirtsekha<\/td><td>H7521<\/td><td>√רצה（喜悅、接納）<\/td><td>接納、喜悅<\/td><td>1:10、1:13 的「收納」同一字根<\/td><\/tr><tr><td>徒然<\/td><td>חִנָּם<\/td><td>chinnam<\/td><td>H2600<\/td><td>חֵן（恩）+ ־ם<\/td><td>白白地、無功地<\/td><td>◇ 白燒的火：沒有被接納的敬拜<\/td><\/tr><\/table>","gram":"<p><strong>① 「這不為惡嗎？」是什麼語氣？<\/strong>是反問，而且問了兩次：獻瞎眼的，獻瘸腿有病的。<\/p><p><strong>② 「有一人關上殿門」是什麼意思？<\/strong><\/p><ul><li><strong>諷刺說<\/strong>：與其白白燒火，不如關門；神寧可沒有敬拜，也不要敷衍的敬拜。<\/li><li><strong>祈願說<\/strong>：盼望有人起來，把殿門關了，叫人醒悟。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>這是神極重的一句話，但它不是要人從此不敬拜，是要人看見：<strong>把殘缺的給神，卻把完整的留給省長，這是不公平的。<\/strong>本講義不拿它去攻擊今日的牧者，也不替任何領袖的過錯作掩護。<\/p><\/blockquote>","exp":"<p><strong>你把這隻羊，拿去給省長試試看。<\/strong><\/p><p>神用的是最生活的比較：你不敢拿瘸腿的羊去見省長，卻拿來見我。<\/p><p>律法本來就說得清楚：獻給神的，要無殘疾。這不是新規定，是人把它放到哪裡去了。<\/p><p>最重的一句，是「關上殿門」。神說，寧可你們不燒。<\/p><p>這句話不是要人不獻，是要人醒。<strong>神要的不是獻的動作，是獻的心。<\/strong><\/p><p>每個人心裡都有一個「省長」：老闆、客戶、面子、別人的眼光。我們常常把最好的給了他們，把剩下的給神。<\/p><p>「情面」的字是「臉」：省長的臉，與神的臉。我們很在意前一張臉的臉色，卻常常忘了後一張臉也在看。<\/p><p>這是神第一次說「我不喜悅你們」（1:10）；後面他還要說到「我必臨近你們」（3:5）。<\/p><p>今天，不是要你多獻什麼，是請你問：我的「最好」，最後落在誰的手裡？<\/p>"},{"a":11,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי מִמִּזְרַח־שֶׁמֶשׁ וְעַד־מְבוֹאוֹ גָּדוֹל שְׁמִי בַּגּוֹיִם וּבְכָל־מָקוֹם מֻקְטָר מֻגָּשׁ לִשְׁמִי וּמִנְחָה טְהוֹרָה כִּֽי־גָדוֹל שְׁמִי בַּגּוֹיִם אָמַר יְהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「『因為從日出之處直到日落之處，我的名在列國中必為大。在各處，人必向我的名燒香，獻潔淨的供物，因為我的名在列國中必為大。』萬軍之耶和華說。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>日出<\/td><td>מִמִּזְרַח<\/td><td>mimmizrach<\/td><td>H4217<\/td><td>√זרח（升起）<\/td><td>日出之處、東方<\/td><td>從東到西——整個世界<\/td><\/tr><tr><td>大<\/td><td>גָּדוֹל<\/td><td>gadol<\/td><td>H1419<\/td><td>√גדל（大）<\/td><td>大<\/td><td>本節出現兩次，與 1:14「大君王」相連<\/td><\/tr><tr><td>燒香<\/td><td>מֻקְטָר<\/td><td>meqatter<\/td><td>H6999<\/td><td>√קטר（燒香）<\/td><td>燒香、使煙上升<\/td><td>分詞：正在發生，或將要發生<\/td><\/tr><tr><td>供物<\/td><td>וּמִנְחָה<\/td><td>minchah<\/td><td>H4503<\/td><td>מִנְחָה<\/td><td>素祭、供物<\/td><td>與 1:10 神拒收的「供物」同一個字<\/td><\/tr><tr><td>潔淨<\/td><td>טְהוֹרָה<\/td><td>tehorah<\/td><td>H2889<\/td><td>√טהר（潔淨）<\/td><td>潔淨的<\/td><td>與 1:7 的「污穢」相對<\/td><\/tr><\/table>","gram":"<p><strong>① 「列國中必為大」是什麼時候？<\/strong><\/p><ul><li><strong>將來說<\/strong>：預言列國將來要敬拜耶和華。<\/li><li><strong>當時說<\/strong>：指散居各地的猶太人，在列邦中敬拜神。<\/li><li><strong>普世說<\/strong>：傳統教會讀成福音要傳到萬邦。<\/li><\/ul><p>經文用的是分詞，沒有明確的時態，所以三種讀法各有支持。<\/p><blockquote><p><strong>最好的理解：不裁定。<\/strong>無論哪一種，經文的重點一致：<strong>神的名從來不靠以色列的敬拜才成為大。<\/strong>本節<strong>不能<\/strong>用來推論「各宗教所拜的都是同一位神」，也不替任何宣教策略背書。<\/p><\/blockquote>","exp":"<p><strong>在祭司的敷衍旁邊，神放了一幅大圖。<\/strong><\/p><p>從日出到日落，從東到西，神的名要在列國中為大。<\/p><p>這是一個很大的反差：這邊是瞎眼的羊，那邊是潔淨的供物；這邊是被看為無用的桌子，那邊是向他的名升起的香。<\/p><p>說這句話的神，並沒有缺人。他不需要我們的敬拜撐場。<\/p><p>這句話很安靜地把我們放回位置：<strong>神的榮耀不是靠我們才成立的。<\/strong><\/p><p>我們來敬拜，是得到一個本來就大的名，不是替他把名撐大。<\/p><p>這節放在前後節之間，像一個彎：前面是「桌子被藐視」，後面又是「桌子被褻瀆」（1:12），中間忽然放進一個大的、亮的畫面。<\/p><p>聖經裡的「名」不是標籤，是這個人是誰。名被尊為大，就是他本身被看為大。<\/p><p>這一點想通了，人就不再需要「獻得夠不夠」的焦慮。<\/p>"},{"a":12,"z":13,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאַתֶּם מְחַלְּלִים אוֹתוֹ בֶּאֱמָרְכֶם שֻׁלְחַן אֲדֹנָי מְגֹאָל הוּא וְנִיבוֹ נִבְזֶה אָכְלֽוֹ׃ וַאֲמַרְתֶּם הִנֵּה מַתְּלָאָה וְהִפַּחְתֶּם אוֹתוֹ אָמַר יְהוָה צְבָאוֹת וַהֲבֵאתֶם גָּזוּל וְאֶת־הַפִּסֵּחַ וְאֶת־הַחוֹלֶה וַהֲבֵאתֶם אֶת־הַמִּנְחָה הַאֶרְצֶה אוֹתָהּ מִיֶּדְכֶם אָמַר יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「『你們卻褻瀆我的名，說：「主的桌子是被玷污的，其上的食物是可藐視的。」你們又說：「這是何等的煩瑣！」又對它嗤之以鼻。』萬軍之耶和華說，『你們把搶來的、瘸腿的、有病的帶來獻上。我豈能從你們手中收納呢？』耶和華說。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>褻瀆<\/td><td>מְחַלְּלִים<\/td><td>mechallelim<\/td><td>H2490<\/td><td>√חלל（使成為俗）<\/td><td>褻瀆、使變為平常<\/td><td>把聖的東西變成平常<\/td><\/tr><tr><td>煩瑣<\/td><td>מַתְּלָאָה<\/td><td>mattela’ah<\/td><td>H4972<\/td><td>√לאה（疲倦）<\/td><td>疲累、麻煩<\/td><td>★ 「何等的煩瑣！」是 1:13 的核心：敬拜成了負擔<\/td><\/tr><tr><td>嗤之以鼻<\/td><td>וְהִפַּחְתֶּם<\/td><td>vehippachtem<\/td><td>H5301<\/td><td>√נפח（吹）<\/td><td>吹氣、不屑地吹<\/td><td>一聲鼻息，把神的桌子吹走了<\/td><\/tr><tr><td>搶來的<\/td><td>גָּזוּל<\/td><td>gazul<\/td><td>H1497<\/td><td>√גזל（搶奪）<\/td><td>搶奪來的<\/td><td>連獻的東西，都是不乾淨的來路<\/td><\/tr><\/table>","gram":"<p><strong>① 「嗤之以鼻」是什麼動作？<\/strong>這個動詞從「吹氣」來，指一聲不屑的鼻息。猶太傳統有一種「文士改字」的說法：原文可能是「對我嗤之以鼻」，抄寫時為了敬意改成了「對它」。這是傳統的看法，不是定論。<\/p><blockquote><p><strong>最好的理解：<\/strong>無論哪一種，畫面不變：<strong>敬拜已經不是歡喜，是一件麻煩事。<\/strong><\/p><\/blockquote><p><strong>② 「煩瑣」<\/strong>與 2:17 的「煩瑣」不是同一個字：這裡是人嫌敬拜累，2:17 是人用話語累神。<\/p>","exp":"<p><strong>最危險的，不是不敬拜，是敬拜成了一件「煩」的事。<\/strong><\/p><p>「何等的煩瑣！」這句話，不是唸出來的，是嘆出來的，伴隨一聲鼻息。<\/p><p>今天許多人，不是不信，是累了。主日是一件事，禱告是一件事，服事也是一件事。<\/p><p>神沒有說「你們不該累」。他說的是：你們拿來獻上的，是搶來的、瘸的、病的——是你最不想要的。<\/p><p>這是一個很深的觀察：<strong>敬拜若被排在待辦事項的最後，人就一定會覺得煩。<\/strong><\/p><p>從 1:6 到這裡，「你們卻說」已經出現好幾次。這些話一次比一次輕、一次比一次短，最後只剩一聲鼻息。<\/p><p>「何等的煩瑣」不是一個突然的結論，是一種累積。每一次把「差不多」拿來獻上，下一次就更容易。<\/p><p>不是時間不夠，是位置排錯了。位置對了，煩瑣，會變回歡喜。<\/p>"},{"a":14,"z":14,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאָרוּר נוֹכֵל וְיֵשׁ בְּעֶדְרוֹ זָכָר וְנֹדֵר וְזֹבֵחַ מָשְׁחָת לַֽאדֹנָי כִּי מֶלֶךְ גָּדוֹל אָנִי אָמַר יְהוָה צְבָאוֹת וּשְׁמִי נוֹרָא בַגּוֹיִֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「『詭詐的人是可咒詛的：他群中有公羊，他許了願，卻把有殘疾的獻給主。因為我是大君王，我的名在列國中是可畏的。』萬軍之耶和華說。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>詭詐<\/td><td>נוֹכֵל<\/td><td>nokhel<\/td><td>H5230<\/td><td>√נכל（欺詐）<\/td><td>行詭詐的<\/td><td>2:10–16 還要用「詭詐」（בגד）談人與人<\/td><\/tr><tr><td>許願<\/td><td>וְנֹדֵר<\/td><td>neder<\/td><td>H5088<\/td><td>√נדר（許願）<\/td><td>誓願<\/td><td>許了的，就是欠下的；不是隨手的<\/td><\/tr><tr><td>殘疾<\/td><td>מָשְׁחָת<\/td><td>mashchat<\/td><td>H4889<\/td><td>√שׁחת（毀壞）<\/td><td>毀壞、有毛病<\/td><td>與 1:8 的瞎眼、瘸腿、有病呼應<\/td><\/tr><tr><td>君王<\/td><td>מֶלֶךְ<\/td><td>melekh<\/td><td>H4428<\/td><td>√מלך（作王）<\/td><td>王<\/td><td>★ 全章最後定在：神是大君王<\/td><\/tr><tr><td>可畏<\/td><td>נוֹרָא<\/td><td>nora’<\/td><td>H3372<\/td><td>√ירא（懼、敬）<\/td><td>可畏的<\/td><td>與 1:6 的「敬畏」同字根：問題的答案在這裡<\/td><\/tr><\/table>","gram":"<p>本節有兩個反差：<strong>「群中有公羊」<\/strong>，他有好的；<strong>「卻把有殘疾的獻上」<\/strong>，他獻的是壞的。問題不是窮，是選擇。<\/p><p>「大君王」與「可畏」，正好回答 1:6 的問題：<strong>「我的敬畏在哪裡呢？」<\/strong>敬畏的根據，不是祭司的表現，是神是誰。<\/p>","exp":"<p><strong>全章最後一句，把鏡頭拉回神身上。<\/strong><\/p><p>人有好的，卻選了壞的。神沒有說「你窮」，他說的是：「因為我是大君王。」<\/p><p>這是全章從開頭到結尾的一個圓：開頭說「我曾愛你們」，結尾說「我是大君王」。<\/p><p>愛我們的，是這位大君王；要我們敬畏的，也是這位愛我們的。<\/p><p>這是一個讓人鬆口氣的次序。<strong>我們不是在伺候一位挑剔的神，是在回應一位先愛了我們的君王。<\/strong><\/p><p>許願，是在神面前把話說出口。許了又換，是把話留在嘴上，把好的留在家裡。<\/p><p>「大君王」這個稱呼，在古代近東常是宗主對屬國立約時用的。這個語氣在說：你們與我之間，是有約的，不是隨意的往來。<\/p><p>讓耶穌作王，從這句話開始：不是我選一個「夠好」的給他，是我認出：他是王。<\/p>"}],"2":[{"a":1,"z":3,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַתָּה אֲלֵיכֶם הַמִּצְוָה הַזֹּאת הַכֹּהֲנִֽים׃ אִם־לֹא תִשְׁמְעוּ וְאִם־לֹא תָשִׂימוּ עַל־לֵב לָתֵת כָּבוֹד לִשְׁמִי אָמַר יְהוָה צְבָאוֹת וְשִׁלַּחְתִּי בָכֶם אֶת־הַמְּאֵרָה וְאָרוֹתִי אֶת־בִּרְכֽוֹתֵיכֶם וְגַם אָרוֹתִיהָ כִּי אֵינְכֶם שָׂמִים עַל־לֵֽב׃ הִנְנִי גֹעֵר לָכֶם אֶת־הַזֶּרַע וְזֵרִיתִי פֶרֶשׁ עַל־פְּנֵיכֶם פֶּרֶשׁ חַגֵּיכֶם וְנָשָׂא אֶתְכֶם אֵלָֽיו׃<\/p><\/blockquote>","lit":"<blockquote><p>「現在，眾祭司啊，這誡命是對你們說的。萬軍之耶和華說：你們若不聽，若不放在心上，把榮耀歸給我的名，我就使咒詛臨到你們，使你們的福分變為咒詛；是的，我已經咒詛它了，因為你們不放在心上。看哪，我要斥責你們的種子，把糞抹在你們臉上，就是你們節期祭牲的糞；你們要被帶到糞那裡去。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>誡命<\/td><td>הַמִּצְוָה<\/td><td>hammitswah<\/td><td>H4687<\/td><td>√צוה（命令）<\/td><td>命令、誡命<\/td><td>單數：不是一條律例，是一個託付<\/td><\/tr><tr><td>放在心上<\/td><td>תָשִׂימוּ<\/td><td>tasimu<\/td><td>H7760<\/td><td>√שׂים（放、置）<\/td><td>放置（常與「心」連用）<\/td><td>★ 與 1:6 之後的冷淡相對：不放在心上，就是不當一回事<\/td><\/tr><tr><td>咒詛<\/td><td>הַמְּאֵרָה<\/td><td>hamme’erah<\/td><td>H3994<\/td><td>√ארר（咒詛）<\/td><td>咒詛<\/td><td>福分變成咒詛：恩典的反面，是同一份東西的變質<\/td><\/tr><tr><td>斥責<\/td><td>גֹעֵר<\/td><td>go‘er<\/td><td>H1605<\/td><td>√גער（斥責）<\/td><td>斥責、喝止<\/td><td>同一個動詞，3:11 神又用來斥責蝗蟲<\/td><\/tr><tr><td>糞<\/td><td>פֶרֶשׁ<\/td><td>peresh<\/td><td>H6569<\/td><td>—<\/td><td>祭牲的糞<\/td><td>最強烈的畫面：敷衍的祭，變成抹在臉上的穢物<\/td><\/tr><\/table>","gram":"<p><strong>① 「種子」是什麼？<\/strong><\/p><ul><li><strong>「種子」說<\/strong>（希伯來文 <strong>זֶרַע<\/strong>）：祭司的後裔，或祭司所帶來的收成。<\/li><li><strong>「膀臂」說<\/strong>：古代譯本（如七十士譯本）讀成「膀臂」，意為祭司的職分與能力。<\/li><\/ul><blockquote><p><strong>最好的理解：不裁定。<\/strong>無論哪一種，意思都是：祭司所靠的，被神斥責。<\/p><\/blockquote><p><strong>② 「福分變為咒詛」<\/strong>不是說神另外加了一個懲罰，是說：神給祭司的「福分」（祝福百姓的職分），在他們手裡變了質。<\/p>","exp":"<p><strong>第二章的第一個詞是「現在」。<\/strong><\/p><p>前一章結束在「我是大君王，我的名在列國中是可畏的」。這個「現在」是說：既然是這樣，你們這些祭司，聽好。<\/p><p>「不放在心上」，是最常見、也最容易被原諒的罪。不是頂撞，不是背叛，只是沒有擺在心裡。<\/p><p>神把這樣的光景，說得很重：福變成咒，供物變成糞。<\/p><p>這不是在嚇人。這是一個很實在的觀察：<strong>神給人的最好的東西，一旦不放在心上，就會開始腐壞。<\/strong><\/p><p>祭司的祝福，本來是民數記 6:24–26 那三句「願耶和華賜福給你」。這裡說「福分變為咒詛」，意思是：替人祝福的，自己先沒有福。<\/p><p>每一個站在前面服事的人，都該常常問自己：我今天，把神放在心上了嗎？還是只是在做事？<\/p>"},{"a":4,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וִֽידַעְתֶּם כִּי שִׁלַּחְתִּי אֲלֵיכֶם אֵת הַמִּצְוָה הַזֹּאת לִֽהְיוֹת בְּרִיתִי אֶת־לֵוִי אָמַר יְהוָה צְבָאֽוֹת׃ בְּרִיתִי הָיְתָה אִתּוֹ הַֽחַיִּים וְהַשָּׁלוֹם וָאֶתְּנֵֽם־לוֹ מוֹרָא וַיִּֽירָאֵנִי וּמִפְּנֵי שְׁמִי נִחַת הֽוּא׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們就知道，我把這誡命送給你們，是要我與利未所立的約得以存留，萬軍之耶和華說。我與他立的約是生命與平安；我把這兩樣賜給他，是為了敬畏。他就敬畏我，在我的名面前戰兢。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>約<\/td><td>בְּרִיתִי<\/td><td>beriti<\/td><td>H1285<\/td><td>כָּרַת בְּרִית（「切約」慣用語）<\/td><td>約、盟約<\/td><td>★ 全卷出現 6 次，這裡連出現兩次（2:4、5）<\/td><\/tr><tr><td>利未<\/td><td>לֵוִי<\/td><td>Lewi<\/td><td>H3878<\/td><td>—<\/td><td>利未（人），祭司之族<\/td><td>約的對象不是個人，是一個職分<\/td><\/tr><tr><td>生命<\/td><td>הַֽחַיִּים<\/td><td>hachayyim<\/td><td>H2416<\/td><td>√חיה（活）<\/td><td>生命<\/td><td>與「平安」並列：約的內容<\/td><\/tr><tr><td>平安<\/td><td>וְהַשָּׁלוֹם<\/td><td>weshshalom<\/td><td>H7965<\/td><td>√שׁלם（完全）<\/td><td>平安、完整<\/td><td>不只是沒有衝突，是完整<\/td><\/tr><tr><td>戰兢<\/td><td>נִחַת<\/td><td>nichat<\/td><td>H2865<\/td><td>√חתת（驚懼、屈服）<\/td><td>戰兢、敬畏而低頭<\/td><td>敬畏的最終樣子：低下頭來<\/td><\/tr><\/table>","gram":"<p><strong>① 「利未的約」指哪一次？<\/strong>民 25:12–13 提到與非尼哈立的「平安的約」；申 33:8–11 也祝福利未。本節把這些合起來，說「生命與平安的約」。<\/p><p><strong>② 「為了敬畏」<\/strong>的原文，神賜下生命與平安，目的是「敬畏」。不是先敬畏、才有生命，是先有生命，才能敬畏。<\/p><blockquote><p><strong>最好的理解：<\/strong>約的內容是生命與平安，約的回應是敬畏。次序是：神先給，人才回應。<\/p><\/blockquote>","exp":"<p><strong>這份約，開頭是給的，不是要的。<\/strong><\/p><p>神說：我把生命與平安賜給他。是「賜」，不是「換」。祭司的敬畏，是領受之後的樣子，不是去賺來的。<\/p><p>「戰兢」這個字，有「在他面前低下頭」的畫面。不是怕被打，是遇見了比自己大的。<\/p><p>我們常常把敬畏想成一個要擠出來的態度，好像只要夠用力，就能夠敬畏。<\/p><p>但是經文的次序是倒過來的：<strong>先被給了生命與平安，才真正低得下頭。<\/strong><\/p><p>「利未」在這裡不是一個個人，是一個族。約是給整個職分的，所以後來每一代的祭司，都被這句話看著。<\/p><p>在神面前，我們不需要努力顯得謙卑。看見他是誰，頭自己就會低下來。<\/p>"},{"a":6,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>תּוֹרַת אֱמֶת הָיְתָה בְּפִיהוּ וְעַוְלָה לֹא־נִמְצָא בִשְׂפָתָיו בְּשָׁלוֹם וּבְמִישׁוֹר הָלַךְ אִתִּי וְרַבִּים הֵשִׁיב מֵעָוֺֽן׃ כִּֽי־שִׂפְתֵי כֹהֵן יִשְׁמְרוּ־דַעַת וְתוֹרָה יְבַקְשׁוּ מִפִּיהוּ כִּי מַלְאַךְ יְהוָֽה־צְבָאוֹת הֽוּא׃<\/p><\/blockquote>","lit":"<blockquote><p>「真實的教導在他口中，不義的事不在他嘴唇上被找到。他以平安與正直與我同行，又使許多人回頭，離開罪孽。因為祭司的嘴唇當保守知識，人也當從他口中尋求教導，因為他是萬軍之耶和華的使者。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>教導<\/td><td>תּוֹרַת<\/td><td>torat<\/td><td>H8451<\/td><td>√ירה（指示）<\/td><td>律法、教導<\/td><td>原意是「指方向」，不只是條文<\/td><\/tr><tr><td>真實<\/td><td>אֱמֶת<\/td><td>’emet<\/td><td>H571<\/td><td>√אמן（穩固）<\/td><td>真實、可靠<\/td><td>站得住的教導<\/td><\/tr><tr><td>正直<\/td><td>וּבְמִישׁוֹר<\/td><td>bemishor<\/td><td>H4334<\/td><td>√ישׁר（平）<\/td><td>平坦、正直<\/td><td>路平，不是彎曲的<\/td><\/tr><tr><td>回頭<\/td><td>הֵשִׁיב<\/td><td>heshiv<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>使轉回<\/td><td>★ 祭司的職分：使許多人轉回，不是使許多人跌倒<\/td><\/tr><tr><td>罪孽<\/td><td>מֵעָוֺֽן<\/td><td>mei‘avon<\/td><td>H5771<\/td><td>√עוה（彎曲）<\/td><td>罪孽、彎曲<\/td><td>與「正直」（平）相對：直與彎<\/td><\/tr><tr><td>使者<\/td><td>מַלְאַךְ<\/td><td>mal’akh<\/td><td>H4397<\/td><td>—<\/td><td>使者<\/td><td>祭司被稱為「萬軍之耶和華的使者」；3:1 又有「我的使者」<\/td><\/tr><\/table>","gram":"<p><strong>① 「使者」為什麼用在祭司身上？<\/strong>這個字平常指天使或先知。本節罕見地用在祭司身上：祭司是「傳話的人」，嘴裡要有「知識」（<strong>דַּעַת<\/strong>）與「教導」。<\/p><p><strong>② 「使許多人回頭」<\/strong>用的是 <strong>שׁוּב<\/strong> 的使役動詞（Hiphil）：使人轉回。這個字是全書的行動詞，3:7、4:6 還要再出現。<\/p><blockquote><p><strong>最好的理解：<\/strong>祭司有兩條路可以走：使人轉回（2:6），或使人跌倒（2:8）。<\/p><\/blockquote>","exp":"<p><strong>神在這裡畫了一幅理想祭司的畫像。<\/strong><\/p><p>他的口中有真實的教導，他的嘴唇上沒有不義，他與神並行，他使許多人回頭。<\/p><p>這幅畫像最特別的地方，是動詞：<strong>「使許多人回頭」。<\/strong>祭司不是站在人群上面，是站在人前面，領人轉過來。<\/p><p>「知識」放在嘴唇上，不是放在書架上。人要從他口中尋求，所以他的口，就是一條路。<\/p><p>今天，每一個教導別人的人，都在這個位置上：父母、帶組的、站講台的。<\/p><p>「知識」在舊約不只是知道事實，是熟悉、認識。祭司要有的，是對神的熟悉，不只是對條文的熟悉。<\/p><p>你的嘴唇，今天是使人轉回，還是使人跌倒？這個問題，不是在問你的口才，是在問你的與神同行。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְאַתֶּם סַרְתֶּם מִן־הַדֶּרֶךְ הִכְשַׁלְתֶּם רַבִּים בַּתּוֹרָה שִֽׁחַתֶּם בְּרִית הַלֵּוִי אָמַר יְהוָה צְבָאֽוֹת׃ וְגַם־אֲנִי נָתַתִּי אֶתְכֶם נִבְזִים וּשְׁפָלִים לְכָל־הָעָם כְּפִי אֲשֶׁר אֵֽינְכֶם שֹׁמְרִים אֶת־דְּרָכַי וְנֹשְׂאִים פָּנִים בַּתּוֹרָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「但你們偏離了正道，使許多人在教導上跌倒；你們敗壞了利未的約，萬軍之耶和華說。所以我也使你們被眾人藐視，成為卑下的，因你們不守我的道，在教導上偏袒人。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>偏離<\/td><td>סַרְתֶּם<\/td><td>sartem<\/td><td>H5493<\/td><td>√סור（轉離）<\/td><td>偏離、轉開<\/td><td>與「回頭」（השיב）方向相反<\/td><\/tr><tr><td>跌倒<\/td><td>הִכְשַׁלְתֶּם<\/td><td>hikhshaltem<\/td><td>H3782<\/td><td>√כשׁל（絆倒）<\/td><td>使絆倒<\/td><td>使役動詞：不是自己跌，是使別人跌<\/td><\/tr><tr><td>敗壞<\/td><td>שִֽׁחַתֶּם<\/td><td>shichattem<\/td><td>H7843<\/td><td>√שׁחת（毀壞）<\/td><td>毀壞、敗壞<\/td><td>與 1:14 的「有殘疾」同字根<\/td><\/tr><tr><td>藐視<\/td><td>נִבְזִים<\/td><td>nivzim<\/td><td>H959<\/td><td>√בזה（藐視）<\/td><td>被藐視的<\/td><td>★ 他們藐視神的名（1:6），結果自己被藐視<\/td><\/tr><tr><td>偏袒<\/td><td>וְנֹשְׂאִים<\/td><td>nos’im<\/td><td>H5375<\/td><td>√נשׂא（舉起）<\/td><td>（舉起臉面）偏袒<\/td><td>與 1:8 的「看你的情面」同一個說法<\/td><\/tr><\/table>","gram":"<p><strong>「偏袒」<\/strong>的原文是「舉起臉」：看人的臉色行事。1:8 神用同一個說法，指省長可以「看你的情面」。這裡指祭司在教導上，對有權的人與沒權的人用了不同的標準。<\/p><p><strong>「跌倒」<\/strong>用的是使役動詞（Hiphil）：祭司「使人」跌倒，是他們的責任，不只是個人的失敗。<\/p>","exp":"<p><strong>責備的重點，是影響。<\/strong><\/p><p>神說：「你們使許多人在教導上跌倒。」教導的人，最大的罪，不是自己跌，是帶著別人一起跌。<\/p><p>這是為什麼「教導」一詞，在聖經裡這麼重。雅各書後來說，作教師的要受更重的審判，是同樣的意思。<\/p><p>讀這段話，最誘人的反應是看別人：看那些講台上的人、領導的人。<\/p><p>但是「偏袒」是人人都會的。我們在家裡、在公司、在教會，對有影響力的人客氣，對沒有的人隨便。<\/p><p>神用的是對等的語言：你們輕看我的名，我就使你們被輕看。人在神面前怎麼對待他，往往也怎麼反映在人面前。<\/p><p>神的標準，是同一把尺。這把尺，從祭司的嘴唇，到每一個人的日常。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲלוֹא אָב אֶחָד לְכֻלָּנוּ הֲלוֹא אֵל אֶֽחָד בְּרָאָנוּ מַדּוּעַ נִבְגַּד אִישׁ בְּאָחִיו לְחַלֵּל בְּרִית אֲבֹתֵֽינוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我們不是都有一位父嗎？不是一位神創造了我們嗎？我們各人為什麼用詭詐對待自己的弟兄，玷污了我們列祖的約呢？」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>父<\/td><td>אָב<\/td><td>’av<\/td><td>H1<\/td><td>אָב<\/td><td>父親<\/td><td>★ 兩個「一位」：一位父、一位神——合一的根基<\/td><\/tr><tr><td>創造<\/td><td>בְּרָאָנוּ<\/td><td>bera’anu<\/td><td>H1254<\/td><td>√ברא（創造）<\/td><td>創造（只用於神）<\/td><td>與創 1:1 同一個動詞：我們是同一位創造者的手<\/td><\/tr><tr><td>詭詐<\/td><td>נִבְגַּד<\/td><td>nivgad<\/td><td>H898<\/td><td>√בגד（背信）<\/td><td>行詭詐、背信<\/td><td>★ 這個字在 2:10–16 出現五次（2:10、11、14、15、16）<\/td><\/tr><tr><td>玷污<\/td><td>לְחַלֵּל<\/td><td>lechallel<\/td><td>H2490<\/td><td>√חלל（使成為俗）<\/td><td>玷污、使變為平常<\/td><td>與 1:12 的「褻瀆」同字根<\/td><\/tr><tr><td>約<\/td><td>בְּרִית<\/td><td>berit<\/td><td>H1285<\/td><td>—<\/td><td>約<\/td><td>「列祖的約」：約從祭司，擴大到每個人<\/td><\/tr><\/table>","gram":"<p><strong>① 「一位父」指誰？<\/strong><\/p><ul><li><strong>神說<\/strong>：「父」是神自己（對照 1:6「我若是父」）。<\/li><li><strong>亞伯拉罕說<\/strong>：「父」是共同的祖先；因為下半句有「列祖」。<\/li><\/ul><p>但下一句是「一位神創造了我們」，所以更自然的是：<strong>共同的父，就是共同的創造者。<\/strong><\/p><blockquote><p><strong>最好的理解：<\/strong>兩種讀法並不衝突；根基是：我們同出一個源頭，所以不可以彼此詭詐。<\/p><\/blockquote>","exp":"<p><strong>這一節，是全書的轉彎。<\/strong><\/p><p>前面對祭司，後面對百姓；前面談敬拜，後面談婚姻、談弟兄、談妻子。<\/p><p>轉彎處的一句話，只有一個問題：<strong>我們不是都有一位父嗎？<\/strong><\/p><p>「一」字是這節的鑰匙：一位父、一位神。因為源頭只有一個，所以彼此對待的標準，也只能有一個。<\/p><p>當你想用詭詐對待一個人的時候，神要你先看一件事：他和你，同一個父。<\/p><p>這節有三個動詞：造（神的行動）、詭詐（人的行動）、玷污（結果）。先有造，才有詭詐；先是源頭，後才是破壞。<\/p><p>這是「人比事重要」最早的經文根據之一：事可以爭，生意可以談，但不能用詭詐。因為對面坐的，是弟兄。<\/p>"},{"a":11,"z":12,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בָּגְדָה יְהוּדָה וְתוֹעֵבָה נֶעֶשְׂתָה בְיִשְׂרָאֵל וּבִירֽוּשָׁלִָם כִּי חִלֵּל יְהוּדָה קֹדֶשׁ יְהוָה אֲשֶׁר אָהֵב וּבָעַל בַּת־אֵל נֵכָֽר׃ יַכְרֵת יְהוָה לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה עֵר וְעֹנֶה מֵאָהֳלֵי יַֽעֲקֹב וּמַגִּישׁ מִנְחָה לַֽיהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「猶大行詭詐，在以色列與耶路撒冷中行了可憎的事；因為猶大玷污了耶和華所愛的聖地，娶了事奉外邦神的女子為妻。凡行這事的人，無論是叫醒的、答應的，無論是向萬軍之耶和華獻供物的，耶和華必從雅各的帳棚中剪除他。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>可憎<\/td><td>וְתוֹעֵבָה<\/td><td>tow‘evah<\/td><td>H8441<\/td><td>√תעב（厭惡）<\/td><td>可憎的事<\/td><td>律法常用此字，指神厭惡的事<\/td><\/tr><tr><td>聖地<\/td><td>קֹדֶשׁ<\/td><td>qodesh<\/td><td>H6944<\/td><td>√קדשׁ（分別）<\/td><td>聖、分別為聖的<\/td><td>可指聖所，也可指分別為聖的百姓<\/td><\/tr><tr><td>娶<\/td><td>וּבָעַל<\/td><td>uva‘al<\/td><td>H1166<\/td><td>√בעל（作主、娶）<\/td><td>娶、成為丈夫<\/td><td>與「巴力」同字根，意為「作主」<\/td><\/tr><tr><td>外邦神<\/td><td>נֵכָֽר<\/td><td>nekhar<\/td><td>H5236<\/td><td>—<\/td><td>外邦的<\/td><td>「事奉外邦神的女子」：問題在拜的是誰<\/td><\/tr><tr><td>剪除<\/td><td>יַכְרֵת<\/td><td>yakhret<\/td><td>H3772<\/td><td>√כרת（砍斷）<\/td><td>剪除<\/td><td>與「立約」（כרת ברית）同一個動詞：約被切斷<\/td><\/tr><\/table>","gram":"<p><strong>① 「娶事奉外邦神的女子」在說什麼？<\/strong>經文的重點在<strong>「事奉外邦神」<\/strong>：這是信仰的問題，不是血統的問題。以斯拉記與尼希米記裡也有類似的處理。路得（摩押人）被接納，就是反例：關鍵是「你的神，就是我的神」。<\/p><p><strong>② 「叫醒的、答應的」<\/strong>是一個慣用語，原意是「醒著的與回答的」，指所有人（和合本上帝版有註）。<\/p><blockquote><p><strong>最好的理解：<\/strong>神責備的是背離信仰之約，不是排斥外族人。本講義<strong>不<\/strong>拿這節去排擠任何族群或婚姻。<\/p><\/blockquote>","exp":"<p><strong>神先點名了「聖」被玷污了。<\/strong><\/p><p>這裡的重點不是「誰是外人」，是「誰是他們事奉的神」。<\/p><p>路得也是外族的女子，神卻給她一個名字，寫進了大衛王的家譜。問題從來不是她的出身，是她說：「你的神就是我的神。」<\/p><p>這一點要想清楚，才不會把這節經文，變成一把刺向別人的刀。<\/p><p>「剪除」是一個很重的動詞。它與「立約」是同一個字：約要切，也要剪。<\/p><p>這一節的「猶大」是集體名詞，「雅各的帳棚」是一個家的畫面。神說的是整個家的事，不只是一對夫妻的事。<\/p><p>神最在意的，是百姓的心，在婚姻、在家，到底歸給了誰。<\/p>"},{"a":13,"z":14,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְזֹאת שֵׁנִית תַּֽעֲשׂוּ כַּסּוֹת דִּמְעָה אֶת־מִזְבַּח יְהוָה בְּכִי וַֽאֲנָקָה מֵאֵין עוֹד פְּנוֹת אֶל־הַמִּנְחָה וְלָקַחַת רָצוֹן מִיֶּדְכֶֽם׃ וַאֲמַרְתֶּם עַל־מָה עַל כִּי־יְהוָה הֵעִיד בֵּינְךָ וּבֵין אֵשֶׁת נְעוּרֶיךָ אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ וְהִיא חֲבֶרְתְּךָ וְאֵשֶׁת בְּרִיתֶֽךָ׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們又行了一件事：使耶和華的壇被眼淚遮蓋，有哭泣，有嘆息，以致他不再看顧供物，也不樂意從你們手中收納。你們卻說：『為什麼呢？』因為耶和華在你與你幼年的妻子之間作過見證。她雖是你的伴侶，是你盟約的妻子，你卻對她行了詭詐。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>眼淚<\/td><td>דִּמְעָה<\/td><td>dim‘ah<\/td><td>H1832<\/td><td>—<\/td><td>眼淚<\/td><td>★ 壇被眼淚蓋住：不是祭物，是一個人的哀哭<\/td><\/tr><tr><td>哭泣<\/td><td>בְּכִי<\/td><td>bekhi<\/td><td>H1065<\/td><td>√בכה（哭）<\/td><td>哭泣<\/td><td>與「嘆息」連用：整個壇被這聲音包圍<\/td><\/tr><tr><td>嘆息<\/td><td>וַֽאֲנָקָה<\/td><td>va’anaqah<\/td><td>H603<\/td><td>√אנק（呻吟）<\/td><td>呻吟、嘆息<\/td><td>被傷害的人的聲音<\/td><\/tr><tr><td>作見證<\/td><td>הֵעִיד<\/td><td>he‘id<\/td><td>H5749<\/td><td>√עוד（見證）<\/td><td>作見證<\/td><td>婚姻的見證者，是耶和華自己<\/td><\/tr><tr><td>盟約<\/td><td>בְּרִיתֶֽךָ<\/td><td>beritekha<\/td><td>H1285<\/td><td>—<\/td><td>你的約<\/td><td>★ 「盟約的妻子」：婚姻是約，不是契約<\/td><\/tr><tr><td>伴侶<\/td><td>חֲבֶרְתְּךָ<\/td><td>chavertekha<\/td><td>H2278<\/td><td>√חבר（連結）<\/td><td>伴侶、同伴<\/td><td>同行的人，不是附屬的人<\/td><\/tr><\/table>","gram":"<p><strong>① 「使壇被眼淚遮蓋」是誰的眼淚？<\/strong>下一節（2:14）指向被詭詐對待的妻子；和合本上帝版譯為「前妻嘆息哭泣的眼淚」。祭司與百姓一邊獻祭，一邊有人在壇邊流淚。<\/p><p><strong>② 「為什麼呢？」<\/strong>這是全書「你們說」的第五次回嘴（1:2、6、7、13，到這裡是 2:14），問的是：神為什麼不接納供物？神的回答不是教義，是：<strong>他在婚姻中作了見證。<\/strong><\/p><blockquote><p><strong>最好的理解：<\/strong>神看見眼淚。他把被傷害的人的哭聲，放在敬拜之前。<\/p><\/blockquote>","exp":"<p><strong>壇上有火，壇下有眼淚。<\/strong><\/p><p>神說：我不再看顧你們的供物，因為你們在壇前，帶來了別人的眼淚。<\/p><p>這是很重的一句話。它說，有一種敬拜，是神不收的：就是那個敬拜的人，同時正在傷害另一個人。<\/p><p>神沒有說「離婚」兩個字，他先說的是：我看見她的眼淚。<\/p><p>也許你正是那個哭的人。這一節的第一個意思，是：神看見了，也沒有把這件事放在敬拜之後。<\/p><p>「作見證」是法庭用語。神在這裡既是見證人，也是審判者：他看見婚禮上的話，也看見後來的日子。<\/p><p>如果你是那個讓人哭的人，這一節的第一句，是：停下來，先看那個人的臉。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְלֹא־אֶחָד עָשָׂה וּשְׁאָר רוּחַ לוֹ וּמָה הָֽאֶחָד מְבַקֵּשׁ זֶרַע אֱלֹהִים וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם וּבְאֵשֶׁת נְעוּרֶיךָ אַל־יִבְגֹּֽד׃ כִּֽי־שָׂנֵא שַׁלַּח אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל וְכִסָּה חָמָס עַל־לְבוּשׁוֹ אָמַר יְהוָה צְבָאוֹת וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם וְלֹא תִבְגֹּֽדוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>（2:15 是全書最難的一節，詞句各譯不同，此處只作最保守的直譯。）「不是有一位造了嗎？他的靈還有餘。這一位尋求的是什麼？是神所要的後裔。所以你們要謹守你們的靈，不可對幼年的妻行詭詐。」「恨惡休妻」，耶和華以色列的神說，「也恨惡那把強暴蓋在衣服上的」，萬軍之耶和華說。「所以你們要謹守你們的靈，不可行詭詐。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>一位<\/td><td>אֶחָד<\/td><td>’echad<\/td><td>H259<\/td><td>—<\/td><td>一、一位<\/td><td>本節出現兩次；各家對這個「一」的主詞，看法不同<\/td><\/tr><tr><td>餘<\/td><td>וּשְׁאָר<\/td><td>ush’ar<\/td><td>H7605<\/td><td>√שׁאר（剩餘）<\/td><td>剩餘、餘份<\/td><td>神的靈有餘：神並不缺少別的辦法<\/td><\/tr><tr><td>謹守<\/td><td>וְנִשְׁמַרְתֶּם<\/td><td>nishmartem<\/td><td>H8104<\/td><td>√שׁמר（看守）<\/td><td>謹守、保護自己（Niphal）<\/td><td>★ 兩次重複（2:15、16）：全段的命令<\/td><\/tr><tr><td>休妻<\/td><td>שַׁלַּח<\/td><td>shallach<\/td><td>H7971<\/td><td>√שׁלח（送出）<\/td><td>打發、送走<\/td><td>與「休」同字：送她走<\/td><\/tr><tr><td>強暴<\/td><td>חָמָס<\/td><td>chamas<\/td><td>H2555<\/td><td>—<\/td><td>強暴、暴力<\/td><td>神恨惡的重點，是暴力<\/td><\/tr><tr><td>衣服<\/td><td>לְבוּשׁוֹ<\/td><td>levusho<\/td><td>H3830<\/td><td>√לבשׁ（穿）<\/td><td>衣服<\/td><td>強暴蓋在衣服上：看不見，卻在身上<\/td><\/tr><\/table>","gram":"<p><strong>① 2:15 有幾種主要讀法：<\/strong><\/p><ul><li><strong>「創造一人」說<\/strong>：神起初造了一個人（亞當），為了要有神所要的後裔（「虔誠的後裔」）。<\/li><li><strong>「亞伯拉罕」說<\/strong>：「一位」指亞伯拉罕，他只有一位主要的妻子。<\/li><li><strong>「神的靈」說<\/strong>：神有靈的餘力，卻只造了一對。<\/li><li><strong>「無人」說<\/strong>：沒有人這樣做過；有靈的人尚且不如此，何況你們。<\/li><\/ul><p><strong>② 2:16 的難點：<\/strong>原文 <strong>כִּי שָׂנֵא שַׁלַּח<\/strong> 可以是「他恨惡休妻」（和合本上帝版），也可以是「若恨她就休了她」（古譯本如七十士譯本）。兩個讀法差別很大。<\/p><blockquote><p><strong>最好的理解：不裁定。<\/strong>無論選哪一種，下一句一致：<strong>神恨惡的是強暴；他要人謹守自己的心，不可行詭詐。<\/strong>本講義<strong>不<\/strong>拿這兩節定罪離婚的人，也<strong>不<\/strong>要求受家暴的人留在傷害中。<\/p><\/blockquote>","exp":"<p><strong>這一段，是全書最需要小心講的兩節。<\/strong><\/p><p>因為有人讀了，就給自己或別人貼上標籤；因為有人聽了，就被要求留在一個會受傷的地方。<\/p><p>先把經文看清楚：這兩節裡，神恨惡的，是「強暴」。是一個人把暴力，像衣服一樣穿在身上。<\/p><p>神要的是一個「謹守」：<strong>謹守你們的心。<\/strong>不是謹守一條規定，是看守自己的心。<\/p><p>如果你是那個被傷害的人：這一節，不是對你說的。這節裡神站的位置，是站在你這一邊，恨惡那個傷害你的事。<\/p><p>如果你是那個可能傷害人的人：這一節只問你一件事：你的心，有沒有人在看守？是你自己，還是靠著聖靈？<\/p><p>請特別留意兩次「謹守你們的靈（心）」。經文最後要的，不是一個判決，是一個人看守自己的內裡。<\/p><p>用心靠聖靈，不要用腦靠自己。心被神看守的人，手才不會變成暴力。<\/p>"},{"a":17,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹגַעְתֶּם יְהוָה בְּדִבְרֵיכֶם וַאֲמַרְתֶּם בַּמָּה הוֹגָעְנוּ בֶּאֱמָרְכֶם כָּל־עֹשֵׂה רָע טוֹב בְּעֵינֵי יְהוָה וּבָהֶם הוּא חָפֵץ אוֹ אַיֵּה אֱלֹהֵי הַמִּשְׁפָּֽט׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們用言語使耶和華厭煩了；你們卻說：『我們在何事上使他厭煩呢？』因為你們說：『凡行惡的，在耶和華眼中看為善，並且他喜悅他們』；或者說：『公義的神在哪裡呢？』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>煩瑣<\/td><td>הוֹגַעְתֶּם<\/td><td>hogha‘tem<\/td><td>H3021<\/td><td>√יגע（疲乏）<\/td><td>使厭煩、使疲累<\/td><td>★ 人用話語使神疲累：是人的「話」，不是人的行為<\/td><\/tr><tr><td>言語<\/td><td>בְּדִבְרֵיכֶם<\/td><td>bedivrekhem<\/td><td>H1697<\/td><td>√דבר（說）<\/td><td>話語<\/td><td>與 1:1 的「耶和華的話」相對：他的話，與你們的話<\/td><\/tr><tr><td>惡<\/td><td>רָע<\/td><td>ra‘<\/td><td>H7451<\/td><td>—<\/td><td>惡<\/td><td>與「善」並列：人把兩者的標準弄反了<\/td><\/tr><tr><td>善<\/td><td>טוֹב<\/td><td>tov<\/td><td>H2896<\/td><td>—<\/td><td>善、好<\/td><td>創 1 神看為「好」；這裡人說神把惡看為「好」<\/td><\/tr><tr><td>公義<\/td><td>הַמִּשְׁפָּֽט<\/td><td>hammishpat<\/td><td>H4941<\/td><td>√שׁפט（審判）<\/td><td>公義、公平、審判<\/td><td>「公義的神」直譯是「審判的神」：他在哪裡審判？<\/td><\/tr><\/table>","gram":"<p><strong>「公義的神在哪裡呢？」<\/strong>直譯是「審判的神在哪裡？」這句話可以有兩種口氣：<\/p><ul><li><strong>質疑的口氣<\/strong>：神不管世界的惡。<\/li><li><strong>盼望的口氣<\/strong>：願神來審判。<\/li><\/ul><p>先知把這句話放進「煩瑣神」的罪名裡，但神接下來的回答（3:1–5），沒有責備發問的人，是直接答：<strong>我要來，我必臨近你們施行審判。<\/strong><\/p><blockquote><p><strong>最好的理解：<\/strong>神把人的疑問，當成真的問題來回答。<\/p><\/blockquote>","exp":"<p><strong>人最累神的，不是犯罪，是話。<\/strong><\/p><p>「凡行惡的，耶和華眼看為善。」這句話很像今天的世界：惡人興旺，好人受苦，而神似乎都沒有動作。<\/p><p>這不是一個容易回答的問題。連詩篇的作者也問過。<\/p><p>神說：你們用這句話使我疲累。不是說「不許問」，是說：這句話，已經從問，變成了結論。<\/p><p>問，與下結論，是兩件事。問，是把心打開，等神來答。下結論，是把心關起來，替神說了他怎麼想。<\/p><p>「煩瑣」是「使疲累」。1:13 是人嫌敬拜累，這裡是人的話使神累：同一種心情，一個向內，一個向上。<\/p><p>不過，最讓人安慰的是下一章：神沒有回應「你不該問」。<strong>他回應的，是「我要來」。<\/strong><\/p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנְנִי שֹׁלֵחַ מַלְאָכִי וּפִנָּה־דֶרֶךְ לְפָנָי וּפִתְאֹם יָבוֹא אֶל־הֵיכָלוֹ הָאָדוֹן אֲשֶׁר־אַתֶּם מְבַקְשִׁים וּמַלְאַךְ הַבְּרִית אֲשֶׁר־אַתֶּם חֲפֵצִים הִנֵּה־בָא אָמַר יְהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「看哪，我要差遣我的使者，他必在我面前預備道路。你們所尋求的主，必忽然進入他的殿；你們所喜愛的約的使者，看哪，他來了！」萬軍之耶和華說。<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>我的使者<\/td><td>מַלְאָכִי<\/td><td>mal’akhi<\/td><td>H4401<\/td><td>מַלְאָךְ（使者）+ ־י（我的）<\/td><td>我的使者<\/td><td>與 1:1 書名子音拼法相同：全書以「使者」開，也以「使者」轉折<\/td><\/tr><tr><td>預備道路<\/td><td>וּפִנָּה<\/td><td>ufinnah<\/td><td>H6437<\/td><td>√פנה（轉向、清除）<\/td><td>清理、使轉向<\/td><td>這個動詞的字根，與「轉向」同一族<\/td><\/tr><tr><td>忽然<\/td><td>וּפִתְאֹם<\/td><td>ufit’om<\/td><td>H6597<\/td><td>—<\/td><td>忽然、突然<\/td><td>不是人定的時候，是他定的時候<\/td><\/tr><tr><td>主<\/td><td>הָאָדוֹן<\/td><td>ha’adon<\/td><td>H113<\/td><td>אָדוֹן<\/td><td>主、主人（帶冠詞）<\/td><td>「你們所尋求的主」：就是 2:17 問「公義的神在哪裡」的人<\/td><\/tr><tr><td>殿<\/td><td>הֵיכָלוֹ<\/td><td>heikhalo<\/td><td>H1964<\/td><td>—<\/td><td>殿、宮殿<\/td><td>主要進入「他的殿」，不是人的殿<\/td><\/tr><tr><td>約的使者<\/td><td>הַבְּרִית<\/td><td>habberit<\/td><td>H1285<\/td><td>—<\/td><td>約<\/td><td>★ 約在全卷最後一次出現（2:4、5、8、10、14；3:1）<\/td><\/tr><\/table>","gram":"<p><strong>① 「我的使者」與「約的使者」是誰？<\/strong><\/p><ul><li><strong>同一位說<\/strong>：前面「預備道路的」與後面「來到的」是同一位。<\/li><li><strong>兩位說<\/strong>：前面是預備道路的使者（<strong>מַלְאָכִי<\/strong>，與書名同字），後面是「主」，也是「約的使者」。<\/li><li><strong>新約的連結<\/strong>：可 1:2、太 11:10、路 7:27 把「預備道路的使者」連到施洗約翰。<\/li><\/ul><p><strong>② 「你們所尋求的主」<\/strong>：這是回答 2:17 的人。他們問「公義的神在哪裡」，神說：你們尋求的主，要來。<\/p><blockquote><p><strong>最好的理解：<\/strong>只採用新約自己作過的連結（施洗約翰，太 11:10）；至於「主」與「約的使者」的身分，傳統解為彌賽亞，本講義不再往下推。<\/p><\/blockquote>","exp":"<p><strong>全書轉折處的第一個字，是「看哪」。<\/strong><\/p><p>前面的二章半，是神被問：你愛我們嗎？公義的神在哪裡？現在他開口回答：我要來。<\/p><p>這個回答很特別：他不先解釋，不先為自己辯護。他說：我要差遣一個人，在我面前預備道路。<\/p><p>這句話的次序是：先有人預備，然後主才來；而且他來的時候，是「忽然」。<\/p><p>我們常常以為神遲到了。但是這句話說，沒有遲到，只是不照我們的鐘點。<\/p><p>你們「所尋求的」，與你們「所喜愛的」，是同一個。人求的是公義，神來的時候，帶的是他自己。<\/p><p>「忽然」與「預備」看似矛盾：預備是慢慢的，忽然是突然的。意思是：人預備的日子也許很長，神進來的那一刻，是一瞬。<\/p><p>最大的盼望，不是我們終於找到了神。是：<strong>我們尋求的那位，自己走過來了。<\/strong><\/p>"},{"a":2,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וּמִי מְכַלְכֵּל אֶת־יוֹם בּוֹאוֹ וּמִי הָעֹמֵד בְּהֵרָֽאוֹתוֹ כִּֽי־הוּא כְּאֵשׁ מְצָרֵף וּכְבֹרִית מְכַבְּסִֽים׃ וְיָשַׁב מְצָרֵף וּמְטַהֵר כֶּסֶף וְטִהַר אֶת־בְּנֵֽי־לֵוִי וְזִקַּק אֹתָם כַּזָּהָב וְכַכָּסֶף וְהָיוּ לַֽיהוָה מַגִּישֵׁי מִנְחָה בִּצְדָקָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「他來的日子，誰能忍受呢？他顯現的時候，誰能站得住呢？因為他像煉金之人的火，像漂洗之人的鹼。他必坐下，像熬煉、潔淨銀子的人；他必潔淨利未的子孫，熬煉他們如同金銀，他們就憑公義向耶和華獻供物。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>忍受<\/td><td>מְכַלְכֵּל<\/td><td>mekhalkhel<\/td><td>H3557<\/td><td>√כול（容納、承受）<\/td><td>承受、容得下<\/td><td>「誰容得下他？」——問題是人有沒有這個容量<\/td><\/tr><tr><td>站得住<\/td><td>הָעֹמֵד<\/td><td>ha‘omed<\/td><td>H5975<\/td><td>√עמד（站立）<\/td><td>站立<\/td><td>與 2:17 的問題相對：公義的神來了，誰站得住<\/td><\/tr><tr><td>煉金<\/td><td>מְצָרֵף<\/td><td>metsareph<\/td><td>H6884<\/td><td>√צרף（熬煉）<\/td><td>熬煉金屬的人<\/td><td>★ 熬煉的目的是除去雜質，不是毀掉金子<\/td><\/tr><tr><td>鹼<\/td><td>וּכְבֹרִית<\/td><td>kheborit<\/td><td>H1287<\/td><td>—<\/td><td>洗衣的鹼<\/td><td>要洗掉的是髒，不是布<\/td><\/tr><tr><td>潔淨<\/td><td>וּמְטַהֵר<\/td><td>umetaher<\/td><td>H2891<\/td><td>√טהר（潔淨）<\/td><td>潔淨<\/td><td>與 1:11「潔淨的供物」呼應<\/td><\/tr><tr><td>公義<\/td><td>בִּצְדָקָֽה<\/td><td>bitsedaqah<\/td><td>H6666<\/td><td>√צדק（正直）<\/td><td>公義<\/td><td>供物要「憑公義」：不是靠獻得多，是靠心正<\/td><\/tr><\/table>","gram":"<p><strong>① 「熬煉」的目的是什麼？<\/strong><\/p><ul><li>原文的動詞是「熬煉」「潔淨」，目的是<strong>使金銀純淨<\/strong>，不是毀滅。<\/li><li>受熬煉的是「利未的子孫」：先從祭司開始，與 2:1–9 相連。<\/li><\/ul><p><strong>② 「他必坐下」<\/strong>：煉銀的人守在爐邊，要看著銀子，一直到表面看得見自己的臉。這是一個守候的畫面，不是離開。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是神親自來潔淨，不是借用苦難來責罰。本講義<strong>不<\/strong>主張「每一場苦難都是神放的火」，也不用這節去對受苦的人說「這是你該受的煉」。<\/p><\/blockquote>","exp":"<p><strong>「誰能站得住呢？」<\/strong><\/p><p>前一章人問：公義的神在哪裡？這一章神說：好，他來了。然後他說：你們受得住嗎？<\/p><p>這不是嚇人。這是一個很誠實的提醒：我們呼喊公義的時候，常常忘了，公義也要審我們自己的家。<\/p><p>但是，這兩個畫面卻很溫柔：一位煉金的人，一位洗衣的人。他們都只做一件事：除去雜質，留下本來的。<\/p><p>煉銀的人，會坐下來，守在爐邊，不離開，一直到銀子亮得可以照見他自己的臉。<\/p><p>你正在被熬煉的時候，請記得這個畫面：爐邊，有一個人坐著，他沒有走開。<\/p><p>「利未的子孫」先被潔淨，是整個群體潔淨的起點。領導的人，常常先被火煉，然後才輪到羊群。<\/p><p>神潔淨的目的，不是要你更辛苦，是要你的供物，可以憑公義，獻給他。<\/p>"},{"a":4,"z":5,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעָֽרְבָה לַֽיהוָה מִנְחַת יְהוּדָה וִירֽוּשָׁלִָם כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמֹנִיּֽוֹת׃ וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט וְהָיִיתִי עֵד מְמַהֵר בַּֽמְכַשְּׁפִים וּבַמְנָאֲפִים וּבַנִּשְׁבָּעִים לַשָּׁקֶר וּבְעֹשְׁקֵי שְׂכַר־שָׂכִיר אַלְמָנָה וְיָתוֹם וּמַטֵּי־גֵר וְלֹא יְרֵאוּנִי אָמַר יְהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「那時，猶大與耶路撒冷的供物，必蒙耶和華悅納，如同古時之日，如同上古之年。我必臨近你們施行審判；我必作快速的見證人，警戒行邪術的、犯姦淫的、起假誓的、虧負雇工之工價的、欺壓寡婦與孤兒的、屈枉寄居者的，和不敬畏我的。」萬軍之耶和華說。<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>悅納<\/td><td>וְעָֽרְבָה<\/td><td>ve‘arvah<\/td><td>H6149<\/td><td>√ערב（甜、使人悅意）<\/td><td>甘美、蒙悅納<\/td><td>與 1:10 的「不收納」相對：現在，供物像甜的<\/td><\/tr><tr><td>見證<\/td><td>עֵד<\/td><td>‘ed<\/td><td>H5707<\/td><td>√עוד（見證）<\/td><td>見證人<\/td><td>2:14 神在婚姻中作見證，這裡神再作見證<\/td><\/tr><tr><td>快速<\/td><td>מְמַהֵר<\/td><td>memahher<\/td><td>H4116<\/td><td>√מהר（快）<\/td><td>迅速的<\/td><td>不再耽延<\/td><\/tr><tr><td>雇工<\/td><td>וּבְעֹשְׁקֵי<\/td><td>uv‘oshqei<\/td><td>H6231<\/td><td>√עשׁק（欺壓）<\/td><td>欺壓<\/td><td>經濟上的欺壓：虧負人工價的<\/td><\/tr><tr><td>寄居者<\/td><td>גֵר<\/td><td>ger<\/td><td>H1616<\/td><td>√גור（寄居）<\/td><td>寄居的外人<\/td><td>與寡婦孤兒並列：最沒有保護的人<\/td><\/tr><tr><td>敬畏<\/td><td>יְרֵאוּנִי<\/td><td>yere’uni<\/td><td>H3372<\/td><td>√ירא（懼、敬）<\/td><td>敬畏我<\/td><td>★ 七項罪行，最後一項是總結：不敬畏我<\/td><\/tr><\/table>","gram":"<p><strong>① 這七項罪行的次序：<\/strong>邪術、姦淫、假誓（對神與人的誓約）、虧負工價、欺壓寡婦孤兒、屈枉寄居者，最後是「不敬畏我」。前六項是行為，最後一項是根。<\/p><p><strong>② 「作快速的見證人」<\/strong>：神自己作見證，連同 2:14，他是婚姻的見證人，也是社會公義的見證人。他看見的，有祭壇上的，也有工資單上的。<\/p><blockquote><p><strong>最好的理解：<\/strong>神回答「公義的神在哪裡」的方式，是點出這些最容易被忽略的人：被欠工資的、守寡的、孤兒、外來的。他們不是被忘記的，是被神記得的。<\/p><\/blockquote>","exp":"<p><strong>神的審判，從最小的人開始看。<\/strong><\/p><p>名單上沒有「大罪」。沒有殺人、沒有偶像、沒有叛國。有的是：一份沒有給足的工資、一個被欺壓的寡婦、一個被屈枉的外人。<\/p><p>這些事，在人的眼裡很小，在神的眼裡，是證據。<\/p><p>「見證」的意思，是他在場。他不是從天上遠遠看著，他說：我必臨近你們。<\/p><p>這是一個讓人不安，也讓人安慰的畫面：不安，因為我們的帳目，他都看見；安慰，因為被欠的、被欺壓的，他也都看見。<\/p><p>最後一項：「不敬畏我」。前面六條，都是從這裡長出來的枝子。<\/p><p>3:4 是一個很大的盼望：古時的悅納，可以再次回來。神沒有說這不可能。<\/p><p>敬畏，不是在聖殿裡的情緒，是在發薪日、在對待外人的時候，還記得有一位在看。<\/p>"},{"a":6,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּי אֲנִי יְהוָה לֹא שָׁנִיתִי וְאַתֶּם בְּנֵֽי־יַעֲקֹב לֹא כְלִיתֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「因為我，耶和華，沒有改變；所以你們雅各的子孫，沒有被消滅。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>改變<\/td><td>שָׁנִיתִי<\/td><td>shaniti<\/td><td>H8138<\/td><td>√שׁנה（改變、重複）<\/td><td>改變<\/td><td>★ 神不變，是人沒有滅亡的原因<\/td><\/tr><tr><td>消滅<\/td><td>כְלִיתֶֽם<\/td><td>khaliytem<\/td><td>H3615<\/td><td>√כלה（完結）<\/td><td>被終結、被耗盡<\/td><td>與 3:5 的審判相連：他來審判，卻不消滅<\/td><\/tr><tr><td>雅各<\/td><td>יַעֲקֹב<\/td><td>Ya‘aqov<\/td><td>H3290<\/td><td>—<\/td><td>雅各<\/td><td>與 1:2 的「我愛雅各」首尾呼應<\/td><\/tr><\/table>","gram":"<p><strong>「雅各的子孫」<\/strong>：神用雅各這個名字稱呼他們。雅各在 1:2 是被愛的，在創世記是一個爭競、詭詐的人，神卻揀選他。這裡再說一次：<strong>他們沒有滅亡，不是因為他們好，是因為神沒有變。<\/strong><\/p><p><strong>「沒有改變」<\/strong>的動詞，同時有「變化」與「重複」的意思。神說他不變，也就是說：他說的愛，在 1:2 說過了，現在仍然算數。<\/p>","exp":"<p><strong>這一節很短，卻是全書的支撐點。<\/strong><\/p><p>前一節說，神要來審判；後一節說，你們要轉向。中間夾著這一句：「因我耶和華是不改變的。」<\/p><p>請停一下，想想這句話放在這裡的意思。<\/p><p>神說：你們有偏離，有欺壓，有不敬畏；而你們還在這裡。不是因為你們是好的，是因為我沒有變。<\/p><p>我們的生命，也站在這樣的一句話上。我們沒有被消滅，不是因為我們一直好，是因為他一直是他。<\/p><p>「不改變」不是說神沒有感覺。他前面剛說「我必臨近你們施行審判」。不變的是他的品格，不是他沒有動作。<\/p><p>這是福音的底色：<strong>我的將來，不靠我的不變，靠他的不變。<\/strong><\/p>"},{"a":7,"z":7,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לְמִימֵי אֲבֹתֵיכֶם סַרְתֶּם מֵֽחֻקַּי וְלֹא שְׁמַרְתֶּם שׁוּבוּ אֵלַי וְאָשׁוּבָה אֲלֵיכֶם אָמַר יְהוָה צְבָאוֹת וַאֲמַרְתֶּם בַּמֶּה נָשֽׁוּב׃<\/p><\/blockquote>","lit":"<blockquote><p>「從你們列祖的日子以來，你們偏離了我的條例，不遵守。你們要轉向我，我就轉向你們，萬軍之耶和華說。你們卻說：『我們要怎樣才算轉向呢？』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th
