><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>偏離<\/td><td>סַרְתֶּם<\/td><td>sartem<\/td><td>H5493<\/td><td>√סור（轉開）<\/td><td>偏離<\/td><td>與 2:8 同一個動詞：祭司偏離，現在是全體偏離<\/td><\/tr><tr><td>條例<\/td><td>מֵֽחֻקַּי<\/td><td>mechuqqai<\/td><td>H2706<\/td><td>√חקק（刻、定）<\/td><td>條例、規定<\/td><td>「從列祖的日子以來」：不是新的問題<\/td><\/tr><tr><td>轉向<\/td><td>שׁוּבוּ<\/td><td>shuvu<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>轉回、回來（祈使）<\/td><td>★ 全書的行動詞：命令式，一個邀請<\/td><\/tr><tr><td>我就轉向<\/td><td>וְאָשׁוּבָה<\/td><td>va’ashuvah<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>我就轉回（意願式）<\/td><td>同一個動詞：人轉，神也轉<\/td><\/tr><tr><td>如何轉向<\/td><td>נָשֽׁוּב<\/td><td>nashuv<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>我們要怎樣轉回？<\/td><td>人的反問：不是不要，是不知道怎麼做<\/td><\/tr><\/table>","gram":"<p><strong>「轉向」一詞連用三次：<\/strong>神說「你們要轉向我」（祈使），「我就轉向你們」（意願式），人問「我們要怎樣轉向」（未完成式）。同一個動詞，主詞換來換去。<\/p><p><strong>① 「我就轉向你們」是條件嗎？<\/strong>不完全是。結構是「你們要……，我就……」，看起來像交換；但上一節（3:6）已經說：神沒有變，所以你們沒有滅亡。邀請在先，不是神等你們先轉，他才開始愛。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是一個邀請，不是一個討價還價。神的轉向，一直在那裡，等人轉過身來看見。<\/p><\/blockquote>","exp":"<p><strong>全書最重要的一句話，只有一個動詞。<\/strong><\/p><p>「你們要轉向我，我就轉向你們。」同一個字，說了兩次。一次是命令，一次是應許。<\/p><p>這不是一個難懂的神學，是一個簡單的動作：<strong>轉身。<\/strong><\/p><p>人的回答也很真實：「我們如何才是轉向呢？」這個問題，不是頂嘴，是一個想要回家，卻不知道路的人的問題。<\/p><p>神下面的回答，不是一堆規定，是一個很具體的事：他點出了一件事（3:8），然後請他們試。<\/p><p>全書從「我曾愛你們」開始，在這裡到了樞紐：<strong>愛已經先了，現在請你轉過身來。<\/strong><\/p><p>請留意：神沒有說「改正你們的行為，我就轉向你們」，他說「轉向我」：焦點在他身上。焦點在耶穌，不在自己。<\/p><p>轉向，不是努力變好，是轉過去，看他。你一轉，會發現，他本來就一直朝著你。<\/p>"},{"a":8,"z":9,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲיִקְבַּע אָדָם אֱלֹהִים כִּי אַתֶּם קֹבְעִים אֹתִי וַאֲמַרְתֶּם בַּמֶּה קְבַעֲנוּךָ הַֽמַּעֲשֵׂר וְהַתְּרוּמָֽה׃ בַּמְּאֵרָה אַתֶּם נֵֽאָרִים וְאֹתִי אַתֶּם קֹבְעִים הַגּוֹי כֻּלּֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「人豈可奪取神之物呢？你們竟奪取我的東西。你們卻說：『我們在何事上奪取你呢？』就是在十分之一與供物上。你們被咒詛，被咒詛了，因為你們奪取我，就是你們全國的人。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>奪取<\/td><td>הֲיִקְבַּע<\/td><td>hayiqba‘<\/td><td>H6906<\/td><td>√קבע（奪取）<\/td><td>奪取、詐取<\/td><td>全舊約極少用的動詞；意思有爭議<\/td><\/tr><tr><td>十分之一<\/td><td>הַֽמַּעֲשֵׂר<\/td><td>hamma‘aser<\/td><td>H4643<\/td><td>√עשׂר（十）<\/td><td>十分之一<\/td><td>★ 與「供物」並列：當時聖殿的供給制度<\/td><\/tr><tr><td>供物<\/td><td>וְהַתְּרוּמָֽה<\/td><td>vehatterumah<\/td><td>H8641<\/td><td>√רום（舉起）<\/td><td>舉祭、奉獻<\/td><td>「舉起」之物：獻給神的特定部分<\/td><\/tr><tr><td>咒詛<\/td><td>נֵֽאָרִים<\/td><td>ne’arim<\/td><td>H779<\/td><td>√ארר（咒詛）<\/td><td>被咒詛的<\/td><td>與 2:2 的咒詛呼應<\/td><\/tr><tr><td>全國<\/td><td>הַגּוֹי<\/td><td>haggoy<\/td><td>H1471<\/td><td>—<\/td><td>國、民族<\/td><td>全民的責任，不是個人的失敗<\/td><\/tr><\/table>","gram":"<p><strong>① 「奪取」是什麼意思？<\/strong>動詞 <strong>קָבַע<\/strong> 在舊約極少見，有「奪取、詐騙、掠奪」的意思。重點是：<strong>該給的沒有給，等於拿了不是自己的。<\/strong><\/p><p><strong>② 「十分之一與供物」<\/strong>：這是歸回之民的聖殿與利未人的供給（民 18:21–24；尼 13:10–12）。當時沒有交，利未人就各自回去自己的田地，聖殿的事奉停了。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是對那個時代、那群立約之民說的話。今日教會如何看十一奉獻，是另一個需要慎重討論的題目；本講義<strong>不<\/strong>拿這兩節向人施壓，也不替任何教會的規定背書。<\/p><\/blockquote>","exp":"<p><strong>神的第一個控告，用的是一個很重的字：「奪取」。<\/strong><\/p><p>「人豈可奪取神之物呢？」這是一個反問，答案只有一個：不可以。<\/p><p>人的回答，與之前一樣：「我們在何事上奪取你呢？」我們沒有啊。<\/p><p>神的答案，很實際：在十分之一與供物上。具體的事，具體的點名。<\/p><p>這裡要特別小心。這段經文，是對一群特定的人、在特定的處境說的：殿已經重建了，祭司與利未人需要被供養，而人沒有給。<\/p><p>我們今天讀它，最安全的方式，不是拿來算錢，是問一個問題：<strong>我有沒有，把本來屬於神的東西，悄悄留給了自己？<\/strong><\/p><p>全國的人都奪取，所以咒詛也臨到全國。個人的小疏忽，在這節經文裡，被放進整個社群的處境，成為整體的虧缺。<\/p><p>那可能是錢，也可能是時間、是心，是一個週日的早晨。<\/p>"},{"a":10,"z":12,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הָבִיאוּ אֶת־כָּל־הַֽמַּעֲשֵׂר אֶל־בֵּית הָאוֹצָר וִיהִי טֶרֶף בְּבֵיתִי וּבְחָנוּנִי נָא בָּזֹאת אָמַר יְהוָה צְבָאוֹת אִם־לֹא אֶפְתַּח לָכֶם אֵת אֲרֻבּוֹת הַשָּׁמַיִם וַהֲרִיקֹתִי לָכֶם בְּרָכָה עַד־בְּלִי־דָֽי׃ וְגָעַרְתִּי לָכֶם בָּֽאֹכֵל וְלֹֽא־יַשְׁחִת לָכֶם אֶת־פְּרִי הָאֲדָמָה וְלֹא־תְשַׁכֵּל לָכֶם הַגֶּפֶן בַּשָּׂדֶה אָמַר יְהוָה צְבָאֽוֹת׃ וְאִשְּׁרוּ אֶתְכֶם כָּל־הַגּוֹיִם כִּֽי־תִהְיוּ אַתֶּם אֶרֶץ חֵפֶץ אָמַר יְהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們要把全部的十分之一帶進倉庫，使我的殿中有糧食；你們就以此試試我，萬軍之耶和華說，看我是否為你們敞開天上的窗戶，傾福給你們，直到無處可容。我必為你們斥責吞噬者，不容牠毀壞你們的土產；你們田間的葡萄樹，也不掉果子。萬軍之耶和華說。萬國必稱你們為有福的，因為你們必成為喜樂之地。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>倉庫<\/td><td>הָאוֹצָר<\/td><td>ha’otsar<\/td><td>H214<\/td><td>√אצר（儲存）<\/td><td>倉庫、府庫<\/td><td>聖殿內的儲藏室（尼 13:12）<\/td><\/tr><tr><td>試試<\/td><td>וּבְחָנוּנִי<\/td><td>uvchanuni<\/td><td>H974<\/td><td>√בחן（試驗）<\/td><td>試驗、檢驗<\/td><td>★ 全舊約神唯一邀請人「試他」的地方，限於這個約的處境<\/td><\/tr><tr><td>窗戶<\/td><td>אֲרֻבּוֹת<\/td><td>’arubbot<\/td><td>H699<\/td><td>—<\/td><td>窗、水閘<\/td><td>創 7:11 洪水的「天上的窗戶」同字<\/td><\/tr><tr><td>福<\/td><td>בְּרָכָה<\/td><td>berakhah<\/td><td>H1293<\/td><td>√ברך（祝福）<\/td><td>福<\/td><td>2:2 的「福分變咒詛」，這裡反過來<\/td><\/tr><tr><td>斥責<\/td><td>וְגָעַרְתִּי<\/td><td>ve-ga‘arti<\/td><td>H1605<\/td><td>√גער（斥責）<\/td><td>斥責<\/td><td>同 2:3 的動詞，這次是神替人斥責<\/td><\/tr><tr><td>蝗蟲<\/td><td>בָּֽאֹכֵל<\/td><td>ba’okhel<\/td><td>H398<\/td><td>√אכל（吃）<\/td><td>吞噬者<\/td><td>原文是「吃的」，指蝗蟲或一切吞噬莊稼的<\/td><\/tr><\/table>","gram":"<p><strong>① 「試試我」可以怎樣理解？<\/strong><\/p><ul><li><strong>約的處境<\/strong>：這是神對立約之民說的，申 28 的福與咒詛是它的背景。<\/li><li><strong>不是公式<\/strong>：這不是「付出就必得回報」的交易。聖經別處（如約伯記、傳道書）也明確表示，好人未必沒有苦難。<\/li><\/ul><p><strong>② 「福」的內容：<\/strong>糧食、莊稼、不被吞噬、被列國稱為有福。這是農業社會、歸回之民的語言。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是神對<strong>那群人、那個處境<\/strong>的應許。<strong>不是<\/strong>對今日任何人、任何教會的保證；本講義<strong>不<\/strong>主張「奉獻就必得祝福」，也<strong>不<\/strong>對經濟困難的人說「你的信心不夠」。<\/p><\/blockquote>","exp":"<p><strong>這是最容易被拿來用錯的一段。<\/strong><\/p><p>有人把它變成一個公式：你獻多少，神就還你多少。有人把它變成一個壓力：你不獻，你就被咒詛。<\/p><p>兩種用法，都不是這段經文自己的意思。<\/p><p>它的背景，是一個真實的社群：殿剛重建，利未人沒有被供養，人人把自己的田當成最要緊的事。神說：試試我。意思是，試著讓我來作你的主。<\/p><p>福的畫面，是一個很美的畫面：天窗打開，福傾下來，直到無處可容；吞噬的被喝止；萬國說：這是有福的地。<\/p><p>這段經文，最安全、最深的讀法，是：<strong>神是慷慨的，他願意比我們想得更大方。<\/strong><\/p><p>「無處可容」是很美的一句話：不是福多到數不清，是裝的地方不夠了。這是一位慷慨的神的樣子。<\/p><p>至於今日如何奉獻，請回到心甘情願與樂意；請不要讓任何人，用這段經文，向你要錢。<\/p>"},{"a":13,"z":15,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>חָזְקוּ עָלַי דִּבְרֵיכֶם אָמַר יְהוָה וַאֲמַרְתֶּם מַה־נִּדְבַּרְנוּ עָלֶֽיךָ׃ אֲמַרְתֶּם שָׁוְא עֲבֹד אֱלֹהִים וּמַה־בֶּצַע כִּי שָׁמַרְנוּ מִשְׁמַרְתּוֹ וְכִי הָלַכְנוּ קְדֹרַנִּית מִפְּנֵי יְהוָה צְבָאֽוֹת׃ וְעַתָּה אֲנַחְנוּ מְאַשְּׁרִים זֵדִים גַּם־נִבְנוּ עֹשֵׂי רִשְׁעָה גַּם בָּחֲנוּ אֱלֹהִים וַיִּמָּלֵֽטוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們用話頂撞我，耶和華說。你們卻說：『我們用什麼話頂撞了你呢？』你們說：『事奉神是徒然的；遵守他所吩咐的，在萬軍之耶和華面前穿著黑衣苦行，有什麼益處呢？如今我們稱狂傲的人為有福，行惡的人得建立；他們雖試探神，卻得脫離。』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>頂撞<\/td><td>חָזְקוּ<\/td><td>chazqu<\/td><td>H2388<\/td><td>√חזק（強、硬）<\/td><td>強硬、頂撞<\/td><td>直譯是「你們的話對我強硬」<\/td><\/tr><tr><td>徒然<\/td><td>שָׁוְא<\/td><td>shaw’<\/td><td>H7723<\/td><td>—<\/td><td>虛空、徒然<\/td><td>與 1:10 的「徒然」不同字，但同一種心情<\/td><\/tr><tr><td>益處<\/td><td>בֶּצַע<\/td><td>betsa‘<\/td><td>H1215<\/td><td>√בצע（剪下、獲利）<\/td><td>利益、收穫<\/td><td>★ 把事奉當成投資：有什麼回報？<\/td><\/tr><tr><td>狂傲<\/td><td>זֵדִים<\/td><td>zedim<\/td><td>H2086<\/td><td>√זוד（沸騰、傲慢）<\/td><td>狂傲的人<\/td><td>4:1 還要再出現：「凡狂傲的」<\/td><\/tr><tr><td>得建立<\/td><td>נִבְנוּ<\/td><td>nivnu<\/td><td>H1129<\/td><td>√בנה（建）<\/td><td>被建立、興旺<\/td><td>與 1:4「我們要重建」呼應<\/td><\/tr><\/table>","gram":"<p><strong>「苦苦齋戒」<\/strong>原文是「穿著黑衣行走」，指悔罪的樣子。他們的意思：我們認真，我們誠心，結果呢？<\/p><p><strong>這三節的邏輯：<\/strong>事奉神沒有益處（3:14）→ 狂傲的反而有福（3:15）→ 他們試探神，也沒事（3:15）。這是一個很誠實的結論，也是一個很危險的結論：<strong>因為看見別人興旺，就判定自己的敬虔是白費。<\/strong><\/p><blockquote><p><strong>最好的理解：<\/strong>這不是異端的話，是疲憊的人的話。神把這句話說出來，是承認：這是真實的心情。<\/p><\/blockquote>","exp":"<p><strong>最後一回，人說出了真心話。<\/strong><\/p><p>「事奉神是徒然的。」這句話，不是不信的人說的，是事奉了很久的人說的。<\/p><p>他們有齋戒，有穿黑衣，有遵守。他們看看左右：狂傲的人有福，行惡的人興旺。他們算了一下帳，認為自己吃虧了。<\/p><p>你有沒有算過這個帳？你有沒有在一個很累的晚上，問過：做這麼多，有什麼益處？<\/p><p>神沒有罵這樣的人。他把這句話原原本本記了下來。<\/p><p>不過，我們要看見一個陷阱：把事奉當成投資。<strong>「有什麼益處」這句話，是問利息，不是問關係。<\/strong><\/p><p>「頂撞」的字根是「硬」。人的話，變硬了。硬話不一定是喊叫，常常是冷冷的一句：算了。<\/p><p>關係的次序是：先有與神的關係，再有事奉。如果顛倒過來，事奉就會變成一筆帳，而帳，永遠算不平。<\/p>"},{"a":16,"z":16,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָז נִדְבְּרוּ יִרְאֵי יְהוָה אִישׁ אֶת־רֵעֵהוּ וַיַּקְשֵׁב יְהוָה וַיִּשְׁמָע וַיִּכָּתֵב סֵפֶר זִכָּרוֹן לְפָנָיו לְיִרְאֵי יְהוָה וּלְחֹשְׁבֵי שְׁמֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「那時，敬畏耶和華的人彼此談論；耶和華留意聽，聽見了。有一本紀念冊在他面前寫下了，是為了那些敬畏耶和華、思念他名的人。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>敬畏<\/td><td>יִרְאֵי<\/td><td>yir’ei<\/td><td>H3373<\/td><td>√ירא（懼、敬）<\/td><td>敬畏的人（形容詞）<\/td><td>★ 神記念的，是「敬畏他的人」<\/td><\/tr><tr><td>彼此談論<\/td><td>נִדְבְּרוּ<\/td><td>nidberu<\/td><td>H1696<\/td><td>√דבר（說）<\/td><td>彼此談話<\/td><td>不是講台，是人與人之間的對話<\/td><\/tr><tr><td>留意<\/td><td>וַיַּקְשֵׁב<\/td><td>vayyaqshev<\/td><td>H7181<\/td><td>√קשׁב（傾聽）<\/td><td>側耳、留心<\/td><td>神豎起耳朵：他是聽的神<\/td><\/tr><tr><td>紀念冊<\/td><td>זִכָּרוֹן<\/td><td>zikkaron<\/td><td>H2146<\/td><td>√זכר（記念）<\/td><td>紀念、記念之物<\/td><td>與 4:4「記念」摩西的律法呼應<\/td><\/tr><tr><td>思念<\/td><td>וּלְחֹשְׁבֵי<\/td><td>ulchoshvei<\/td><td>H2803<\/td><td>√חשׁב（思想、看重）<\/td><td>思念、看重<\/td><td>他們思想他的名；1:6「藐視我名」的反面<\/td><\/tr><\/table>","gram":"<p><strong>① 他們「彼此談論」什麼？<\/strong>經文沒有說。可以對照上下文：這是對 3:13–15「徒然」之說的回答。與其說他們反駁，不如說他們用談話彼此站住。<\/p><p><strong>② 「紀念冊」是什麼？<\/strong>波斯王宮有「記念冊」，記載有功之人（斯 6:1–2）。這裡的畫面是：神親自記念。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是神的記念，不是得救的名冊。本講義<strong>不<\/strong>從這節推論「名字被寫在冊上才算得救」，也不用它去暗示「有些人不在冊上」。<\/p><\/blockquote>","exp":"<p><strong>這是全書最安靜的一節。<\/strong><\/p><p>在一片「事奉是徒然」的聲音裡，有一小群人，在一個角落，彼此談話。<\/p><p>我們不知道他們說了什麼。可能是：我也累。可能是：你再撐一撐。可能只是一起禱告。<\/p><p>但是經文有一個非常動人的細節：<strong>神豎起耳朵，聽見了。<\/strong><\/p><p>不是講台的話，不是大聲的話，是兩三個人之間的、小聲的、疲憊的對話，被聽見了，而且被記下來了。<\/p><p>你不是一個人在撐。你在廚房、在辦公室、在車上，對一個朋友說的那句話，神聽見了。<\/p><p>請留意主詞的次序：先是「敬畏的人」彼此談論，然後才是「耶和華側耳而聽」。神的聽，是回應人的開口。<\/p><p>他有一本冊子，在他面前。你的名字，你的思念，在那裡。<\/p>"},{"a":17,"z":18,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהָיוּ לִי אָמַר יְהוָה צְבָאוֹת לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה סְגֻלָּה וְחָמַלְתִּי עֲלֵיהֶם כַּֽאֲשֶׁר יַחְמֹל אִישׁ עַל־בְּנוֹ הָעֹבֵד אֹתֽוֹ׃ וְשַׁבְתֶּם וּרְאִיתֶם בֵּין צַדִּיק לְרָשָׁע בֵּין עֹבֵד אֱלֹהִים לַאֲשֶׁר לֹא עֲבָדֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「在我所定的日子，他們必屬於我，成為我特別的產業，萬軍之耶和華說。我必憐恤他們，如同人憐恤那服事自己的兒子。那時你們必再轉回，並要看出義人與惡人、事奉神的與不事奉神的，有何分別。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>特別的產業<\/td><td>סְגֻלָּה<\/td><td>segullah<\/td><td>H5459<\/td><td>—<\/td><td>珍寶、特別的產業<\/td><td>★ 出 19:5 神稱以色列為「我的珍寶」，同一個字<\/td><\/tr><tr><td>憐恤<\/td><td>וְחָמַלְתִּי<\/td><td>vechamalti<\/td><td>H2550<\/td><td>√חמל（憐惜）<\/td><td>憐惜、不忍<\/td><td>像父親不忍心傷害兒子<\/td><\/tr><tr><td>服事<\/td><td>הָעֹבֵד<\/td><td>ha‘oved<\/td><td>H5647<\/td><td>√עבד（服事、作工）<\/td><td>服事<\/td><td>同一個字：神憐恤那「服事」他的，就像憐恤服事父親的兒子<\/td><\/tr><tr><td>歸回<\/td><td>וְשַׁבְתֶּם<\/td><td>veshavtem<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>你們必轉回／必再<\/td><td>★ 這個動詞可以是「歸回」，也可以是「再一次」<\/td><\/tr><tr><td>義人<\/td><td>צַדִּיק<\/td><td>tsaddiq<\/td><td>H6662<\/td><td>√צדק（正直）<\/td><td>義人<\/td><td>與 3:3 的「公義」同字根<\/td><\/tr><\/table>","gram":"<p><strong>① 「你們必歸回」怎麼理解？<\/strong><\/p><ul><li><strong>歸回說<\/strong>：人轉回神（呼應 3:7）。<\/li><li><strong>「再」說<\/strong>：<strong>שׁוּב<\/strong> 可以接另一個動詞，意為「再一次」：「你們必再看見」。<\/li><\/ul><p>兩種讀法都通。無論哪一種，都在回答 3:14：事奉神是不是徒然。答案是：<strong>終有一天，分別要被看見。<\/strong><\/p><blockquote><p><strong>最好的理解：<\/strong>這不是人去評斷誰是義人、誰是惡人，是神在他所定的日子，讓分別顯明。<\/p><\/blockquote>","exp":"<p><strong>這是對「徒然」的答案。<\/strong><\/p><p>答案不是一個論證，是三個畫面：「屬我」、「珍寶」、「兒子」。<\/p><p>神說：他們是我特別的產業。這個字，在出埃及記，是神對全以色列說的。現在，他把這個稱呼，放在那一小群疲憊的人身上。<\/p><p>更動人的是最後一句：「如同人憐恤那服事自己的兒子。」<\/p><p>你想想，一個父親，看見孩子累了，每天辛苦地服事他，父親心裡是什麼感覺？<\/p><p>那就是神看你的樣子。不是看你有沒有成果，是看你這個人，為他，辛苦著。<\/p><p>「在我所定的日子」，又是一個不屬於我們的日子表。我們不需要知道是哪一天，只需要知道：有這麼一天，被說定了。<\/p><p>你的事奉，不是投資，是兒子在父親的家裡作工。<strong>這個家的帳，不是一筆筆算的，是一個父親的心。<\/strong><\/p>"}],"4":[{"a":1,"z":1,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי־הִנֵּה הַיּוֹם בָּא בֹּעֵר כַּתַּנּוּר וְהָיוּ כָל־זֵדִים וְכָל־עֹשֵׂה רִשְׁעָה קַשׁ וְלִהַט אֹתָם הַיּוֹם הַבָּא אָמַר יְהוָה צְבָאוֹת אֲשֶׁר לֹא־יַעֲזֹב לָהֶם שֹׁרֶשׁ וְעָנָֽף׃<\/p><\/blockquote>","lit":"<blockquote><p>「看哪，那日要來，像燒著的火爐。凡狂傲的和一切行惡的，都必如碎秸；那要來的日子必燒盡他們，萬軍之耶和華說，不給他們留下根，也不留下枝子。」（MT 3:19）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>日子<\/td><td>הַיּוֹם<\/td><td>hayyom<\/td><td>H3117<\/td><td>—<\/td><td>日、那日<\/td><td>★ 全書的「日子」：3:2 他來的日子，3:17 我所定的日子，4:1 那日<\/td><\/tr><tr><td>火爐<\/td><td>כַּתַּנּוּר<\/td><td>kattannur<\/td><td>H8574<\/td><td>—<\/td><td>爐、烤爐<\/td><td>與 3:2「煉金之人的火」同屬火的畫面，但這裡是審判，那裡是潔淨<\/td><\/tr><tr><td>狂傲<\/td><td>זֵדִים<\/td><td>zedim<\/td><td>H2086<\/td><td>√זוד（沸騰、傲慢）<\/td><td>狂傲的人<\/td><td>與 3:15「稱狂傲的人為有福」直接對看<\/td><\/tr><tr><td>碎秸<\/td><td>קַשׁ<\/td><td>qash<\/td><td>H7179<\/td><td>—<\/td><td>碎秸、禾稈<\/td><td>輕的、無根的東西<\/td><\/tr><tr><td>根<\/td><td>שֹׁרֶשׁ<\/td><td>shoresh<\/td><td>H8328<\/td><td>—<\/td><td>根<\/td><td>根與枝子：連根帶枝，沒有留下<\/td><\/tr><tr><td>枝子<\/td><td>וְעָנָֽף<\/td><td>ve‘anaf<\/td><td>H6057<\/td><td>—<\/td><td>枝子<\/td><td>與「公義的日頭」的光線相對：這裡什麼也不留<\/td><\/tr><\/table>","gram":"<p><strong>① 「那日」是什麼時候？<\/strong><\/p><ul><li><strong>當時近期說<\/strong>：指先知時代的審判。<\/li><li><strong>末後說<\/strong>：指耶和華的大日子（4:5）。<\/li><li><strong>兩者兼具說<\/strong>：先知的話有近期的成就，也有更大的、最終的成就。<\/li><\/ul><blockquote><p><strong>最好的理解：不裁定，也不算日子。<\/strong>經文沒有給時間表，只給了一個畫面：根與枝都不留。本講義<strong>不<\/strong>把「狂傲的」「行惡的」對應今日任何國家、族群或政權。<\/p><\/blockquote>","exp":"<p><strong>全書最後一章，第一句，是火。<\/strong><\/p><p>「那日要來，像燒著的火爐。」這句話，聽起來很嚇人。但請注意，它是對 3:15 的回答。<\/p><p>3:15 的人說：狂傲的人有福，行惡的人興旺。現在神說：那些人，要如碎秸。<\/p><p>這不是一句要人高興的話，也不是一句要人去算日子的話。它只是說一件事：<strong>他們現在看起來有福，不是終局。<\/strong><\/p><p>這句話要小心用。它是給疲憊的人的安慰，不是給任何人去論斷別人的武器。<\/p><p>和 3:2 對看很有意思：同一種火，對煉金的人是潔淨，對碎秸是燒盡。火沒有變，變的是被火碰到的東西。<\/p><p>我們讀它的方式，不是點名誰是碎秸，是問自己：我的根，扎在哪裡？我今天所靠的，是會被風吹走的，還是不會？<\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְזָרְחָה לָכֶם יִרְאֵי שְׁמִי שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא בִּכְנָפֶיהָ וִֽיצָאתֶם וּפִשְׁתֶּם כְּעֶגְלֵי מַרְבֵּֽק׃<\/p><\/blockquote>","lit":"<blockquote><p>「但向你們敬畏我名的人，必有公義的日頭升起，翅膀下有醫治。你們必出來，跳躍如圈裡的肥犢。」（MT 3:20）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>敬畏<\/td><td>יִרְאֵי<\/td><td>yir’ei<\/td><td>H3373<\/td><td>√ירא（懼、敬）<\/td><td>敬畏的人<\/td><td>★ 與 3:16 同一群人：敬畏的人被記念，也被醫治<\/td><\/tr><tr><td>名<\/td><td>שְׁמִי<\/td><td>shemi<\/td><td>H8034<\/td><td>—<\/td><td>我的名<\/td><td>全書「名」的最後一次出現：從被藐視（1:6），到被敬畏<\/td><\/tr><tr><td>日頭<\/td><td>שֶׁמֶשׁ<\/td><td>shemesh<\/td><td>H8121<\/td><td>—<\/td><td>太陽<\/td><td>與 1:11「從日出」呼應：日出之地，名要為大<\/td><\/tr><tr><td>公義<\/td><td>צְדָקָה<\/td><td>tsedaqah<\/td><td>H6666<\/td><td>√צדק（正直）<\/td><td>公義<\/td><td>與 3:3「憑公義獻供物」呼應<\/td><\/tr><tr><td>翅膀<\/td><td>בִּכְנָפֶיהָ<\/td><td>bikhnafeha<\/td><td>H3671<\/td><td>—<\/td><td>翅膀、衣角<\/td><td>和合本上帝版註：原文是翅膀<\/td><\/tr><tr><td>醫治<\/td><td>וּמַרְפֵּא<\/td><td>umarpe’<\/td><td>H4832<\/td><td>√רפא（醫治）<\/td><td>醫治、治癒<\/td><td>★ 「翅膀」下有醫治：保護與醫治的畫面<\/td><\/tr><tr><td>跳躍<\/td><td>וּפִשְׁתֶּם<\/td><td>ufashtem<\/td><td>H6335<\/td><td>—<\/td><td>跳躍、蹦跳<\/td><td>獲釋的小牛從欄裡衝出來的畫面<\/td><\/tr><tr><td>肥犢<\/td><td>מַרְבֵּֽק<\/td><td>marbeq<\/td><td>H4770<\/td><td>—<\/td><td>肥牛犢<\/td><td>養在圈裡的，被餵養的<\/td><\/tr><\/table>","gram":"<p><strong>① 「公義的日頭」是誰？<\/strong><\/p><ul><li><strong>神的公義與救恩說<\/strong>：「日頭」是神的公義顯現。<\/li><li><strong>彌賽亞說<\/strong>：傳統上，教會把這個畫面連到基督（路 1:78 的「清晨的日光」，是新約自己的相近用語）。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>本講義採<strong>「這使我們想起」<\/strong>，不說「這是預言」。重點是畫面：敬畏他名的人，會迎來日出，並且「翅膀下有醫治」。<\/p><\/blockquote>","exp":"<p><strong>火燒過，天亮了。<\/strong><\/p><p>4:1 的主詞，是「那日」；4:2 的主詞，是「日頭」。同樣是一天，一邊是爐，一邊是光。<\/p><p>分別在哪裡？經文只說了一句話：<strong>「向你們敬畏我名的人。」<\/strong><\/p><p>「翅膀下有醫治」。這是一個溫柔的畫面，像母鳥張開翅膀。你可以想一想，你現在身上最痛的那個地方，在這個畫面裡，被放在哪裡？<\/p><p>接著是最活潑的畫面：「跳躍如圈裡的肥犢。」被關了很久的小牛，被放出來了。牠不是慢慢走，是跳。<\/p><p>不要輕看這個畫面。神給疲憊的人的盼望，不只是「不再受苦」，是<strong>歡喜到跳起來。<\/strong><\/p><p>「日頭」的畫面，與 1:11「從日出之地」呼應：神的名在日出之處被尊為大，也在敬畏他名的人身上，升起來。<\/p><p>這個歡喜，不是靠我們好起來，是因為「日頭」升起來了。你不需要自己發光。<\/p>"},{"a":3,"z":3,"star":0,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַסּוֹתֶם רְשָׁעִים כִּֽי־יִהְיוּ אֵפֶר תַּחַת כַּפּוֹת רַגְלֵיכֶם בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה אָמַר יְהוָה צְבָאֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們必踐踏惡人，在我所定的日子，他們必在你們腳掌下成為灰。」萬軍之耶和華說。（MT 3:21）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>踐踏<\/td><td>וְעַסּוֹתֶם<\/td><td>va‘asotem<\/td><td>H6072<\/td><td>√עסס（踐踏）<\/td><td>踐踏、壓碎<\/td><td>勝利的畫面：腳踩在地上<\/td><\/tr><tr><td>惡人<\/td><td>רְשָׁעִים<\/td><td>resha‘im<\/td><td>H7563<\/td><td>√רשׁע（邪惡）<\/td><td>惡人<\/td><td>與 3:18 的「惡人」相對<\/td><\/tr><tr><td>灰<\/td><td>אֵפֶר<\/td><td>’efer<\/td><td>H665<\/td><td>—<\/td><td>灰<\/td><td>與 4:1「碎秸」「無根」連成一組：被燒盡的結局<\/td><\/tr><tr><td>腳掌<\/td><td>כַּפּוֹת<\/td><td>kappot<\/td><td>H3709<\/td><td>—<\/td><td>手掌、腳掌<\/td><td>畫面是站穩了，腳下踏實<\/td><\/tr><\/table>","gram":"<p><strong>「踐踏惡人」是什麼意思？<\/strong>這是一個勝利的畫面：惡已經成了灰，人踏在上面行走，不再怕它。經文沒有說「要去踐踏」，說的是「在我所定的日子」，那是神的日子。<\/p><blockquote><p><strong>最好的理解：<\/strong>這是安慰，不是命令。本講義<strong>不<\/strong>拿這節鼓勵任何形式的報復，也不把「惡人」對應今日任何族群或政權。<\/p><\/blockquote>","exp":"<p><strong>這一節很容易讀錯。<\/strong><\/p><p>有人讀到「踐踏惡人」，就想到報復、想到打倒誰。但是你看看動詞的位置：這是「在我所定的日子」發生的事，是神的日子，不是我們的行動。<\/p><p>我們要做的，是 4:2 的「出來跳躍」，不是這節的「踐踏」。<\/p><p>這節話，是寫給 3:14–15 那個疲憊的人看的。他看著惡人興旺，覺得吃虧。神說：他們的興旺，像灰一樣，沒有重量。<\/p><p>這是一個很安靜的盼望：你不需要追上去，也不需要證明誰輸誰贏。<\/p><p>你只需要一件事：在那個日子來的時候，腳下是穩的。因為你站的地方，是神所定的。<\/p><p>安息，不是因為惡消失了，是因為你知道，結局不在惡的手裡。<\/p>"},{"a":4,"z":4,"star":1,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>זִכְרוּ תּוֹרַת מֹשֶׁה עַבְדִּי אֲשֶׁר צִוִּיתִי אוֹתוֹ בְחֹרֵב עַל־כָּל־יִשְׂרָאֵל חֻקִּים וּמִשְׁפָּטִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「你們要記念我僕人摩西的律法，就是我在何烈山為以色列眾人所吩咐他的條例與典章。」（MT 3:22）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>記念<\/td><td>זִכְרוּ<\/td><td>zikhru<\/td><td>H2142<\/td><td>√זכר（記念）<\/td><td>記念、記得（祈使）<\/td><td>★ 與 3:16「紀念冊」相呼應：神記念人，人也要記念他的話<\/td><\/tr><tr><td>律法<\/td><td>תּוֹרַת<\/td><td>torat<\/td><td>H8451<\/td><td>√ירה（指示）<\/td><td>教導、律法<\/td><td>與 2:6–7「真實的教導」呼應<\/td><\/tr><tr><td>僕人<\/td><td>עַבְדִּי<\/td><td>‘avdi<\/td><td>H5650<\/td><td>√עבד（服事）<\/td><td>我的僕人<\/td><td>摩西是僕人；人若事奉神，也是僕人<\/td><\/tr><tr><td>何烈山<\/td><td>בְחֹרֵב<\/td><td>bechoreiv<\/td><td>H2722<\/td><td>—<\/td><td>何烈（西奈山的別名）<\/td><td>律法從那裡來；也是神與以色列立約的地方<\/td><\/tr><tr><td>條例<\/td><td>חֻקִּים<\/td><td>chuqqim<\/td><td>H2706<\/td><td>√חקק（刻）<\/td><td>條例<\/td><td>與 3:7「偏離我的條例」呼應<\/td><\/tr><\/table>","gram":"<p><strong>這節為什麼夾在 4:1–3 與 4:5–6 之間？<\/strong>這節與 4:5–6 一起，是十二小先知書、也是全舊約先知書的收尾：先記念律法（摩西），再等候先知（以利亞）。有些傳統在誦讀時，會在 4:6 之後重讀 4:5，免得以「咒詛」作結。<\/p><p><strong>「記念」<\/strong>不只是記得，是把它放在生活裡。2:2 的「不放在心上」，與這裡的「記念」是一個對照。<\/p>","exp":"<p><strong>在審判與盼望之間，神放了一個很小的命令。<\/strong><\/p><p>「你們要記念。」不是「你們要完成」，不是「你們要證明」，只是記得。<\/p><p>神說：你們那麼累、那麼疑惑、那麼多問題。先記念一件事：我曾經向你們說過話。那些話，還在。<\/p><p>在長長的等候裡，最能保守人的，常常不是新的啟示，是舊的話，每天被想起。<\/p><p>你有沒有一節經文，是你在最累的時候，會想起的？<\/p><p>「僕人」是神給摩西最好的名字。全書的疲憊者（3:14）所做的「事奉」，在這個名字下，不再是債務，是一個僕人與主人的關係。<\/p><p>如果沒有，請現在去找一節。它會是你下一個長夜裡，手中的燈。<\/p>"},{"a":5,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה אָֽנֹכִי שֹׁלֵחַ לָכֶם אֵת אֵלִיָּה הַנָּבִיא לִפְנֵי בּוֹא יוֹם יְהוָה הַגָּדוֹל וְהַנּוֹרָֽא׃<\/p><\/blockquote>","lit":"<blockquote><p>「看哪，在耶和華大而可畏的日子來到以前，我必差遣先知以利亞到你們那裡去。」（MT 3:23）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>差遣<\/td><td>שֹׁלֵחַ<\/td><td>shole’ach<\/td><td>H7971<\/td><td>√שׁלח（送出）<\/td><td>差遣<\/td><td>與 3:1「我要差遣我的使者」相呼應<\/td><\/tr><tr><td>以利亞<\/td><td>אֵלִיָּה<\/td><td>’Eliyyah<\/td><td>H452<\/td><td>—<\/td><td>以利亞（意為「我的神是耶和華」）<\/td><td>名字本身就是信仰告白<\/td><\/tr><tr><td>先知<\/td><td>הַנָּבִיא<\/td><td>hannavi’<\/td><td>H5030<\/td><td>√נבא（說預言）<\/td><td>先知<\/td><td>舊約（和合本次序）最後被點名的人物<\/td><\/tr><tr><td>可畏<\/td><td>וְהַנּוֹרָֽא<\/td><td>wehannora’<\/td><td>H3372<\/td><td>√ירא（懼、敬）<\/td><td>可畏的<\/td><td>★ 與 1:14「我的名在列國中是可畏的」呼應：大而可畏的神，大而可畏的日子<\/td><\/tr><\/table>","gram":"<p><strong>① 「以利亞」是誰？<\/strong><\/p><ul><li><strong>以利亞本人再來說<\/strong>：以利亞並未死而升天（王下 2），所以將再來。<\/li><li><strong>以利亞的職分說<\/strong>：有一位像以利亞的人，承接他的精神與使命。<\/li><li><strong>新約的連結<\/strong>：太 11:14 與 17:10–13、可 9:11–13、路 1:17 把這個「以利亞」連到施洗約翰。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>只採用新約自己作過的連結：施洗約翰是「那要來的以利亞」（太 11:14）。本講義<strong>不<\/strong>對號入座任何今日人物。<\/p><\/blockquote>","exp":"<p><strong>舊約最後一個承諾，是一個人。<\/strong><\/p><p>「我必差遣先知以利亞。」在漫長的等候之後，神沒有留下一個制度，沒有留下一個計畫，他留下一個「差遣」。<\/p><p>這個差遣，與 3:1 對得很整齊：3:1 說「我要差遣我的使者」，4:5 說「我必差遣先知以利亞」。<\/p><p>神在用同樣的方式說話：他先差遣人，然後他自己來。<\/p><p>「大而可畏」的日子，不是只有火。新約聽見了這個差遣的回音：預備道路的是約翰（太 11:10、14），他預備的，是耶穌。<\/p><p>「大而可畏」同時用在神的名（1:14）與神的日子（4:5）：他的名可畏，他的日子也可畏。他是前後一致的。<\/p><p>我們被邀請的，不是去猜這一個以利亞是誰、什麼時候來。是被邀請去做一件事：<strong>在等候的日子裡，成為預備道路的人。<\/strong><\/p>"},{"a":6,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְהֵשִׁיב לֵב־אָבוֹת עַל־בָּנִים וְלֵב בָּנִים עַל־אֲבוֹתָם פֶּן־אָבוֹא וְהִכֵּיתִי אֶת־הָאָרֶץ חֵֽרֶם׃<\/p><\/blockquote>","lit":"<blockquote><p>「他必使父親的心轉向兒女，使兒女的心轉向父親，免得我來，用咒詛擊打這地。」（MT 3:24）<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>轉向<\/td><td>וְהֵשִׁיב<\/td><td>vehheshiv<\/td><td>H7725<\/td><td>√שׁוּב（轉回）<\/td><td>使轉回（Hiphil）<\/td><td>★ 全書最後一個行動：這個動詞，從 1:4 一直走到這裡<\/td><\/tr><tr><td>心<\/td><td>לֵב<\/td><td>lev<\/td><td>H3820<\/td><td>—<\/td><td>心<\/td><td>「用心靠聖靈」的「心」：整個人的中心<\/td><\/tr><tr><td>父親<\/td><td>אָבוֹת<\/td><td>’avot<\/td><td>H1<\/td><td>אָב<\/td><td>父親們<\/td><td>與 1:6「我若是父」、2:10「一位父」呼應<\/td><\/tr><tr><td>兒女<\/td><td>בָּנִים<\/td><td>banim<\/td><td>H1121<\/td><td>√בנה（建）<\/td><td>兒子們、兒女<\/td><td>與 3:17「憐恤自己的兒子」呼應<\/td><\/tr><tr><td>咒詛<\/td><td>חֵֽרֶם<\/td><td>cherem<\/td><td>H2764<\/td><td>—<\/td><td>咒詛、完全奉獻給毀滅<\/td><td>與 2:2、3:9 的「咒詛」（ארר）不同字：這個字更重<\/td><\/tr><\/table>","gram":"<p><strong>① 「使父親的心轉向兒女」什麼意思？<\/strong><\/p><ul><li><strong>家庭和好說<\/strong>：世代之間的關係被修復。<\/li><li><strong>同信說<\/strong>：父親與兒女轉向同一位神（路 1:17 引用本節，並加上「叫悖逆的人轉從義人的智慧」）。<\/li><\/ul><p><strong>② 「咒詛」<\/strong>用的是 <strong>חֵרֶם<\/strong>，是比前面用過的 <strong>ארר<\/strong> 更重的詞：整個被獻給毀滅。這個詞放在全書最後，是一個很嚴肅的收束。<\/p><blockquote><p><strong>最好的理解：<\/strong>全書首尾相連：1:6 神是父，人是子，「尊敬我的在哪裡」；4:6 父與子的心再度轉向。<strong>家的和好，是全舊約最後一個盼望。<\/strong>本講義<strong>不<\/strong>要求與傷害自己的父母和好，也不說「你要原諒」。<\/p><\/blockquote>","exp":"<p><strong>舊約最後一個字，是「咒詛」；最後一個盼望，是「心的轉向」。<\/strong><\/p><p>這是一個很特別的結尾。不是勝利，不是宮殿，不是新的城。是：父親的心，轉向兒女；兒女的心，轉向父親。<\/p><p>神說：我要來的時候，我希望我看見的，是一個「家」在轉向。<\/p><p>你想一想，這卷書從第一章開始：「我曾愛你們」，神是父；到最後，父親與兒女的心在轉向。<\/p><p>「轉向」，是全書的動詞。從 1:4 的重建，到 3:7 的邀請，到這裡的家。<\/p><p>我們的家，也許還有沒有說出口的話、還沒有完成的和好。這節經文不要你立刻原諒，不要你立刻轉過去。它只是說：<strong>神最後的心願，是轉向。<\/strong><\/p><p>「免得我來」這句話很有意思：神說他要「來」，卻先差遣人，免得他來的時候，是咒詛。神的差遣，為的是不必走到那一步。<\/p><p>先讓自己的心，轉向祂。因為，當我們被愛，才有力氣轉向別人。<\/p>"}]},"serm":{"1":{"min":13,"blocks":[["h","《我曾愛你們》"],["p","弟兄姊妹平安。"],["p","先說一個很小的場景。"],["p","電話那頭，母親說：「我想你了。」"],["p","你說：「嗯，我在忙。」"],["p","她說：「沒事，你忙，你忙。」"],["p","掛上電話，你沒有覺得什麼。"],["p","可是她，把手機放在桌上，看了很久。"],["p","這樣的愛，你收過嗎？"],["p","這樣的愛，你有沒有，也輕輕放過？"],["p","母親要的其實不多。她不是要你立刻回家，也不是要你解釋什麼，她只是想確定，你知道她還在那裡。"],["p","愛，常常就是這麼小的東西，小到說的人怕說得太重，聽的人又容易隨手放過。"],["p","今天，我們翻開舊約最後一卷書。"],["p","開口第一句，是神說的。"],["p","不是責備，不是命令。"],["p","是一句很輕的話。"],["q","「我曾愛你們。」"],["p","就這麼一句。"],["p","可是，聽的人，回了一句。"],["q","「你在何事上愛我們呢？」"],["p","這句話，才是今天的起點。"],["p","我們分三個點來看。"],["p","第一，神先說：我曾愛你們。"],["p","第二，人回嘴：尊敬我的在哪裡？"],["p","第三，名要被尊為大。"],["p","先看第一點。"],["p","神先說：我曾愛你們。"],["p","這卷書，寫在什麼時候？"],["p","被擄的人，已經回來了。"],["p","殿，也重建了。"],["p","壇上，也有火了。"],["p","可是日子，並不如想像中順。"],["p","莊稼不豐，百姓疲乏。"],["p","人心裡開始有一個聲音。"],["p","這就是神說的愛嗎？"],["p","你有沒有過這個聲音？"],["p","禱告了，卻沒有改變。"],["p","服事了，卻沒有被看見。"],["p","然後你心裡想："],["p","神啊，你愛我，是真的嗎？"],["p","這個聲音，不是新的。"],["p","兩千多年前，就有人這樣問了。"],["p","神的回答，很特別。"],["p","他沒有說：你太不信了。"],["p","他沒有說：你怎麼可以這樣問。"],["p","他說：我曾愛你們。"],["p","這個「曾」字，是完成式。"],["p","意思是：愛，已經發生了。"],["p","而且，到今天，仍然在。"],["p","神回答人的疑問，不是先辯護，而是先把愛放在桌上，然後才慢慢說話。"],["p","好父親就是這樣。孩子在鬧脾氣，他不先講道理，他先蹲下來，說：爸爸在這裡。"],["p","這個姿態請你記住，因為整卷書，神都是這樣和他的百姓說話的。"],["p","然後，他拿出一段歷史。"],["q","「以掃不是雅各的哥哥嗎？我卻愛雅各。」"],["p","孿生兄弟。同一個母腹。"],["p","同樣的起點。"],["p","可是，神揀選了雅各。"],["p","為什麼？不是因為雅各比較好。"],["p","雅各是個詭詐的人。"],["p","你翻開創世記，就知道。"],["p","神的愛，不是因為你好。"],["p","這句話，請你停一下。"],["p","你的好，沒有讓神愛你；你的不好，也沒有讓神不愛你。他愛，是因為他本來就是愛。"],["p","你若還習慣用表現，換一個被愛的位置，今天可以先放下，因為那個位置，早就是你的了。"],["p","愛，不是你賺來的。"],["p","愛，是先給的。"],["p","這樣想，苦日子裡的疑問，就有了另一個答案：日子不順，不等於愛不在。"],["p","愛是一件已經發生的事實，不是每天要靠天氣來確認的心情。"],["p","這裡有一個要小心的地方。"],["p","「愛雅各，恨以掃」，不是拿來比較人的。"],["p","也不是拿來看別人的荒涼。"],["p","「愛」與「恨」，在聖經裡，常是比較的語言。"],["p","意思是：選了，或沒有選。"],["p","所以，請不要拿這節經文去看任何一個民族，也不要拿它去論斷任何一個人。"],["p","經文要我們看的，不是別人的荒涼，而是自己到底領了多大的恩。"],["p","一個人若只想著誰被丟下，他就看不見，自己是被拿起來的。"],["p","這節話，只要我們看見一件事："],["p","你今天還在這裡，是因為有人先愛了你。"],["p","這是我們整個生命的次序。"],["p","愛在前面，回應在後面。"],["p","你若是父母，你就知道：孩子還在襁褓裡，什麼也不會做的時候，你已經愛他了。"],["p","他沒有賺到那份愛，他只是被抱在懷裡，慢慢長大，才學會說：謝謝。"],["p","我們與神的關係，也是這個次序。"],["p","不是先努力，才被愛。"],["p","是先被愛，才有力氣努力。"],["p","舊人，總是想用表現，換一個被愛的位置。"],["p","新人，是在被愛裡，安息。"],["p","無己，不是我更努力。"],["p","無己，是我知道，我已經被愛了。"],["p","好，這是第一點。"],["p","第二點。"],["p","人回嘴：尊敬我的在哪裡？"],["p","神說了愛。接著，他問了一個問題。"],["q","「我既為父親，尊敬我的在哪裡呢？」"],["p","注意，他不是先講規條。"],["p","他說：我是父。"],["p","他把話，放在家裡。"],["p","然後，他點名了。"],["p","點的是祭司。"],["p","就是站在壇前的人。"],["p","他說：「藐視我名的祭司啊。」"],["p","祭司說什麼？"],["q","「我們在何事上藐視你的名呢？」"],["p","你聽聽這句話。"],["p","他們不覺得自己有問題。"],["p","這是最難的一種光景。"],["p","神說：你們獻上污穢的食物。"],["p","你們獻瞎眼的、瘸腿的、有病的。"],["p","律法明明說，要獻無殘疾的。"],["p","他們不是不知道。"],["p","他們是不放在心上。"],["p","這是最容易的一種背叛。不是做了什麼大惡，而是把神放在最不要緊的地方，像一份快過期的禮物，隨手拿來送人。"],["p","這種光景，不會有人跳出來說：我要背叛神。它只會一天一天，變成「差不多就好」。"],["p","「差不多就好」，是敬虔最安靜的敵人。"],["p","神用了一個很生活的比較。"],["q","「你獻給你的省長，他豈喜悅你，豈能看你的情面嗎？」"],["p","你拿一隻瘸腿的羊，去見省長試試看。"],["p","你不敢。"],["p","因為你怕他的臉色。"],["p","可是，你卻敢拿去見神，因為你以為，神不會當場變臉。"],["p","這是一個很扎心的問題。"],["p","我們常常，把最好的，給了「省長」。"],["p","給了老闆。給了客戶。給了面子。"],["p","把剩下的，給神。"],["p","一個週間忙到深夜的人，主日早上睡過頭，說：神知道我累。這句話是真的，神確實知道。"],["p","但同一個人，若客戶約他早上八點，他是不敢睡過頭的。"],["p","這不是在定罪，是在照鏡子：我們把什麼放在前面，我們的心，就在哪裡。"],["p","時間，是剩下的。"],["p","精神，是剩下的。"],["p","金錢，是剩下的。"],["p","神說，這不為惡嗎？"],["p","他說得很重。"],["p","甚至說：與其這樣，不如關上殿門。"],["p","因為你們的火，是白燒的。"],["p","更讓人心驚的是，這樣獻上之後，他們還在求神施恩。"],["p","神說：這樣的事是你們親手作的，我豈能看你們的情面呢？"],["p","意思是：一面把殘次的放在壇上，一面又盼望神賜下最好的，這中間有一個不對稱，連你自己都該聽得出來。"],["p","這句話，不是要我們不敬拜。"],["p","是要我們醒過來。"],["p","敬拜，不是一個動作。"],["p","敬拜，是一顆心。"],["p","一個人可以把詩歌唱得很準，把奉獻袋傳得很準，把服事排得很準，卻讓心遠遠站在門外。"],["p","神看的，不是我們動作標不標準，而是我們的心，有沒有一起進來。"],["p","還有更危險的一句。"],["q","「這些事何等煩瑣！」"],["p","並且，一聲鼻息。"],["p","你有沒有嘆過這口氣？"],["p","主日，又要去。"],["p","禱告，又要做。"],["p","服事，又要排。"],["p","累。煩。"],["p","神沒有罵這個累。"],["p","他問一個很準的問題："],["p","你們獻上的，是什麼？"],["p","是搶來的？是瘸腿的？是病的？"],["p","是你最不想要的？"],["p","如果敬拜，永遠排在最後。"],["p","它就一定會變成煩。"],["p","不是時間不夠。"],["p","是位置排錯了。"],["p","有一個辨認的方法。"],["p","你敬拜的時候，是在獻，還是在交差？"],["p","獻，是歡喜。"],["p","交差，是煩。"],["p","你的心，在哪一邊？"],["p","先不要定罪自己。"],["p","先看見，就好。"],["p","看見，是改變的開始。"],["p","有人讀到這裡，會以為這一章是在罵祭司。不是的。這面鏡子，是要每一個站在神面前的人來照。"],["p","牧者要照，同工要照，坐在位子上的每一位，也都要照。"],["p","照鏡子，不是為了羞愧，是為了看見哪裡該重新擺正。"],["p","然後，回到那一句話：我曾愛你們。"],["p","改變觀念，就改變生命。"],["p","我們來到第三點。"],["p","名要被尊為大。"],["p","在祭司的敷衍旁邊，神放了一幅大圖。"],["q","「從日出之地到日落之處，我的名在外邦中必尊為大。」"],["p","從東到西。整個世界。"],["p","這是什麼意思？"],["p","意思是：神不缺人。"],["p","他不需要，我們來撐場。"],["p","他的名，本來就大。"],["p","神的榮耀，從來不靠我們供應。祂是那位先於日出、先於萬有的王，我們只是被邀請，進到祂的光裡。"],["p","這節話也不是說，所有的敬拜都在敬拜同一位神。它說的是：這位神的名，終究要被人認出來。"],["p","這不靠我們的熱鬧，也不靠我們的努力，是靠他自己的榮耀。"],["p","經文說，到處有人要向我的名燒香，獻潔淨的供物。香，在聖經裡常常是禱告的影子。"],["p","也就是說，神所要的，不是排場，是一顆潔淨的心，帶著誠實的禱告，來到他面前。"],["p","我們的位置，是看見，是領受，是在這個名底下，歡喜地獻上。"],["p","這個畫面，把我們放回位置。"],["p","我們不是替神，把名撐大。"],["p","我們是來領受，一個本來就大的名。"],["p","你想，太陽升起來的時候，需要我們鼓掌嗎？不需要。"],["p","可是人一站進光裡，身上就暖了。"],["p","敬拜，就是站進光裡。"],["p","不是替太陽加光，是讓自己被光照著。"],["p","這一點，解開一個很深的結。"],["p","很多人事奉，是焦慮的。"],["p","我夠不夠？我獻得夠不夠？"],["p","因為，心裡有一個錯誤的想法："],["p","神需要我。"],["p","但是，經文說：他是大君王。"],["q","「因為我是大君王，我的名在外邦中是可畏的。」"],["p","前面神還提到，有人許了願，卻拿有殘疾的獻給主，這人是被咒詛的。"],["p","這句話聽來很重，但你仔細想，他在乎的不是祭牲的價錢。"],["p","他在乎的，是那個許願的人，心裡到底有沒有把他當王。"],["p","許願的時候，你把他當王；獻上的時候，你卻把他當成可以打折的對象。"],["p","第一章，從頭到尾，是一個圓。"],["p","開頭說：我曾愛你們。"],["p","結尾說：我是大君王。"],["p","愛我們的，是這位大君王。"],["p","要我們敬畏的，是這位愛我們的。"],["p","我們不是在伺候一位挑剔的神。"],["p","我們是在回應，一位先愛了我們的王。"],["p","這是一個，讓人鬆一口氣的次序。"],["p","讓耶穌作王，不是一個沉重的負擔。"],["p","有些人聽到作王，就想到壓力，想到要更拚命。其實正好相反。"],["p","王若先愛了你，你在他底下，就不必再證明自己，只需要誠實地靠近。"],["p","是一個認出。"],["p","認出：他是王。"],["p","也認出：他是先愛我的那一位。"],["p","讓我們把這一章，帶回家。"],["p","先帶回三個問題。"],["p","第一，我有沒有，聽見神說：我曾愛你？"],["p","還是，我只聽見自己的不足？"],["p","第二，我獻給神的，是最好的，還是剩下的？"],["p","第三，我的敬拜，是歡喜，還是煩？"],["p","不要急著回答。"],["p","有些答案，是要在安靜裡，才聽得見的。若是心裡一時只有疲倦，也沒有關係，把疲倦，也帶到他面前。"],["p","先安靜。"],["p","這一章不是要你更自責，而是要你先被愛，再回應；先被抱住，再起身。"],["p","愛先來，我們的回應，才不會變成重擔。"],["p","然後，只做一件小事。"],["p","這一週，找一個固定的時間。"],["p","把手機放下。"],["p","唸一遍：「我曾愛你們。」"],["p","就這一句。"],["p","對自己說。"],["p","也對他說：謝謝你，先愛了我。"],["p","在這個愛裡，再去想："],["p","我有什麼，要重新放回最好的位置。"],["p","然後，想起那通電話。"],["p","母親說：我想你了。你說：我在忙。"],["p","神在這一章對我們說的，其實是同樣的一句話，只是他的語氣，從來沒有掛斷過。"],["p","今天，就回他一句：我也想你。"],["p","讓我們禱告。"],["p","親愛的天父，謝謝你，先愛了我們。"],["p","我們常常問：你在何事上愛我們。"],["p","求你讓我們看見，你一直在。"],["p","也求你赦免我們，把剩下的給了你。"],["p","今天，我們把最好的，重新放在你面前。"],["p","讓你的名，在我們的生命中，被尊為大。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"2":{"min":13,"blocks":[["h","《我們豈不都是一位父嗎》"],["p","弟兄姊妹平安。"],["p","先翻開一本舊相簿。"],["p","翻到其中一頁，是婚禮那一天。"],["p","照片裡的兩個人，笑得很傻。"],["p","手牽著手，眼睛亮亮的。"],["p","那時候，沒有人想過，二十年後的餐桌上，會那麼安靜。"],["p","不是吵架，是安靜。"],["p","兩個人各自低頭，滑著手機，把飯吃完，說一聲「我吃飽了」，就離席。"],["p","你有沒有看過這樣的一張餐桌？"],["p","也許，你家就是。"],["p","也許，你就是那個低頭滑手機的人；也許，你是那個看著對方低頭，卻不知道從何說起的人。"],["p","不是誰做錯了什麼大事，只是日子久了，話越來越少，眼睛也越來越少看著對方。"],["p","婚禮那天說的「無論順境逆境」，後來真正的考驗，常常不在大風大浪，而是落在最平常的一頓晚餐。"],["p","今天這一章，神把我們帶到的，正是這張餐桌。"],["p","這一章，在講一個字：約。"],["p","就是那一天，你說出口的話。"],["p","我們分三個點來看。"],["p","第一，祭司與約：口中該有的話。"],["p","第二，弟兄與妻子：不要以詭詐待人。"],["p","第三，言語煩瑣神：公義的神在哪裡？"],["p","先看第一點。"],["p","祭司與約：口中該有的話。"],["p","一開頭，神是對祭司說話。"],["q","「眾祭司啊，這誡命是傳給你們的。」"],["p","祭司，是站在神與人中間的人。"],["p","一邊聽神說話，一邊對人說話。"],["p","所以他們的嘴，特別重要。"],["p","神回過頭，提起一個舊約，是與利未所立的約。"],["p","他們的先祖，曾經是什麼樣子？"],["q","我曾與他立生命和平安的約。"],["p","生命，和平安。"],["p","生命，是裡面有神的活水；平安，是和神、和人，都沒有隔閡。"],["p","一個人若有了這兩樣，他走到哪裡，哪裡就有一點不一樣。"],["p","這兩樣，是約的核心。"],["p","神立約，不是要把人綁住。"],["p","是要把生命和平安，交在人的手裡。"],["p","接著，有一幅畫面。"],["q","真實的律法在他口中，他嘴裡沒有不義的話。"],["p","他嘴裡，有真實。"],["p","然後，還有一句："],["q","使多人回頭離開罪孽。"],["p","他的話，使人回頭。"],["p","他為什麼能這樣？經文說，因為他「以平安和正直與我同行」。"],["p","他的話有重量，是因為他的腳步，是和神一起走的。"],["p","話的力量，不在聲音大，在於說話的人，有沒有先和神同行。"],["p","一位老師，在學生考砸的時候，若只說「沒關係」，他是溫柔；若說「我們一起看看哪裡錯了，我陪你」，他是在使人回頭。"],["p","使人回頭，需要真實，也需要愛。兩樣缺了一樣，約就守不住。"],["p","這是一個好牧者、好老師、好父母，該有的樣子。"],["p","可是現在呢？"],["q","你們卻偏離正道，使許多人在律法上跌倒。"],["p","同一張嘴。"],["p","從前，領人回頭。"],["p","現在，使人跌倒。"],["p","差別在哪裡？"],["p","在最後一句："],["q","因你們不守我的道，竟在律法上瞻徇情面。"],["p","瞻徇情面，就是看人臉色說話。"],["p","對有錢的，講軟一點。"],["p","對有勢的，不敢講。"],["p","對得罪不起的人，只講好聽的。"],["p","這不只是祭司的難處。"],["p","每一個會對別人說話的人，都有。"],["p","父母，會對孩子說話。"],["p","老師，會對學生說話。"],["p","同工，會對弟兄姊妹說話。"],["p","我們的話，是使人回頭，還是使人跌倒？"],["p","經文說，祭司的嘴裡當存知識。"],["p","這個「知識」，不只是學問。"],["p","是認識神的知識，是認識神怎樣愛人的知識。"],["p","這裡，要先提醒一件事。"],["p","這段經文，不是讓我們去挑別人的毛病。"],["p","不是讓會眾去挑牧者，也不是讓牧者去挑會眾。"],["p","它是對每一個，肩上有託付的人說的。"],["p","包括我，也包括你。"],["p","我們若傳講了神的話，卻讓人更怕神，更遠離神，就要回頭。"],["p","我們若傳講了神的話，讓人看見他的慈愛，我們就在這個約裡。"],["p","約，是用口說出來的。"],["p","說出口的話，是有重量的。許諾的人要記得，聽見許諾的人，也會記得。"],["p","神是那位，一直信實地守著他自己所說的話的神。我們學習守約，是在學他的樣式。"],["p","所以，口，是約最先要守住的地方。"],["p","再來第二點。"],["p","弟兄與妻子：不要以詭詐待人。"],["p","這一段，話題轉進每一個家。"],["q","我們豈不都是一位父嗎？豈不是一位神所造的嗎？"],["p","請注意，神是先說「父」。"],["p","我們是同一位父的孩子，同在一個家裡。"],["p","所以，下一句才這麼痛："],["q","我們各人怎麼以詭詐待弟兄，背棄了神與我們列祖所立的約呢？"],["p","詭詐，就是表面是一回事，心裡是另一回事。"],["p","接著，神把這件事，帶進了婚姻。"],["p","有兩件事被點名。"],["p","第一件，是娶了事奉外邦神的女子。"],["p","這裡的重點，不在哪一個民族，而在信仰的忠誠：心被帶離了神。"],["p","第二件，是對待妻子。"],["q","使前妻嘆息哭泣的眼淚遮蓋耶和華的壇。"],["p","你有沒有看見這幅畫？"],["p","壇上，有供物。"],["p","壇上，也有眼淚。"],["p","是誰的眼淚？"],["p","是那個被丟下的人的眼淚。"],["p","神說：我不再看顧那供物。"],["p","意思是，神先看見了眼淚。"],["p","他看見眼淚，比看見供物更清楚。"],["p","所以，我們要在這裡停下來，說幾句話。"],["p","請你放心。"],["p","這段經文，不是要定罪任何一個離婚的人。"],["p","也不是要對一個已經受傷的人，再說一次：你不夠好。"],["p","你若是被離棄的那一個，神的眼睛，是看顧著你的。"],["p","你若是在婚姻裡，被暴力對待，神說得非常清楚："],["q","休妻的事和以強暴待妻的人都是我所恨惡的！"],["p","這句話，不是叫你留在危險裡。"],["p","你的安全，比一個形式更重要。"],["p","請你找可信靠的人，找專業的協助。這是神的心意。"],["p","那麼，經文在責備誰？"],["p","責備的，是那個用詭詐、背棄盟約的人。"],["p","是輕看盟約的那顆心。"],["p","神責備的是詭詐，是強暴，不是眼淚。"],["p","若你是在婚姻裡受過傷的人，今天聽到這裡，心裡也許還是會痛。"],["p","請你知道，神不是要你再把所有的錯，扛回自己身上。"],["p","你可以帶著那份痛，來到壇前，他看得見，他也記得。"],["p","神把眼淚，看得這麼重。"],["q","因耶和華在你和你幼年所娶的妻中間作見證。"],["p","神，是你婚禮那天的見證人。"],["p","很多時候，我們以為婚姻裡只有兩個人。"],["p","但經文告訴我們：還有第三位。"],["p","他沒有離席。"],["p","你們說「我願意」的那一刻，他就在場。"],["p","你們後來吵架、冷戰、各自轉身的時候，他也在場。"],["p","他今天還在。"],["p","不論你現在的婚姻是順是難，是完整是破碎，是單身是同行，這一位見證人，都沒有離開你。"],["p","他不是來審判你的過去，是來陪你，走下一步。"],["p","他看見你們的第一天，也看見你們現在的餐桌。"],["p","他說，要謹守你們的心。"],["p","經文還說，神造人的時候，是盼望得著虔誠的後裔。"],["p","所以，婚姻不只是兩個人的事，孩子，也在看。"],["p","孩子不一定聽得懂你講了什麼大道理，但他一定看得懂，爸媽怎麼對待彼此。"],["p","你們怎麼守約，就是他最早讀到的一本聖經。"],["q","所以當謹守你們的心，不可行詭詐。"],["p","謹守，守的是心。"],["p","不是先守住面子，不是先守住外面的樣子。"],["p","是守住那一顆，在婚禮那天說「我願意」的心。"],["p","婚姻，常常不是一夜之間壞的。"],["p","是一點一點，心離開了。"],["p","一個沒有說出口的委屈。"],["p","一次沒有解釋的冷淡。"],["p","一段各自忙各自的日子。"],["p","然後有一天，餐桌上，只剩下安靜。"],["p","所以，守心，要趁早。"],["p","守心，不是等到出了問題才開始。"],["p","像家裡的水管，平常就要看一看；等到漏水，牆壁已經濕了。"],["p","今晚，就可以開始。"],["p","一句：謝謝你。"],["p","一句：我錯了。"],["p","一個放下手機的十分鐘。"],["p","這些都很小。"],["p","可是，約，就是這樣一天一天被守住的。"],["p","若你是單身，這一段，也和你有關。"],["p","因為神說的，是「弟兄」。"],["p","你和每一個與你有關係的人，都有一份約。"],["p","朋友的約。"],["p","同工的約。"],["p","父母與子女的約。"],["p","你有沒有，以詭詐待了某一個人？"],["p","表面笑著，心裡卻關上了門？"],["p","神說：謹守你的心。"],["p","守約，不是靠咬牙撐著。"],["p","撐著的婚姻，會累；被愛澆灌的婚姻，才有力氣。"],["p","這個愛的源頭，不在配偶身上，在神身上。"],["p","好，來到第三點。"],["p","言語煩瑣神：公義的神在哪裡？"],["p","這一章的最後，只有一節。"],["q","你們用言語煩瑣耶和華，你們還說：「我們在何事上煩瑣他呢？」"],["p","他們是怎麼煩瑣神的？"],["q","公義的神在哪裡呢？"],["p","這句話，有兩種聲音。"],["p","一種，是誠實的哭。"],["p","那是受傷的人，在問：神啊，你在哪裡？"],["p","這樣的問，神不責備。"],["p","詩篇裡，滿滿都是。"],["p","另一種，是冷的。"],["p","是先決定了神不在，再用這句話，把自己的問題包起來。"],["p","瑪拉基在這裡指的，是後者。"],["p","因為他們說："],["q","凡行惡的，耶和華眼看為善，並且他喜悅他們。"],["p","他們不是在問，他們是在判。"],["p","問，是帶著一顆開著的心，等候回答。"],["p","判，是心已經關上，只剩下結論。"],["p","你今天，是哪一種？"],["p","判神不公義。"],["p","你發現沒有？"],["p","前面，他們才讓妻子流了淚。"],["p","接著，他們就問：公義的神在哪裡？"],["p","有時候，我們問神公義在哪裡，"],["p","卻沒有看見，自己在別人眼中，是不是那個不公義的人。"],["p","這不是要我們不再問。"],["p","是要我們問的時候，先照一照自己。"],["p","可是，如果你今天正在哭，請你繼續問。"],["p","神不怕你的問，他怕的，是你把門關上，什麼都不再對他說。"],["p","誠實地問，是靠近；冷冷地判，是離開。這兩種，神聽得出來。"],["p","這個問題，神有回答。"],["p","下一章的開頭，他就說：我要差遣使者。"],["p","我們留到下一章。"],["p","今天，只要記住："],["p","神聽見了這句話，他要回答。"],["p","神不是沒有聽見，只是他回答的時候，常常不照我們的時間，也不照我們預想的方式。"],["p","他的回答，往往比我們問的，更深。"],["p","讓我們把這一章，帶回家。"],["p","有己的人，守約是在計算：他先，我才。"],["p","無己的人，守約是在說：我先，因為我已經被愛了。"],["p","謙卑，帶動謙卑。"],["p","你先放下，往往就帶動對方放下。"],["p","先帶回三個問題。"],["p","第一，我的話，是使人回頭，還是使人跌倒？"],["p","第二，我的心，有沒有悄悄離開了，某一個我曾經說過「我願意」的人？"],["p","第三，我問神「公義在哪裡」的時候，是在哭，還是在判？"],["p","不要急著回答，先安靜。"],["p","這三個問題，不是用來審判自己的，是用來看見：哪一個地方，我需要神再一次扶我起來。"],["p","這一週，只做一件事。"],["p","找一位與你有約的人。"],["p","也許是你的配偶，也許是父母，也許是一個很久沒有聯絡的朋友。"],["p","對他說一句你一直沒有說的話：謝謝你，或者，對不起。"],["p","不是為了立刻修復一切。"],["p","只是把心，往回守一步。"],["p","也許是今天晚餐，把手機翻過去，問一句：你今天，累不累？"],["p","也許是打一通電話，不為任何事，只說：我想起你了。"],["p","很小，卻是在守約。"],["p","若你身邊，有人正流著眼淚，"],["p","請你先不要講道理，先陪他坐一會兒。"],["p","神是看見眼淚的神。"],["p","我們也可以，成為看見眼淚的人。"],["p","讓我們禱告。"],["p","親愛的天父，謝謝你，是我們共同的父。"],["p","你是我們婚禮的見證，也是我們每一個約的見證。"],["p","求你赦免我們，用詭詐待人，用言語使人跌倒。"],["p","求你安慰那些流著眼淚的人，保護他們的安全，醫治他們的心。"],["p","也求你幫助我們，謹守自己的心，一天一天，守住我們說過的話。"],["p","願你的名，在我們的家中，被尊為大。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"3":{"min":13,"blocks":[["h","《現在你們要轉向我》"],["p","弟兄姊妹平安。"],["p","想像一個人，開著車，在陌生的山路上。"],["p","天色漸漸暗了，手機沒有訊號，油表也快到底。"],["p","他心裡越來越急，腳下越踩越重。"],["p","他想：只要再開快一點，也許就到了。"],["p","可是路，越走越陌生。"],["p","這時候，他最需要做的一件事，是什麼？"],["p","不是再加速。"],["p","是把車停下來。"],["p","停下來，抬起頭，看一看，自己到底在哪裡。"],["p","然後，掉頭。"],["p","掉頭，不是承認自己很笨，是承認自己想要到的地方，不在這個方向。"],["p","很多人不是不想回頭，是怕回頭的時候，要承認前面走錯了的那一段路。"],["p","今天這一章，神對他的百姓，說的就是這句話。"],["q","現在你們要轉向我，我就轉向你們。"],["p","我們分三個點來看。"],["p","第一，主要忽然進殿：那把火，是為了潔淨。"],["p","第二，轉向與奉獻：你們要轉向我。"],["p","第三，事奉是徒然的嗎？有一本紀念冊。"],["p","先看第一點。"],["p","主要忽然進殿：那把火，是為了潔淨。"],["p","這一章，一開口，就是一個宣告。"],["q","我要差遣我的使者在我前面預備道路。"],["p","有一位使者，要來預備道路。"],["p","然後，那位百姓所尋求的主，要忽然進入他的殿。"],["p","注意那個「忽然」。"],["p","不是預告了很久，可以慢慢準備。"],["p","有些人，一直在等一個「比較合適的時候」，再來把心擺正。"],["p","可是經文說，那位主，是忽然進殿的。"],["p","所以，與其等到合適，不如今天，就把殿，整理一下。"],["p","是在你以為還有時間的時候，他來了。"],["p","新約裡，馬太福音十一章，耶穌自己引用了這一節，指向施洗約翰。"],["p","也就是說，預備道路的那一位，是為耶穌預備的。"],["p","可是，這裡有一個問題："],["q","他來的日子，誰能當得起呢？他顯現的時候，誰能立得住呢？"],["p","這個問題，讓人倒吸一口氣。"],["p","因為他來，像什麼？"],["q","他如煉金之人的火，如漂布之人的鹼。"],["p","火，和鹼。"],["p","都是潔淨用的東西。"],["p","煉金的人，用火，不是要把金子燒掉。"],["p","是要把雜質，燒出來。"],["p","漂布的人，用鹼，不是要把布洗壞。"],["p","是要洗去，布上的髒。"],["p","所以，這團火，是衝著雜質來的，不是衝著人來的。"],["p","有一個細節，特別值得停下來看。"],["q","他必坐下如煉淨銀子的。"],["p","他，坐下。"],["p","煉銀子的人，是坐著的。"],["p","因為他不能走開。"],["p","他要一直看著，火候夠不夠，銀子，有沒有太熱。"],["p","他一直在那裡，一直盯著。"],["p","你在受煉的時候，也許覺得，神不在。"],["p","你可能正在一段，很難熬的日子裡：工作不順，病痛纏身，關係破裂。"],["p","你問：神，你在哪裡？"],["p","經文給你的畫面，不是一位遠遠站著的神，是一位坐下來，盯著火候的神。"],["p","他在火旁，一刻也沒有離開。"],["p","可是經文說，他是坐下的，他看著你。"],["p","這個火，是為了什麼？"],["q","他們就憑公義獻供物給耶和華。"],["p","為了讓我們，能夠把真正的獻上，帶到他面前。"],["p","第五節，有一份名單。"],["q","警戒行邪術的、犯姦淫的、起假誓的、虧負人之工價的、欺壓寡婦孤兒的、屈枉寄居的，和不敬畏我的。"],["p","你發現了嗎？"],["p","裡面有「虧負人之工價的」。"],["p","有「欺壓寡婦孤兒的」。"],["p","有「屈枉寄居的」。"],["p","敬拜的光景，和怎麼對待最小的人，是連在一起的。"],["p","你在壇前，說多麼敬虔；"],["p","一個企業的主人，每個主日，坐在前排，唱得最大聲；"],["p","週一，他卻把員工的加班費，拖了三個月。"],["p","神說，他要作見證，警戒這樣的人。"],["p","敬虔，不能只放在週日。"],["p","你的員工、你的家人、你身邊最軟弱的人，卻在你手下嘆氣。"],["p","神，聽得見。"],["p","然後，有一節，是這一段的重心："],["q","因我－耶和華是不改變的，所以你們雅各之子沒有滅亡。"],["p","我們沒有被燒盡，不是因為我們夠好。"],["p","是因為，他是不改變的。"],["p","他的愛，不改變。"],["p","他的約，不改變。"],["p","這是整個火煉的底氣。"],["p","他不是因為我們好，才不毀滅我們。"],["p","他是因為他自己，是這樣的神。"],["p","這句話，我們可以放在心裡，一輩子。"],["p","當你看見自己的軟弱，不要急著問：我是不是被放棄了？"],["p","先問：他是不是還是那一位不改變的神？"],["p","他是因為他自己，是這樣的神。"],["p","再來第二點。"],["p","轉向與奉獻：你們要轉向我。"],["p","神說："],["q","從你們列祖的日子以來，你們常常偏離我的典章而不遵守。"],["p","這是一個很長的歷史。"],["p","不是這一代才這樣，是一代又一代。"],["p","然後，他發出邀請："],["q","現在你們要轉向我，我就轉向你們。"],["p","先看這個「現在」。"],["p","不是等你整理好，不是等你更好。"],["p","你不必先把自己，整理成一個可以見神的樣子。"],["p","你就帶著現在的樣子，轉身。"],["p","他會一路，幫你整理。"],["p","是現在。"],["p","再看這個次序："],["p","你轉向我，我就轉向你。"],["p","其實，神從來沒有離開過。"],["p","他說「我就轉向你們」，是說，當你轉身的時候，你會發現，他的臉，早就在那裡了。"],["p","可是百姓說："],["q","我們如何才是轉向呢？"],["p","這是一個很誠實的問題。"],["p","不是反抗，而是真的不知道，怎麼轉。"],["p","神很具體地回答了。"],["p","他回答的方式，是帶他們看一件，他們每個月都經過的事。"],["q","人豈可奪取神之物呢？你們竟奪取我的供物。"],["p","他們說：我們在何事上奪取？"],["p","神說：十分之一，和當獻的供物。"],["p","這裡，要特別小心。"],["p","這段經文，常常被拿來向人要錢。"],["p","我們要說清楚：這不是它的意思。"],["p","第一，這是對一個守約的民族說的。"],["p","在那個時代，十分之一，是用來供養利未人、照顧寄居的、孤兒和寡婦。"],["p","倉庫空了，被忘記的人，就挨餓了。"],["p","所以，奪取的，不只是神，也是那些最軟弱的人。"],["p","第二，「試試我」，不是一個賺錢的公式。"],["p","不是你放一份進去，神就必須回你一份更大的。"],["p","那是把神，當成了可以操作的機器。"],["p","第三，如果你今天很窮，真的拿不出來。"],["p","神沒有生你的氣。"],["p","他看的是心，不是金額。"],["p","所以，這一段，真正要說的是什麼？"],["p","是這顆心，有沒有留下一塊，不肯交給神的地方。"],["p","有人，留下的是錢。"],["p","有人，留下的是時間。"],["p","有人，留下的是一段，不肯放手的關係。"],["p","有人，留下的是一個，不肯饒恕的人。"],["p","有人，留下的是一份，從小就帶在身上的自我保護。"],["p","神不是要拿走你的一切，他只是邀請你：這一塊，也讓我來。"],["p","轉向，就是把這一塊，交回去。"],["p","轉向，不是做一件大事。"],["p","是在你知道自己偏了的那一刻，停下來，說：主啊，我回來了。"],["p","這是最困難，也是最簡單的一件事。"],["p","困難，是因為我們的驕傲，不喜歡承認自己偏了。"],["p","簡單，是因為神，從來沒有要求我們，一次轉到完美，他只要我們，朝向他。"],["p","再看，轉向以後，神說了一幅畫面："],["q","萬國必稱你們為有福的，因你們的地必成為喜樂之地。"],["p","這是一個美好的應許。"],["p","但是，這個福，是一個回到神身邊的人，自然會有的生命的光景。"],["p","重點不在多了什麼，而在，我們和神，不再隔著一塊空地。"],["p","接著，來到第三點。"],["p","事奉是徒然的嗎？有一本紀念冊。"],["p","這一段，是整卷書，最誠實的一段。"],["p","百姓說："],["q","事奉神是徒然的，遵守神所吩咐的，在萬軍之耶和華面前苦苦齋戒，有什麼益處呢？"],["p","你聽，這是一個很累的人，在說話。"],["p","他做了該做的。"],["p","他守了，他齋戒了。"],["p","可是他看見，旁邊那些狂傲的人，反而過得很好。"],["p","你有沒有，這樣想過？"],["p","我這樣努力，到底有沒有用？"],["p","神沒有罵他。"],["p","你要知道，神不怕我們誠實地說出疲累。"],["p","他怕的，是我們把疲累藏起來，一個人硬撐，最後悄悄離開。"],["p","瑪拉基書，把這句「事奉神是徒然的」，原原本本記在經文裡。"],["p","這說明，神連我們的懷疑，都接得住。"],["p","神反而，對他們說了一幅畫面。"],["q","那時，敬畏耶和華的彼此談論，耶和華側耳而聽。"],["p","有一群人，在彼此談論。"],["p","也許，是在傾訴，也許，是在彼此扶持。"],["p","神，側著耳朵，聽。"],["p","神的耳朵，不是只聽大聲的禱告，也聽低聲的、斷斷續續的、說到一半就哽咽的那一種。"],["p","他不是在遠處，他是靠近的，在聽。"],["p","你想想，一個疲累的人，在深夜裡，對著另一個疲累的人，說出心裡的話。"],["p","那個晚上，沒有人記錄，也沒有人鼓掌。"],["p","可是經文說，神側耳而聽。"],["p","你被聽見了。"],["p","紀念冊的意思，不是要我們去數，我們做了多少。"],["p","它是要我們安心：沒有一滴眼淚，是被浪費的；沒有一個暗處的忠心，是落空的。"],["q","且有紀念冊在他面前，記錄那敬畏耶和華、思念他名的人。"],["p","有一本紀念冊。"],["p","這不是一本，決定誰得救的名冊。"],["p","它是在說：神，記得。"],["p","你在暗處的禱告，他記得。"],["p","你沒人看見的忍耐，他記得。"],["p","你在別人以為徒然的地方，守住的那一件事，他記得。"],["p","接著，是這一章最溫柔的話："],["q","他們必屬我，特特歸我。我必憐恤他們，如同人憐恤服事自己的兒子。"],["p","特特歸我，就是，特別屬於我。"],["p","像一個人最珍愛的寶物。"],["p","他憐恤我們，像父親憐恤兒子。"],["p","你看，我們又回到了，第一章。"],["p","第一章：我若是父。"],["p","第三章：像父親憐恤兒子。"],["p","整卷書，是這位父親，在對他的孩子說話。"],["p","最後，是一個應許："],["q","那時你們必歸回，將善人和惡人，事奉神的和不事奉神的，分別出來。"],["p","今天，我們看見的，常常是混在一起的。"],["p","但有一天，會分明。"],["p","我們不需要，現在就急著判斷。"],["p","我們常常急著，把人分成好人和壞人，把自己放在好的那一邊。"],["p","經文說，分別，是神的事，而且在他所定的日子。"],["p","我們的事，是今天，轉向他。"],["p","我們只需要，今天，繼續站在敬畏他的人中間。"],["p","讓我們把這一章，帶回家。"],["p","這一章的主題，是一個動詞：轉。"],["p","這一章，是在教我們怎麼轉。"],["p","有己的人，轉向，是先看別人該不該先改。"],["p","無己的人，轉向，是先回到本位，說：主，我在這裡。"],["p","焦點在耶穌，不在自己的表現，不在別人的光景，也不在環境。"],["p","先帶回三個問題。"],["p","第一，我現在，是不是已經走在一條，越走越陌生的路上？"],["p","第二，我的心裡，有沒有留下一塊，不肯交給神的地方？"],["p","第三，我覺得徒然的時候，我有沒有，把這份累，說給神聽？"],["p","不要急著回答，先安靜。"],["p","這一週，只做一件事。"],["p","找一個，只有你和神的時間。"],["p","把手機放遠一點。"],["p","把那一塊，你一直沒有交出去的地方，說出來。"],["p","也許是一份恐懼，也許是一段關係，也許是一筆錢，也許是一個夢想。"],["p","不用說得漂亮。"],["p","只要說：主，我轉回來了。"],["p","也許你說完，沒有什麼感覺。"],["p","沒有關係。"],["p","轉向，不是看感覺，是看方向。"],["p","你的方向對了，他的臉，就已經在那裡了。"],["p","然後，等他。"],["p","他的臉，早就轉向你了。"],["p","讓我們禱告。"],["p","親愛的天父，謝謝你，是不改變的神。"],["p","我們常常偏離，常常走在陌生的路上。"],["p","今天，我們願意把車停下來，轉向你。"],["p","求你潔淨我們，像煉金的火，不是為了毀滅，是為了讓我們成為你所喜悅的器皿。"],["p","求你記念那些，在暗處忍耐的人，安慰他們，使他們知道，他們不是徒然。"],["p","讓我們都成為，特特歸你的子民。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"4":{"min":13,"blocks":[["h","《必有公義的日頭出現》"],["p","弟兄姊妹平安。"],["p","你有沒有看過，小牛被放出圈的那一刻？"],["p","牠在圈裡，關了一整個冬天。"],["p","門一開，牠不是慢慢走出來的。"],["p","牠是跳出來的，四隻蹄子，一起離地。"],["p","陽光落在牠身上，牠不知道要往哪裡跑，只知道，要跑。"],["p","那種跳躍，是一個被關了很久的生命，終於被放出來。"],["p","你若見過那個畫面，就知道，那不是訓練出來的動作。"],["p","那是從裡面湧出來的，一股壓不住的喜樂。"],["p","今天這一章，要給我們的，就是這個畫面。"],["p","今天，我們要來到舊約的最後一章。"],["p","它很短，只有六節。"],["p","可是它，把整個舊約，收在一個畫面裡："],["p","一個日頭，要升起來。"],["p","它不是一個，已經完成的日出，是一個，被應許的日出。"],["p","舊約走了三十九卷，經過亞當、亞伯拉罕、摩西、大衛，經過被擄和歸回。"],["p","最後，停在一個，還沒有發生的清晨前面。"],["p","瑪拉基，是在天快亮之前，最黑的那一段時間裡，說話。"],["p","我們分三個點來看。"],["p","第一，那日如爐。"],["p","第二，日頭與跳躍。"],["p","第三，記念律法，轉向父子。"],["p","先看第一點。"],["p","那日如爐。"],["q","萬軍之耶和華說：那日臨近，勢如燒著的火爐。"],["p","這一章，開頭很重。"],["p","一個燒著的火爐。"],["p","那一天，凡狂傲的，和行惡的，必如碎秸。"],["p","碎秸，就是收割以後，剩下的乾草。"],["p","一點火星，就燒盡了。"],["p","碎秸，沒有根，沒有重量，風一吹就散。"],["p","狂傲的人，看起來很大，其實是輕的。"],["p","這是神對狂傲，最準確的描寫：看起來很高，卻沒有根。"],["p","經文說："],["q","根本枝條一無存留。"],["p","這是一個很嚴肅的畫面。"],["p","我們要先停下來，誠實地面對它。"],["p","這段話，不是讓我們去指認，誰是狂傲的人，誰是惡人。"],["p","更不是，把某一個國家、某一種人，放進這個名字裡。"],["p","這不是這節經文的用法。"],["p","它把這件事，交給神。"],["p","我們的功課，不是去判別別人。"],["p","是先問：我自己裡面，有沒有狂傲？"],["p","還記得第一章嗎？"],["p","狂傲，就是離開本位，抓住權力。"],["p","想要作王，想要代替神。"],["p","那種狂傲，不一定大聲。"],["p","它可以很安靜地住在心裡：我可以自己決定，我不需要被糾正，我知道什麼對我最好。"],["p","那就是，想坐在神位置上的，一個很小的聲音。"],["p","那是每一個人，心裡都有的東西。"],["p","所以，這一個爐，是對著那份狂傲的。"],["p","它要燒掉的，是那個，想坐在神的位置上的自己。"],["p","還有一個提醒。"],["p","經文沒有給我們一個日期。"],["p","沒有一個時間表，也沒有一張地圖。"],["p","所以，我們不需要，也不應該，去算日子。"],["p","神把這一日，放在他的手裡。"],["p","有許多人，一讀到這一段，就想畫一張圖表，排一個順序。"],["p","但經文所給我們的，不是一張圖表，是一個性格：神是公義的，神要親自來。"],["p","知道這一點，就夠我們，安穩地活下去。"],["p","我們的責任，是今天，在這個日子裡，要怎樣活。"],["p","再來第二點。"],["p","日頭與跳躍。"],["p","第二節，有一個轉折："],["q","但向你們敬畏我名的人必有公義的日頭出現，其光線有醫治之能。"],["p","一個「但」字。"],["p","前面是爐，後面是日頭。"],["p","同樣是那一天。"],["p","火，與日頭，都來自同一個神。"],["p","他的聖潔，對抗一切不潔，也醫治一切敬畏他的人。"],["p","這不是兩個神，是一位神，在不同的人面前，顯出同一個本性。"],["p","對狂傲的人，是火。"],["p","對敬畏的人，是光。"],["p","是同一個太陽，同一個日子。"],["p","想想看，同樣是陽光。"],["p","落在碎秸上，會燒；落在小牛身上，卻是暖的。"],["p","差別，不在太陽，在於，你站在哪一個位置上。"],["p","你站在敬畏他名的位置上，他就是醫治。"],["p","經文說，這個日頭，有翅膀。"],["p","他的光線，有醫治之能。"],["p","原文是「翅膀」。"],["p","他像一隻鳥，展開翅膀，覆庇你。"],["p","你想想，一隻母鳥，在風雨來的時候，把小鳥攏在翅膀底下。"],["p","小鳥不必懂氣象，不必會飛，牠只需要，靠近。"],["p","這是一個很溫柔的畫面。"],["p","有人讀到這一節，會想：那我的病，是不是就一定會好？"],["p","這裡，我們要小心。"],["p","經文是在說，神要親自來，醫治他百姓最深的傷。"],["p","它不是在對一個正在病床上的人，說：你只要有信心，就一定會好。"],["p","也不是說，你若沒有好，是你不夠信。"],["p","如果你今天正在病痛裡，請你知道："],["p","你的痛，不是因為你信得不夠。"],["p","你可以哭，你可以問，你可以累。"],["p","聖經裡，有太多這樣的人，他們把痛，原原本本，帶到神面前。"],["p","你若願意，也可以這樣做。"],["p","日頭，還是要升起來的。"],["p","醫治，是他的作為，也是他的時間。"],["p","你在痛裡面，依然可以，敬畏他的名，等候他。"],["p","然後，是那一幅畫面："],["q","你們必出來跳躍如圈裡的肥犢。"],["p","這就是開頭，那隻小牛。"],["p","你關了很久了嗎？"],["p","關在一段，說不出口的關係裡。"],["p","關在一個，總是覺得自己不夠好的聲音裡。"],["p","關在一份，看不見盡頭的病痛、債務、失落裡。"],["p","經文沒有說，你要先把自己整理好，才能出來。"],["p","它說，日頭升起，你就出來。"],["p","光，是從外面來的，不是從你裡面擠出來的。"],["p","經文說，日頭要升起來。"],["p","圈門，要打開。"],["p","你要跳躍。"],["p","這不是勉強自己笑，不是假裝沒事。"],["p","是一個真實被釋放的生命，自然會有的樣子。"],["p","第三節說："],["q","你們必踐踏惡人。"],["p","這一句，不能拿來，變成我們的得勝。"],["p","不能拿來，去踩別人。"],["p","它說的，是邪惡，不再有力量，不再能轄制人。"],["p","那一天，被壓傷的人，不再被壓。"],["p","這是一個，關於公義的盼望。"],["p","公義，不是一件冷冰冰的事。"],["p","是被欺壓的人，終於被看見；是被遺忘的人，終於被記念。"],["p","不是一個，關於報復的許可。"],["p","若一個人，靠著這節經文，期待有一天踩在別人身上，他就誤會了這個日頭。"],["p","這個日頭，是公義的，也是慈愛的。"],["p","它要除去的，是壓傷人的力量，不是要把一個人，變成新的壓迫者。"],["p","接著，來到第三點。"],["p","記念律法，轉向父子。"],["p","這一卷，最後的兩個提醒，很特別。"],["p","第一個，向後看："],["q","你們當記念我僕人摩西的律法。"],["p","記念，不是背一遍。"],["p","是把神說過的話，放回生活的中心。"],["p","早上起來，先讀一段。"],["p","作決定之前，先聽他怎麼說。"],["p","與家人說話之前，先想一想，這一句話，是不是在他的律法裡面。"],["p","這樣的記念，一天一天，就把我們的心，穩住了。"],["p","在等候日頭的日子裡，我們不是空著手，在等。"],["p","我們是，守著他的話，在等。"],["p","這個等候，不是消極地坐著。"],["p","是在每一個平凡的日子裡，一天一天，守住他的話。"],["p","像守夜的人，守著燈，不讓它熄滅。"],["p","第二個，向前看："],["q","看哪，耶和華大而可畏之日未到以前，我必差遣先知以利亞到你們那裡去。"],["p","舊約的最後一句話，是一個應許。"],["p","他要差遣以利亞。"],["p","這裡，我們也要小心。"],["p","我們不要，去對照今天的某一個人。"],["p","我們只說，新約自己說了的。"],["p","馬太福音十一章，耶穌說，施洗約翰，就是那要來的以利亞。"],["p","路加福音一章，天使對撒迦利亞說，這個孩子，要有以利亞的心志、能力。"],["p","所以，新約告訴我們："],["p","神所應許的，不是落空，是已經在路上了。"],["p","預備道路的那位，來了。"],["p","他的來，是為了指向那一位，真正的日頭。"],["p","路加福音一章，撒迦利亞在讚美中說，清晨的日光，要從高天臨到我們。"],["p","這一道日光，指向耶穌。"],["p","然後，他是做什麼的？"],["q","他必使父親的心轉向兒女，兒女的心轉向父親。"],["p","這是舊約，最後一個，被寫下來的畫面。"],["p","一個心，轉向另一個心。"],["p","你想一想，一個家，最難的，不是缺錢，不是缺房子。"],["p","是兩顆心，互相背對。"],["p","父親不知道怎麼對兒女說話，兒女不知道怎麼對父親開口。"],["p","那一種沉默，比任何責備都痛。"],["p","父親，轉向兒女。"],["p","兒女，轉向父親。"],["p","你看，整卷書，從「我若是父」開始。"],["p","中間，是「我們豈不都是一位父嗎」。"],["p","最後，是父與子，心，互相轉向。"],["p","這卷書，是在說，神要把家，修好。"],["p","這裡有一個提醒。"],["p","有些人的父親，或母親，曾經傷害過他。"],["p","這一節，不是要求你，去和一個，仍然在傷害你的人，和好。"],["p","你的安全，永遠重要。"],["p","這一節，是在說，神的心意，是修復。"],["p","那份修復，在神的時間，用神的方式，一步一步，來到我們中間。"],["p","有時候，是一次和解。"],["p","有時候，是一份，自己不再重複傷害的決定。"],["p","有時候，是在神裡面，終於放下的一個擔子。"],["p","神沒有要求我們，一步到位。"],["p","他只是說：我要轉向。"],["p","轉向，是一個動作的開始，不是一個完成的結果。"],["p","最後一句話，是："],["q","免得我來咒詛遍地。"],["p","舊約，以這樣一句，沉重的話結束。"],["p","可是你要記得，這句話的前面，有一整個，溫柔的應許：日頭、翅膀、醫治、跳躍，還有父與子的心。"],["p","咒詛，是被這麼多的恩典，圍在中間。"],["p","然後，它停在那裡。"],["p","像一個，長長的夜。"],["p","可是，你要知道：夜，是在等天亮。"],["p","沒有一個夜晚，是永遠的。"],["p","這一章的結尾，是一個沉重的句點，可是，它同時，是一個正在等待的逗號。"],["p","好像在說：我們還在等。"],["p","我們等的，是那個日頭。"],["p","新約，開卷第一句話，是什麼？"],["p","是一份族譜。"],["p","是一個孩子，在伯利恆，出生了。"],["p","那個日頭，來了。"],["p","讓我們把這一章，帶回家。"],["p","這一章，把整卷書，收在一個盼望裡。"],["p","有己的人，等候，是焦慮的：我什麼時候，才能好起來？"],["p","無己的人，等候，是安靜的：他是王，他的日頭，必要升起。"],["p","讓耶穌作王，讓耶穌得著一切的榮耀。"],["p","因為整卷書，從頭到尾，都是在說同一件事：他是王，他是父，他是日頭。"],["p","我們的位置，是敬畏他名的人，是被他醫治的人，是從圈裡跳出來的人。"],["p","我們的焦點，不在日期，不在別人，不在自己的病，也不在環境。"],["p","是在那位，要升起來的日頭，身上。"],["p","先帶回三個問題。"],["p","第一，我現在，是在火裡，還是在日頭下？我站在哪裡？"],["p","第二，我的心裡，有沒有一個，等著被放出來的小牛？"],["p","第三，我的家裡，有沒有一個，我可以先邁出一步的心？"],["p","不要急著回答，先安靜。"],["p","這一週，只做一件事。"],["p","在一個早晨，早一點起來。"],["p","找一個，看得見天空的地方。"],["p","看著天，一點一點亮起來。"],["p","在心裡對他說：我在等你。"],["p","也把那一個，你關了很久的地方，帶到光裡。"],["p","不用急，天，總是會亮的。"],["p","你只要，每天早上，再試一次，把臉轉向光。"],["p","早晨的光，不需要我們用力，它只需要我們，轉過臉去，迎著它。"],["p","也許今天，你還在夜裡，那就在夜裡，誠實地等。"],["p","神不嫌棄，一個在黑暗裡仍然守著他名的人。"],["p","讓我們禱告。"],["p","親愛的天父，謝謝你，是信實的神。"],["p","我們還在等候，但我們知道，日頭必要升起。"],["p","求你潔淨我們裡面的狂傲，醫治我們一切的傷。"],["p","求你保護，那些正在痛裡的人，使他們不被孤單。"],["p","也求你，修復我們的家，把我們的心，一步一步，轉向彼此。"],["p","願你的名，被尊為大。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"lesson":{"1":{"no":1,"vol":"《321瑪拉基書講義》第1課·瑪拉基書第1章","title":"你在何事上愛我們呢——問、藐、名","blocks":[["h","一、一句最容易被回嘴的話：我曾愛你們"],["p","弟兄姊妹平安。有一種場面，很多人都經歷過。對方認真地對你說：「我愛你。」你點點頭，心裡卻浮起一句不敢說出口的話：你哪裡愛我了？這句藏在心底的話，兩千多年前，有一群人把它大聲說出來了，而且是在神的殿裡說的。"],["p","舊約的最後一卷書，開頭只有一行：「耶和華藉瑪拉基傳給以色列的默示。」（瑪1:1）「默示」這個字，字面的意思是「扛起來的東西」，也就是一副重擔。「瑪拉基」是人名，也可以解作「我的使者」。這群人從被擄之地回來了，殿重建了，壇上也有火了，可是日子並沒有像他們盼望的那樣興旺。盼望落了空，心就慢慢冷下去。"],["p","神開口的第一句話，不是責備，也不是命令：「我曾愛你們。」（瑪1:2）全書的第一個動詞，主詞是神，內容是愛。在人還沒有開口訴苦之前，神已經先把這句話放在桌上。"],["p","人的回答，是一句有禮貌的反問：「你在何事上愛我們呢？」（瑪1:2）這不是無神論者的挑戰，是站在神殿裡、手裡帶著祭物的人，一邊獻祭一邊問出來的。往下讀，你會發現這種「你們卻說」的句式一再出現，每一次都是一句問得很客氣的失望。問的人未必不信神，只是累積了太多沒有被回答的日子。"],["p","神的回答很特別，祂沒有列出一串恩典清單，也沒有立刻改變他們的處境，祂翻開了一頁歷史：「以掃不是雅各的哥哥嗎？我卻愛雅各，惡以掃。」（瑪1:2–3）兩個孿生兄弟，按規矩哥哥承受長子的名分，神卻揀選了弟弟。這份愛不是因為雅各配得，是神自己的決定。這裡的「愛」與「惡」，是古時比較的語言：愛得多與選擇不選的對照，不是說神對以掃咬牙切齒。"],["d",["「我愛雅各，惡以掃」的「惡」，是神真的恨以掃嗎？","這句話最容易引起誤會。第一，聖經裡「愛」與「恨」常是比較的語言，意思是「揀選誰、不揀選誰」，並不都是情緒的恨；創世記29:30–31 說雅各愛拉結，「不愛」利亞，下文又說利亞是「失寵」的，可見這是偏愛與否的比較。第二，這裡談的是兩個後代的民族在歷史中的位置，不是談某一個人得不得救。第三，神選雅各，是出自祂的恩典，不是雅各比較好；雅各自己的故事充滿了詭詐。所以這句話的重點是：神的愛，從來不是靠我們的表現換來的。"]],["p","接著是以東的反應：「我們現在雖被毀壞，卻要重建荒廢之處。」神的回答是：「任他們建造，我必拆毀。」（瑪1:4）人說我們要重建，神說我要拆毀，一邊是人的努力，一邊是神的主權。這幾節話是對當時那個以東說的，不是給我們拿來斷定今天哪一個國家、哪一個民族被神厭棄的。神借鄰居的歷史，只是要讓回嘴的人看見：你們是被揀選的，你們被帶回來了，這就是愛的證據。"],["d",["1:2–5 對以東說的話，可以用來斷定今天某個民族被神厭棄嗎？","不可以。這段話的受話人是當時的以色列百姓，神是借著以東的歷史，向他們說明祂為甚麼愛他們。經文裡的以東，是一個具體的歷史民族，與今天任何一個國家或族群沒有一對一的對應。把這幾節話拿來指著某個民族說「你們被神恨惡」，是把一段向自己人說的安慰，變成向外人丟出去的石頭。我們只要記得：神責備別人的時候，常常是為了讓祂自己的百姓看見祂的愛。"]],["p","第五節是這一小段的出口：「願耶和華在以色列境界之外被尊為大！」（瑪1:5）注意，愛的目的不是讓人只感覺舒服，而是讓神的名被看見、被尊大。從這裡開始，全章只有一條線：祂先愛了，名就要被尊為大。人的回應是甚麼？下面兩節就要看到。"],["h","二、父與主：尊敬我的在哪裡"],["p","話鋒一轉，神的責備是從關係開口的：「我既為父親，尊敬我的在哪裡呢？我既為主人，敬畏我的在哪裡呢？」（瑪1:6）神沒有先翻出律法條文，祂先說：我是父，我是主。父親要的是尊榮，主人要的是敬畏。一個是疼愛的關係，一個是順服的關係，神兩樣都在。"],["p","這句話是對誰說的？「藐視我名的祭司啊」（瑪1:6）。帶領敬拜的人，先被點名。這是對那個時代祭司的話，不是拿來批評今日任何一位牧者的鞭子。我們在台下聽的時候，最好先把這句話放在自己的桌上：每一位帶領別人的人，包括家裡的父母、小組的組長，都先要聽見。"],["p","祭司的回答是：「我們在何事上藐視你的名呢？」（瑪1:6）這是第二個「在何事上」。他們不是裝傻，是真的不覺得。藐視最可怕的地方，就是沒有人覺得自己在藐視。它不是造反，也不是大聲叫罵，它是一種習慣：敷衍久了，就以為這是正常的樣子。"],["p","神指出了事證：「你們將污穢的食物獻在我的壇上」，並且指出行為背後的那句話：「因你們說，耶和華的桌子是可藐視的。」（瑪1:7）手上做出來的，是心裡先說過的。他們對神的桌子，抱著「差不多就好」的看法，這個看法先在心裡成形，才在祭物上顯出來。"],["p","把這幅畫搬到今天。我們請貴客來家裡吃飯，會把最好的菜端出來；可是對神，我們常常把最清醒的時段給了手機與工作，最後剩下的一點力氣，才用來禱告。不是故意的，只是不知不覺，神的桌子被排到了最後。"],["d",["瑪拉基責備的「祭司」，今天可以直接對號入座牧者嗎？","最好不要。當時的祭司負責在壇前獻祭、教導百姓，責任特別重，所以責備也特別直接，後面第二章還要繼續。可是這不表示今天每一位牧者都在「藐視神的名」。比較穩當的讀法有兩層：第一，每一位帶領者，包括我們自己，都要先讓這段話審察自己；第二，神的子民都被稱為祭司（彼前2:9），所以這段話的核心問題，是每一個敬拜者的問題，不是只留給台上的人。拿它來攻擊某一個人，往往是把鏡子當成了石頭。"]],["h","三、獻給省長試試：名被尊為大"],["p","第八節的畫面，很具體：「你們將瞎眼的獻為祭物，這不為惡嗎？將瘸腿的、有病的獻上，這不為惡嗎？」（瑪1:8）律法早已明說，有殘疾的牲畜不可獻上（利22:22；申15:21）。他們不是不懂，是明知道，卻把最不要緊的拿來給神。"],["p","然後神問了一句非常日常的話：「你獻給你的省長，他豈喜悅你，豈能看你的情面嗎？」（瑪1:8）省長，是當時的地方官，哈該書也用同一個字稱呼所羅巴伯。神的反問是：同樣的東西，你敢送給省長嗎？對有權柄的人，我們不敢隨便；對創造天地的神，我們卻敢。這句話測驗的不是錢的多少，而是神在我們心裡的位置。"],["p","這裡要特別小心：神要的「好」，不等於「貴」，更不等於「多」。耶穌看見窮寡婦投進去的兩個小銅錢，說她投的比眾人都多，因為那是她的全部。第八節指向的是「敷衍」，不是「窮」；是心裡把神排在省長後面，不是荷包比別人淺。任何拿這段話逼人多奉獻、多出錢的說法，都已經偏離了經文。"],["d",["1:8 要獻最好的，是不是說奉獻一定要多、要貴？","不是。經文責備的是「明明有好的，卻把瞎眼、瘸腿、有病的拿來獻」，重點在「用壞的來敷衍」，不在金額的高低。神要的是一個誠實、有分量的回應：你把祂當作配得的那一位。一個人收入很少，卻認真預備、歡喜獻上，那份獻上是蒙悅納的；一個人收入很高，卻隨手丟一點零錢，那才是第八節要提醒的。若有人拿這節經文向人施壓，說「你獻得不夠就是不敬畏神」，那是用錯了經文。"]],["p","第十節是全章最驚人的一句：「甚願你們中間有一人關上殿門，免得你們徒然在我壇上燒火。」（瑪1:10）神寧願殿門關上，也不要被敷衍的火。「徒然」這個字，原文有「白白地」的意思：燒了火，卻沒有被接納，一切都白費。神要的不是活動，是一顆真的回應祂的心。"],["p","可是歷史不是由他們的冷淡來決定的。第十一節忽然把視野拉到全世界：「從日出之地到日落之處，我的名在外邦中必尊為大。」（瑪1:11）神的名，不靠一座殿撐著，也不被一個民族的失敗困住。要澄清的是，這一節不是說各種宗教拜的都是同一位神，它說的是神的名要被尊大這件事，必定成就，遠遠超過以色列的圍牆。"],["d",["1:11 說外邦人到處獻潔淨的供物，是不是說所有宗教拜的都是同一位神？","不是。這一節的主詞是「我的名」，也就是耶和華的名，要在列國中被尊為大。它是一個神將要成就的應許，描述神的名終要被各族各國的人認識、敬拜，並不是在稱讚外邦人現有的宗教。把它讀成「各教都是一樣的」，是把經文的主詞從神換成了人。更穩妥的讀法是：連外邦人最終都要尊崇祂，以色列人怎麼可以把祂的桌子當成可藐視的呢？這是用外邦的未來，來提醒自己人的現在。"]],["p","第十二、十三節回到眼前：「你們又說：『這些事何等煩瑣！』並嗤之以鼻。」（瑪1:13）嗤之以鼻，原文像是不屑地吹了一口氣。敬拜變成了負擔，事奉成了應付，連獻上的東西都是「搶奪的、瘸腿的、有病的」。當敬拜成了一件「煩」的事，通常是因為我們忘記了對面坐的是誰。"],["p","全章最後一節，把答案放了出來：「因為我是大君王，我的名在外邦中是可畏的。」（瑪1:14）許願卻拿有殘疾的獻上，是許了願又賴帳。問題的答案，不是更努力、更賣力，而是看見：那位愛我們的，就是大君王。愛我的那一位，同時是值得我放下最好的那一位。"],["h","四、原文亮光：אָהַבְתִּי、כָּבוֹד 與 גָּדוֹל"],["p","第一個字是 אָהַבְתִּי（’ahavti，H157，我曾愛）。這個動詞用的是希伯來文的完成式：一件事已經做成，而它的結果持續到現在。所以神說的不只是「我以前愛過你們」，而是「我已經愛了，這愛還在」。全書的第一個動詞，是神的，不是人的。愛是神先做完的事，不是等我們表現好了才開始的事。"],["p","落到生活裡，當我們感覺不到愛的時候，神的愛並沒有「剛好停了」。感覺會起伏，完成式的愛卻立在那裡。以掃與雅各的故事是這群人的證據；對我們來說，最大的證據是十字架：愛已經被做成了。我們每次疑惑「祢在何事上愛我」，都可以回頭看一件已經完成的事。"],["p","第二個字是 כָּבוֹד（kavod，H3519，榮耀、尊榮）。這個字的字根是「重」。榮耀，字面就是「有重量」。第六節神問：「尊敬我的在哪裡呢？」換一個說法就是：你把我放得多重？天平的兩邊，一邊放著神，一邊放著你的忙碌、你的手機、你的面子，哪一邊比較重？"],["p","一個人的時間、精神、第一個念頭放在哪裡，那裡就是他心裡有重量的地方。這個重量，是我們的行事曆與習慣在說的。所以「尊敬」不是一種情緒，是一個選擇：把最清醒的、最好的那一份，放在神的那一邊。"],["p","第三個字是 גָּדוֹל（gadol，H1419，大）。這個字在這一章出現好幾次，第五節、第十一節兩次、第十四節的「大君王」。請注意第五節與第十一節是被動的：「被尊為大」，意思不是人把神變大，神本來就大，人是讓祂的大被看見、被承認。"],["p","敬拜的目的，不是讓我們的需要變大，是讓祂的名變大。當我們的問題大到遮住了天，神就顯得小；當我們把焦點移到祂的大，問題才回到它原來的大小。回嘴的人，是眼睛只看到自己的處境；回到敬畏的人，是重新看見大君王。"],["d",["אָהַבְתִּי 是完成式，那我感覺不到愛的時候，是神的愛不見了嗎？","不是。完成式講的是「已經做成」的事，感覺卻是會起伏的東西。人在疲乏、受傷、禱告沒有回應的時候，感覺不到愛是很真實的，這並不表示愛已經收回。可以做兩件事：第一，回頭數算那些已經做成、不會因心情改變的事，例如神揀選你、基督為你捨命；第二，把「我感覺不到」原樣告訴神，這本身就是瑪拉基書那句「你在何事上愛我們呢」的誠實版本，神並沒有因此轉身離開。感覺不到愛，需要被陪伴；它不是需要被定罪的事。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「我愛雅各，惡以掃」當成神對某一個人、某一個民族的最後判詞，用它來斷定哪一個國家被神厭棄。這是把一段向自己人說的話，變成向外人丟出去的石頭。"],["p","第二個偏差，是把對祭司的責備當成鞭子，專門用來打今天的牧者，或者站在台下為責備喝采，自己不用被審察。這段話先是對自己說的，然後才輪到別人。"],["p","第三個偏差，是把「獻最好的」讀成對奉獻金額的壓力，好像獻得少、獻得不夠貴，神就不喜悅你。經文責備的是敷衍，不是貧窮；任何拿它逼人出錢的講法，都不是這段經文的意思。"],["p","第四個偏差，是把 1:11 讀成「各種宗教拜的都是同一位神」。這一節說的是耶和華的名要被尊為大，主詞是神，不是人的各種信仰。"],["p","第五個偏差，是把「你在何事上愛我們呢？」這句問話本身當成罪，不准人問。神沒有責備這句問話，祂開口回答了。人帶著疑惑來到神面前，神不會把門關上；真正的問題，是問了之後只停在抱怨，不肯回頭看祂已經做成的事。"],["d",["「問神為甚麼」與「回嘴」，差別在哪裡？","差別在於問的時候，心朝向哪裡。回嘴的人是把問題當成結論：我已經判定祢沒有愛我，只差祢承認。誠實發問的人是把問題當成禱告：我不明白，求祢讓我看見。詩篇裡有許多「要到幾時」的哀歌，神並沒有責備這樣的問。瑪拉基書的百姓，問完之後沒有留下來聽答案，反而繼續敷衍。判斷的標準很簡單：問了之後，你還肯留在祂面前聽嗎？肯留下來聽，就是在發問；轉身走開，才是在回嘴。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題，是「愛說不出口，只靠表現去換」。華人家庭很少把「我愛你」掛在嘴上，愛都放在飯菜與行動裡，於是我們也習慣靠表現去換接納：做得好才被看見，做得夠才算數。這樣的習慣帶到神面前，就變成「我先做好了，神才會愛我」。可是這一章的次序正好倒過來：神先說「我曾愛你們」，人的獻上才是回應。先被愛，才有力量去獻上最好的。"],["p","第二個問題，是「心意到了就好」。這句話本來是體諒，卻常常變成敷衍的藉口：神知道我的心，不用計較形式；禮多人不怪，對人要周到，對神反正祂明白。可是第八節的省長，把這個邏輯拆穿了：我們對人的周到，不敢省；對神的敷衍，卻省得理所當然。心意不到的時候，再多的形式也只是在白燒火；真有心意的時候，連最小的獻上也是用盡力氣預備的。"],["h","七、活出321——愛在先，名為大"],["p","三個基礎：耶穌是我的榜樣，聖經是我的準則，聖靈是我的引導。耶穌把最好的完全獻給父神，連祂自己都沒有保留，是我們看見「獻上最好」最真實的樣子。聖經是我的準則，我們不用自己的感覺，用省長那個標準去量自己的敬拜。聖靈是我的引導，祂來照亮那句「我們在何事上藐視你的名」，讓我們看見自己看不見的敷衍。"],["p","兩個核心：讓耶穌作王，讓耶穌得著一切的榮耀。這一章的盡頭，神自己用了一個稱呼：「大君王」。讓耶穌作王，就是承認那張桌子是祂的，不是我們隨意擺放的地方；讓耶穌得著一切的榮耀，就是讓祂的名被尊為大，不是我們的名、不是我們的需要，也不是我們的成果。"],["p","一個目的：建立屬神的體系。屬神的體系，次序是先生命，再關係，後事工。先有生命：看見神已經先愛我。再有關係：與神、與自己、與人、與事，由內而外。最後才是事工。第十三節的「何等煩瑣」，往往是次序倒了：事奉先於關係，做事先於被愛，於是服事成了重擔。次序對了，事奉就從愛裡流出來。"],["p","驕傲，是離開本位，抓住權力。這一章的回嘴，就是人坐上了評審席，評量神的愛夠不夠；藐視，就是把神放低、把自己放高。謙卑，是回到本位，讓人作人，讓神作神。無己，不是沒有自己，是不再坐在審判神的位子上，是基督在我裡面活。無己，才聽得見那一句「我曾愛你們」。"],["h","八、四種心，面對「你在何事上愛我們呢」"],["p","驕傲型：我坐在評審席上，認定神虧欠了我，覺得自己服事、奉獻都做了，神卻沒有給我該得的。第一章要我先停下來，從評審席走下來，承認我的問題很可能不是神不愛，而是我把自己的位子坐得太高。"],["p","恐懼型：我讀到「關上殿門」就害怕，怕自己獻得不夠好，神就不喜悅我，怕下一個被關在門外的是我。請你知道，這一節不是對一個盡力卻軟弱的人說的，它是對明知故犯、拿壞的來敷衍神的人說的。你的害怕，可以放在愛先臨到的那一句話裡。"],["p","羞恥型：我覺得自己就是那隻瞎眼瘸腿的祭物，不配被神收納。第八節說祭物不可以有殘疾，可是新約告訴我們，我們得蒙悅納，不是因為我們沒有殘疾，而是因為耶穌這位無瑕疵的羔羊替我們獻上了。你不需要把自己修好之後才來，你可以帶著殘疾來到祂面前。"],["p","受傷型：我真的在受苦，所以我問：你在何事上愛我？請你知道，神沒有責備這個問題，祂回答了。祂不要求你先把疼痛壓下去，才可以說話。你可以把這句問話原樣放在祂面前，不用修飾，也不用擔心被推開。先被聽見，再慢慢被帶回那件已經完成的愛。"],["d",["若敬拜時真的覺得疲乏煩瑣，是不是代表我已經像 1:13 那些人？","不一定。第十三節的人是「說：這些事何等煩瑣，並嗤之以鼻」，是把神的桌子吹開，同時拿壞的東西去獻上。一個人因為工作、照顧家人、生病而真的疲乏，仍然願意來到神面前，這和「不屑」是兩回事。可以自問三件事：我是疲乏，還是不屑？我是來不及預備，還是根本不想預備？我願不願意把這份疲乏誠實說給神聽？疲乏的人可以來；真正需要警覺的，是把神的桌子看輕、帶著敷衍來的那顆心。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，把「你在何事上愛我們呢？」誠實地對神說出口，然後寫下三件過去神已經為你做成的事，具體到人名、時間、地點。"],["p","第二，找出你給神的「剩下的時間」，本週把其中十分鐘，換成每天最清醒的一段。寫下是幾點，在哪裡，用甚麼提醒自己。"],["p","第三，挑一件你覺得「煩瑣」的事奉或敬拜，寫下來，在旁邊問神：這是次序倒了嗎？是我忘記了對面坐的是誰嗎？只問，先不急著結論。"],["p","第四，本週當面對一位你愛的人說一次「我愛你」，並且為他做一件具體的事。愛不只放在行動裡，也要說出口。"],["p","第五，為一位正在問「神在哪裡愛我」的朋友禱告，約他喝一杯茶。不講道理，不急著回答，先聽，把他的問話當作一句可以被收下的話。"],["p","我宣告：神已經先愛了我，這份愛是完成式，不靠我今天的表現。"],["p","我宣告：我不再坐在評審席上評量神的愛，我回到我的本位。"],["p","我宣告：我把最好的、最清醒的那一份，放在神的桌子上。"],["p","我宣告：耶穌是大君王，祂的名在我的生活裡被尊為大。"],["h","十、結語"],["p","我們回到開頭那句話：你哪裡愛我？這句問話，神沒有迴避。祂翻開一頁歷史，指著雅各與以掃，說：我曾愛你們。這句話後來有了更清楚的證據：愛不只是一句話，是一個十字架，是那位大君王親自走進我們的軟弱。"],["p","神的愛，是完成式的，已經發生的，仍在持續的。我們的回應不是去證明自己值得，而是回到祂的桌子前，把最好的放上去。不是因為怕，是因為被愛。不是因為被逼，是因為祂配得。"],["p","讓我們帶著這個焦點離開。焦點在耶穌，不在自己，不在別人，不在環境。不在我有沒有做夠，不在別人怎麼待我，不在處境順不順利。焦點在那位先愛我們、又是大君王的耶穌。祂的名，要在我們的家中、教會裡、職場上，被尊為大。"],["p","親愛的天父，謝謝祢先愛了我們，謝謝祢沒有因為我們的疑問就把門關上。求祢光照，讓我們看見自己的敷衍；求祢更新，讓我們願意把最好的獻上。願祢的名在我們身上被尊為大，願我們因為被愛而尊祢為王。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","以下三個化請照次序帶。這一課碰到「被愛的感覺」與「受苦中的疑問」，誠實比漂亮重要，也請保守彼此聽到的分享。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★＝時間充裕再討論。【必做】不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：從「你哪裡愛我」進入第一章。；承認自己也有過回嘴的時候。；看見神已經先愛了。"],["n","1. ★★★ 有沒有哪一次，別人對你說「我愛你」，你心裡卻想「你哪裡愛我」？你當時為甚麼這樣想？"],["n","2. ★ 神的第一句話是「我曾愛你們」。你最近一次覺得神愛你，是甚麼時候？說一件具體的事。"],["n","3. 「尊敬我的在哪裡」這句話，你覺得自己哪一方面最容易敷衍？"],["m","帶領提醒：第1題：說一句話即可；有人提到家庭或關係的傷，不追問細節，會後單獨關心。 第2題：說具體的一件事。 第3題：說感受即可，不逼問。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：看見自己的位置。；聽見神說「我曾愛你們」。；想通誰是大君王。；說出心裡的問號。；把決定化為行動。"],["t","【看】看見自己"],["n","4. ★ 這一章裡，你比較像誰？回嘴的百姓、帶頭的祭司、旁觀的外邦人，還是那個問「何以見得」的人？說出理由。"],["t","【聽】聽神說話"],["n","5. 默讀瑪1:2，把「你們」換成你的名字再讀一次。你聽見神說甚麼？"],["t","【想】想通關卡"],["n","6. ★★★ 第八節的省長測驗：你的敬拜、時間、家人，哪一件如果拿去給省長，你不敢這樣做？卡在哪裡？"],["t","【講】說出口"],["n","7. 兩人一組，說出你心裡最常有的一句「你在何事上……呢？」，聆聽者只回應：「神說，我曾愛你。」"],["t","【行】走一步"],["n","8. ★ 本週你要把哪一段最好的時間交給神？寫下哪一天、幾點、在哪裡。"],["m","帶領提醒：第4題：若有人說自己像那位問「何以見得」的人，不追問，不要求立刻有答案，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。 第7題：只要求說出，不需要解釋。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：操練 920。；把「我曾愛你們」帶給身邊的人。；讓敬拜從負擔變回回應。"],["n","9. ★★★ 920 的操練：找出你的那一個「2」，身邊誰正在問「神哪裡愛我」？當場說出他的名字，以及本週哪一天向他分享瑪1:2。"],["n","10. 你最近覺得「煩瑣」的一件事奉或敬拜是甚麼？本週哪一天，用甚麼方式把它交回給神？"],["n","11. ★ 若朋友說「神根本不愛我」，你會怎樣用這一章回應？寫下兩句，不說教。"],["n","12. 你的小組容得下一句「我現在真的感覺不到愛」嗎？你可以做哪一件事？"],["n","13. 本週每天問一次「主啊，我今天把祢放在多重的位置」，與一位組員配對提醒。"],["n","14. 【必做】繁殖任務：請用三句話，把這一課講給一位教會外的朋友聽：神已經先愛了；敷衍的敬拜神寧可不要；愛我的那位，就是大君王。"],["m","帶領提醒：第9題：說名字，不公開對方處境。 第10題：說具體的一件事即可。 第12題：若有人說感覺不到愛，不追問，不要求立刻有信心，不用「你要有信心就會好」回應，會後單獨關心。"],["s","收尾（5分鐘）"],["p","請大家安靜，把心裡那句「你哪裡愛我」輕輕放在神面前。祂沒有因為這句話把門關上。讓我們一起為彼此禱告，求主讓我們因為被愛而尊祂為大。"]],"chars":5670,"min":60,"deep":8,"dchars":1447,"tchars":495},"2":{"no":2,"vol":"《321瑪拉基書講義》第2課·瑪拉基書第2章","title":"我們豈不都是一位父嗎——約、淚、謹","blocks":[["h","一、說出口的話，放進心裡了嗎：祭司與利未的約"],["p","弟兄姊妹平安。二十年前，在眾人面前說的那一句「我願意」、那一句「我答應」，後來放在哪裡了？有人把它收在抽屜裡，有人把它刻在日常的每一件小事上，也有人，是在某一天才發現：這句話早就沒有人記得了。第二章談的，正是說出口的話，和放在心裡的約，中間隔著多遠。"],["p","這一章一開頭，先對著一群人說話：「眾祭司啊，這誡命是傳給你們的。」（瑪2:1）第一章裡神責備他們藐視祂的名，這裡進一步說明：如果不聽從，不把這話放在心上，福分就會變成咒詛。「放在心上」這個動詞，是把一樣東西放置、擺好；不放在心上，就是沒有當一回事。"],["d",["「把犧牲的糞抹在你們的臉上」是甚麼意思，神為甚麼用這麼粗重的畫面？","這個畫面來自祭牲的處理：祭牲的肉與脂油獻在壇上，糞便則要拿到營外燒掉（利4:11–12）。神說要把糞抹在祭司的臉上，是把本來要被丟到營外的污穢，放回到敷衍者自己的臉前。這是很重的話，它的重量來自前面的事實：祭司明知道律法，卻拿壞的獻上，又教導人跌倒。神用這樣令人反感的畫面，不是為了羞辱人，而是要讓聽的人看見：被敷衍的祭，對神來說就是穢物。這是對那個時代的警告，不是對今天某個人的羞辱。"]],["p","神接著回頭看利未的約：「我曾與他立生命和平安的約。」（瑪2:5）約的內容是兩樣東西：生命，與平安。平安的意思不只是沒有衝突，是完整。祭司的職分，從來不是靠神的位置來掌權，是擁有一個被託付的約。然後神描繪了一幅理想的祭司：「真實的律法在他口中，他嘴裡沒有不義的話。」（瑪2:6）"],["p","祭司的工作，用一句話來說就是「使多人回頭離開罪孽」（瑪2:6）。他的口，是指路的口；他的教導，是把人帶回來，不是把人送走。第七節說：「祭司的嘴裡當存知識」，因為他是神的使者。可是現實是：「你們卻偏離正道，使許多人在律法上跌倒。」（瑪2:8）「回頭」與「跌倒」，是一個職分的兩個相反的結果。"],["p","結果是，神說：「所以我使你們被眾人藐視，看為下賤。」（瑪2:9）你藐視神的名，你自己就會被人藐視。注意這個因果：不是神先羞辱他們，是他們先輕看了神，後果才回到自己身上。這一段話，是對當時承擔教導責任的人說的，不是拿來責備今天任何一位牧者的鞭子。凡有影響別人的口，包括父母、組長、同事，都要先聽見：我的話，是在使人回頭，還是使人跌倒？"],["d",["利未的約與今天的牧者、信徒有甚麼關係？","利未的約，是神與那個時代專職祭司之族所立的約，內容是生命、平安，換來他們的敬畏與真實的教導。新約說，所有信靠基督的人都是「君尊的祭司」（彼前2:9），意思是每一位信徒都有向神獻上、向人見證的責任。所以這一段話對今天的啟示，不是專門留給牧者，而是留給每一位口中有話可以影響別人的人。我們要問的是：我口中的話，是使人更接近神，還是使人在信仰上受傷、跌倒？不必把它當成對牧者的審判，更適合當成每一位帶領者的自我檢查。"]],["h","二、一位父、一位神：從祭司到每一個人"],["p","第十節是全章的轉折。眼光從祭司擴大到每一個人：「我們豈不都是一位父嗎？豈不是一位神所造的嗎？」（瑪2:10）接下來的質問是：「我們各人怎麼以詭詐待弟兄，背棄了神與我們列祖所立的約呢？」（瑪2:10）這句話有一個很有意思的結構：先講合一的根基，再講破壞的行為。因為同有一位父，所以不可詭詐；因為同被一位神造，所以不可彼此背棄。"],["p","「詭詐」這個字，在 2:10 到 2:16 出現了五次，是這一段的主詞。它的意思是背信、拆毀約定，比說謊更深：說謊是說錯一句話，詭詐是破壞一個關係裡的信任。對神的約不守，對弟兄的承諾不算，對配偶的誓言不顧，在原文裡是同一個動詞。"],["p","第十一節把詭詐推到最具體的一件事上：「猶大人行事詭詐，並且在以色列和耶路撒冷中行一件可憎的事」，也就是「娶事奉外邦神的女子為妻」（瑪2:11）。請注意，經文的重點是「事奉外邦神」：是把自己的家，帶進一個離開耶和華的敬拜；問題在拜的是誰，不是血統，也不是國籍。把它當成禁止跨族群婚姻的條文，是讀偏了。"],["p","第十二節宣告：行這事的人，即使仍然帶著供物來到神面前，也要從雅各的帳棚中被剪除。「剪除」這個動詞，與「切約」是同一個字：他們先切斷了約，約也就切斷了他們。敬拜的外表，遮不住約的破碎。"],["d",["2:11 可以用來反對今天跨族群、跨國的婚姻嗎？","不可以。聖經一再接納外族人加入神的約，路得是摩押女子，卻進入了彌賽亞的家譜。2:11 所責備的，是以色列人離開耶和華，與事奉別神的人結合，並因此跟著離棄約。重點是信仰的方向，不是民族的界線。今天若要談信仰不同的婚姻，是另一個要認真討論的牧養問題，需要有人陪伴、有智慧、有耐心，而不是簡單地引用 2:11 對某一對夫妻下判斷。這一節不該被用作民族優越的理由。"]],["d",["2:10 的「一位父」指的是神，還是祖先雅各？","各家的看法並不一致。有人認為「一位父」是指神，因為下一句是「一位神所造」，而且全書一開頭神就自稱為父（瑪1:6）。也有人認為是指以色列的共同祖先，如亞伯拉罕或雅各，因為接著講「我們列祖」。兩種讀法都不影響這一節的主旨：我們是同一個家的人，所以不可以彼此詭詐。對我們今天的讀者，最安全、也最符合新約整體見證的讀法，是承認神是我們共同的父，教會裡的弟兄姊妹因此是同一家人。"]],["h","三、前妻的眼淚與「謹守你們的心」"],["p","接著是整卷書裡最令人心疼的畫面：「你們又行了一件這樣的事，使前妻嘆息哭泣的眼淚遮蓋耶和華的壇。」（瑪2:13）壇上本來應該是祭物，現在被眼淚蓋住了。一個被拋棄的人的哭聲，神聽見了，而且神說：因為這樣，祂不再看顧那些供物。神把一個人的眼淚，放在比敬拜儀式還重的位置。"],["p","他們還說：「這是為什麼呢？」神的回答是：「因耶和華在你和你幼年所娶的妻中間作見證。她雖是你的配偶，又是你盟約的妻，你卻以詭詐待她。」（瑪2:14）婚姻不是兩個人之間的契約，它是在神面前立的約，神自己是見證人。「盟約的妻」這幾個字，說明了婚姻是約，不是合同：它不會因為不方便就被取消。"],["p","神為甚麼這樣在乎一個人的眼淚？因為被拋棄的人，往往是沒有說話位置的人：她沒有祭司的職分，沒有發言的場合，神卻讓她的哭聲蓋過整座壇。這是整卷書最安靜，也最有力的一個畫面：在神面前，沒有聲音的人，不是沒有被聽見的人。"],["p","第十五節很難讀，各家看法不同，我們留在「想更深」。但是這節話的結論很清楚：「所以當謹守你們的心，誰也不可以詭詐待幼年所娶的妻。」（瑪2:15）請注意，命令的重點不是「不准離婚」四個字，而是「謹守你們的心」。詭詐是從心裡先開始鬆動的：先是心裡的比較，心裡的不滿，心裡的藉口，然後才是行動。守約，要從守心開始。"],["p","第十六節是全章最容易被用錯的一節：「休妻的事和以強暴待妻的人都是我所恨惡的！所以當謹守你們的心，不可行詭詐。」（瑪2:16）這節的原文很難，不同的譯本翻譯並不一樣。但有兩點是穩的：第一，神恨惡的是詭詐，與強暴；第二，這句話是對握有權力、主動丟下別人的那一方說的，不是對被休、被離棄、被傷害的人說的。"],["d",["2:16 到底在說甚麼？離過婚的人怎麼辦？","這一節的希伯來文確實難讀，譯本大致有兩種：一種是「神恨惡休妻」，像和合本；另一種是「那恨惡妻子而休她的人」，意思是出於厭惡而離棄。無論採哪一種，上下文都清楚指向：丈夫以詭詐、強暴對待妻子，是神所恨惡的。這一節不是對所有經歷離婚的人定罪，更不是對受害一方說「你應該忍耐」。對於離過婚、被離棄或在傷害中離開的人，神看見眼淚，祂是向受害者站在一起的神。需要處理的實際個案，請找牧者、輔導者一對一談。"]],["d",["2:15「他不是單造一人嗎」是甚麼意思？","這節是整章最難的一節，原文詞句簡短，各家解法並不一致。一種看法是，神創造的是一男一女成為一體，神本來有餘力造更多對，卻只造一對，目的是要有「虔誠的後裔」。另一種看法是，「一」指亞伯拉罕或夫妻合一的位置。第三種是把它看作對「神在婚姻裡有份」的說明。我們不必押注某一種，只要抓住上下文清楚的訊息：婚姻是神所看顧的約，目的是栽培敬虔的下一代，所以要謹守心，不可詭詐。"]],["p","這一章最後一個畫面，回到對神的抱怨：「你們用言語煩瑣耶和華。」（瑪2:17）他們說：「公義的神在哪裡呢？」（瑪2:17）這個質問，同樣是在問：祢在哪裡？眼淚被看見了，詭詐被點出來了，可是公義呢？神的回答，不在這一章，下一章第一節，神會親自回答。"],["h","四、原文亮光：בְּרִית、בָּגַד 與 שָׁמַר"],["p","第一個字是 בְּרִית（berit，H1285，約）。這個字在原文的動詞，是「切約」，字面是「砍」一個約：古時立約要殺牲畜，把牲畜剖開，表示若違約就如同這樣。所以約不是輕鬆的合同，是帶著血的承諾。第二章裡，這個字出現在利未的約、列祖的約，與婚姻的約，神把三個約並排放在一起。"],["p","落到生活裡，我們很容易把「約」想成「合同」：合同講的是權利與義務，不合適就可以解約；約講的是關係與託付，是我把自己放進去。神說婚姻是「盟約的妻」，意思就是：你不是在經營一份契約，你是在守一個託付。"],["p","第二個字是 בָּגַד（bagad，H898，詭詐、背信）。這個字在 2:10–16 出現了五次，卻沒有一次用在外遇這個單一的行為上。它講的是一個人在關係裡的「背信」：說了的不算，應許的不守，承諾的不再放在心上。所以第二章談詭詐，涵蓋面比我們想的更寬：對弟兄、對配偶、對神。"],["p","落到生活裡，詭詐常常不是一次大事件，是一連串小事：講好的時間不守，答應的事不辦，說「我愛你」卻從不傾聽。每一次小小的失信，都是在拆約。反過來說，守約也是一連串小事：說到做到，記得約定，在別人看不到的時候仍然信實。"],["p","第三個字是 שָׁמַר（shamar，H8104，看守、謹守）。2:15、2:16 重複命令：「謹守你們的心」。這個動詞原本是看守園子、守護寶藏的意思。心，是需要被看守的地方；守護，不是壓抑感覺，是為一份珍貴的東西，築起一道牆。"],["p","當我們把心比作一座園，詭詐像是園子裡的蟲，不是一夜之間把園子吃光，是一片葉子一片葉子地蛀。看守園子的人，每天走一圈：今天我的心有沒有往別處偏？今天我有沒有對人說了一句不算數的話？每日一圈，園子就不會荒廢。"],["d",["בָּגַד 這個字在婚姻裡的「詭詐」，是不是只指外遇？","不是。這個字的核心意思是「背信」，把一份已經立下的信任拆毀。外遇是其中一種，但冷漠、長期的忽視、暴力、經濟上的欺瞞、把配偶當成附屬品，也都是在拆毀約。2:16 提到「強暴」，就是其中一個明顯的例子。所以這個字不只針對丈夫，也不只針對婚姻，凡是在關係裡拆毀信任的行為，都是「詭詐」。這個字提醒我們：守約不只是「不做壞事」，而是積極地信實、積極地看顧對方。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 2:16 去定離婚的人的罪，或者說凡離過婚的人都是「行詭詐」。這節在責備的是以詭詐、強暴對待配偶的行為，不是對每一位經歷婚姻破碎的人定罪。"],["p","第二個偏差，是用這一章勸被暴力、被傷害的人「忍耐，留下來」。2:16 清楚說，以強暴待妻的人是神所恨惡的。神從來沒有要求受害者留在傷害之中，更沒有叫人用眼淚去換平安。"],["p","第三個偏差，是把 2:11 當作禁止跨族群通婚的條文，或用它去衡量某一對夫妻是否「合神心意」。2:11 的核心是離棄耶和華、事奉別神，不是血統與國籍。"],["p","第四個偏差，是把這一章只當作婚姻專章，而忽略了 2:10 對全體弟兄姊妹說的話：我們是同一位父的兒女，不可以彼此詭詐。生意上的欺瞞、教會裡的失信、對弟兄姊妹說了不算的承諾，也都在這一章裡。"],["p","第五個偏差，是把「公義的神在哪裡呢？」當成不可以問的話，或者拿這句話去推算審判什麼時候來。神沒有把這句話擋回去，祂在下一章回答；而回答的重點是祂自己要來，不是日期。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題，是「勸和不勸離」。我們習慣在家務事上說「忍一忍就過去了」「家醜不可外揚」，於是眼淚被蓋住了，沒有人問，也沒有人敢說。這一章讓我們看見：神看見那些眼淚，並且說，祂不再看顧那些被眼淚蓋住的供物。教會的責任，不是催促受傷的人趕快和好，而是先承認傷害是真的，再陪伴他尋求安全與醫治。眼淚不需要被解釋，它只需要被看見。"],["p","第二個問題，是「自己人，所以不用那麼認真」。我們對外人客氣周到，對自己人，卻常常說得輕鬆、答得隨便：「到時候再說」「大家都是弟兄姊妹」。第十節卻說：正因為我們同有一位父，所以更不可以彼此詭詐。人情不能代替約，關係越親近，承諾越要算數。對神的約也是如此：我們常說「神明白我的心」，卻把許下的願、答應的奉獻、承諾的事奉，慢慢放成「有空再說」。"],["h","七、活出321——謹守心，守住約"],["p","三個基礎：耶穌是我的榜樣，聖經是我的準則，聖靈是我的引導。耶穌是守約的那一位，祂在十字架上沒有因為我們的詭詐而撕毀祂的約，是我們守約最真實的榜樣。聖經是我的準則，「謹守你們的心」不是我們自創的道德，是神的話。聖靈是我的引導，祂在心裡提醒、光照，使我們看見心裡那一點點鬆動的地方。"],["p","兩個核心：讓耶穌作王，讓耶穌得著一切的榮耀。讓耶穌作王，包括讓祂成為我的婚姻、我的家庭、我的承諾的主，不是我自己說了算。讓耶穌得著一切的榮耀，是當我守住一個約，不是為了我是一個好人，而是讓人從我的信實裡，看見那位守約的神。"],["p","一個目的：建立屬神的體系。屬神的體系，先生命，再關係，後事工。先與神的關係正確，再與自己、與人、與事。這一章每一個破碎的關係，都是次序倒了：祭司要保住職位，丈夫要保住面子，百姓要保住利益，於是約被放在最後。次序對了，約才守得住。"],["p","驕傲，是離開本位，抓住權力。丈夫以強暴待妻，是抓住不屬於他的權力；祭司把神的話改成自己想要的樣子，是離開本位，想代替神。謙卑，是回到本位，讓人作人，讓神作神。無己，才能守約：不是我自己撐著守，是基督在我裡面活，祂守約，我跟著祂。"],["h","八、四種心，面對約被破壞的痛"],["p","驕傲型：我讀這一章，心裡想的都是別人：那個人真該聽見。第二章要我先把鏡子轉向自己：我有沒有對弟兄說過不算數的話？我是不是也曾經在小事上詭詐？"],["p","恐懼型：我讀到咒詛就害怕，怕自己做過的事已經不能挽回，怕神不再看顧我。請你知道，這一章的目的是呼召回頭，「使多人回頭離開罪孽」是祭司的使命，也是神的心意。你可以帶著害怕回到祂面前。"],["p","羞恥型：我經歷過離婚、被離棄，或者婚姻裡有說不出口的傷，一讀到 2:16 就覺得自己被判了。請你知道，這一章最先聽見的是眼淚：前妻的眼淚，神說祂聽見了。你不是被定罪的人，你是被看見的人。"],["p","受傷型：我正在被傷害的關係裡，或者曾經被傷害，讀到「謹守」「守約」就覺得自己被要求繼續忍耐。請你知道，這一章沒有叫你留在暴力裡。神恨惡強暴，也看見你的眼淚。先確保你的安全，再慢慢談信任與醫治。"],["d",["如果我正在被傷害的婚姻裡，這一章要我怎麼做？","先確保安全。2:16 清楚說，以強暴待人的行為是神所恨惡的；這節沒有要求受害者忍耐留下。若有身體、情緒或經濟上的暴力，請把安全放在最前面，並尋求牧者、社工、輔導、家暴防治專線等專業協助，這不是對神的不信，也不是破壞約。第二章的主詞是行詭詐、行強暴的人，要被呼召回頭的，是他們。需要陪伴的人，請不要獨自承擔，也請不要被任何人用這一章逼你回到危險之中。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，寫下一個你最近說了、卻沒有做到的承諾，本週內完成它，或者坦白地向對方說明並道歉。"],["p","第二，挑一位你每天都見面的人，包括配偶、家人或同事，本週當面說一句具體的感謝，不要只是「謝謝」，要說出他做了甚麼。"],["p","第三，每天晚上用兩分鐘「走一圈園子」：今天我的心有沒有往別處偏？今天我有沒有說一句不算數的話？把它交給神。"],["p","第四，找一位你知道正在經歷家庭破口的弟兄姊妹，約一頓飯或打一通電話，不給建議、不追問細節，只說一句：「我在這裡。」"],["p","第五，為你的教會、你的小組，禱告三件事：說話算話，彼此信實，帶領的人先被光照。可以寫在手機的記事裡，每週一提醒自己一次。"],["p","我宣告：我們是同一位父的兒女，我不以詭詐待我的弟兄姊妹。"],["p","我宣告：我謹守我的心，說到做到。"],["p","我宣告：神看見眼淚，祂是受傷的人的神。"],["p","我宣告：耶穌是守約的主，我跟隨祂守約。"],["h","十、結語"],["p","我們回到開頭那一句「我願意」。它可能被放在抽屜，也可能被好好地守著；可能被傷害折斷，也可能被神重新扶起。神在這一章給我們的，不是一條條的禁令，而是一幅圖：一個壇被眼淚蓋住，一位神看見了。"],["p","這位神，不是在高處冷眼評審的神，祂是在眼淚旁邊作見證的神。祂為每一個被辜負的人心疼，也召喚每一個行詭詐的人回頭。「使多人回頭離開罪孽」，原是祭司的使命，最終是耶穌的使命。祂要的不是一個完美的人，而是一顆肯回頭、肯被光照、肯守住約的心。每一天，每一個小小的決定，都是我們把約放回心上的機會。"],["p","讓我們帶著這個焦點離開。焦點在耶穌，不在自己，不在別人，不在環境。不在我受了多少傷，不在別人欠了我甚麼，不在處境多艱難。焦點在那位守約的主：祂守住了與我們的約，也使我們有力量守住人與人之間的約。"],["p","親愛的天父，謝謝祢是同一位父，謝謝祢看見眼淚。求祢光照我們的心，讓我們看見自己的詭詐；求祢醫治每一個被傷害的人，使他們得著安全與平安；求祢使我們說到做到，成為信實的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","以下三個化請照次序帶。這一課碰到婚姻、離異與傷害，誠實比漂亮重要，也請保守彼此聽到的分享，不追問細節。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★＝時間充裕再討論。【必做】不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：從「說出口的承諾」進入第二章。；看見自己也有說了不算的時候。；聽見神看見眼淚。"],["n","1. ★★★ 你說過、卻沒有做到的一個承諾是甚麼？不用說細節，只說一句。"],["n","2. ★ 「我們豈不都是一位父嗎？」這句話，在你的小組或教會，哪一個地方最容易被忘記？"],["n","3. 讀瑪2:13：神看見眼淚。你有沒有哪一次，覺得自己的眼淚被神看見了？"],["m","帶領提醒：第1題：只說一句即可。 第2題：說具體的場景，不點名批評。 第3題：說感受即可；有人提到家庭的傷，不追問細節，不要求原諒，會後單獨關心。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：在這一章中定位自己。；聽見神說話。；想通守約與守心。；說出口。；把決定化為行動。"],["t","【看】看見自己"],["n","4. ★ 這一章裡，你比較像誰？被眼淚遮蓋的人、行詭詐的人、帶頭教導的人，還是旁觀的人？說出理由。"],["t","【聽】聽神說話"],["n","5. 默讀瑪2:15 的後半句「所以當謹守你們的心」。你聽見神在對你的心說甚麼？"],["t","【想】想通關卡"],["n","6. ★★★ 詭詐常常從心裡的小鬆動開始。你心裡最近有哪一個小鬆動？它可能長成甚麼？"],["t","【講】說出口"],["n","7. 兩人一組，說出一件你願意從今天起守住的承諾，聆聽者只回應：「我為你守住這件事禱告。」"],["t","【行】走一步"],["n","8. ★ 本週你要做哪一件具體的事，來守住一個約？寫下哪一天、幾點、對誰。"],["m","帶領提醒：第4題：若有人說自己是被傷害的一方，不追問細節，不要求原諒，不要求留在傷害之中，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。 第6題：只說到自己能說的程度。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：操練 920。；把守約帶到人際關係中。；讓信實成為我們的見證。"],["n","9. ★★★ 920 的操練：找出你的那一個「2」，身邊誰正經歷關係的破口？當場說出他的名字，以及本週哪一天為他做一件事：一通電話、一頓飯、一句問候。"],["n","10. 你的小組有沒有一個「說了不算」的習慣，例如遲到、爽約？你可以怎樣一起更新？"],["n","11. ★ 若朋友問你「為甚麼神不管我的婚姻」，你會怎樣用這一章回應？寫下兩句，不說教，不給答案，只陪伴。"],["n","12. 你的教會對於被傷害的人，有沒有一個安全的求助管道？你可以做哪一件事讓它更清楚？"],["n","13. 本週每天晚上問自己一次：今天我有沒有說一句不算數的話？與一位組員配對提醒。"],["n","14. 【必做】繁殖任務：請用三句話，把這一課講給一位教會外的朋友聽：神看見眼淚；婚姻與承諾是在神面前立的約；神恨惡詭詐與強暴，也呼召人回頭。"],["m","帶領提醒：第9題：說名字，不公開對方處境。 第11題：若牽涉婚姻破裂或家暴，不追問細節，不要求原諒，不要求留在傷害之中，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。 第12題：只談制度與資源，不談個案。"],["s","收尾（5分鐘）"],["p","請大家安靜，把心裡的那一滴眼淚輕輕放在神面前。祂看見，也沒有離開。讓我們一起為彼此禱告，求主使我們成為守約、信實的人。"]],"chars":5202,"min":60,"deep":8,"dchars":1481,"tchars":518},"3":{"no":3,"vol":"《321瑪拉基書講義》第3課·瑪拉基書第3章","title":"現在你們要轉向我——使者、轉向、記念","blocks":[["h","一、忽然進殿的主：火與鹼"],["p","弟兄姊妹平安。想像一個離家很久的人，在某一個黃昏，站在老家的門口。門沒有鎖，院子裡的燈是暗的，他不知道裡面還有沒有人，也不知道那個人看見他，會說甚麼。他的手停在門把上，停了很久。第三章，就是神站在門內，對著門外的人，說出的那一句話：「現在你們要轉向我，我就轉向你們。」"],["p","可是這一章不是從這句話開始的。上一章的結尾，百姓問：「公義的神在哪裡呢？」現在神回答了，答得出乎意料：「我要差遣我的使者在我前面預備道路。你們所尋求的主必忽然進入他的殿。」（瑪3:1）你們問祂在哪裡，祂說：我要來，而且是忽然來。"],["p","接著是一個叫人屏息的反問：「他來的日子，誰能當得起呢？他顯現的時候，誰能立得住呢？」（瑪3:2）這是對 2:17 的回答。你們想要公義的神，你們真的承受得起嗎？因為祂來，是「如煉金之人的火，如漂布之人的鹼」（瑪3:2）。火是熬煉金屬的，鹼是洗衣服的。火要除掉的是雜質，不是金子；鹼要洗掉的是髒，不是布。"],["p","所以第三節說：「他們就憑公義獻供物給耶和華。」（瑪3:3）那位進殿的主，要先潔淨祭司，使他們的獻上重新成為潔淨的獻上。第四節說，那時供物必蒙悅納，像古時一樣。第一章神說「我不收納」，這裡神說「我悅納」：中間隔著一場熬煉。"],["d",["「我的使者」與「立約的使者」是誰？新約怎麼說？","1:1 的「瑪拉基」字面是「我的使者」，3:1 前半句的「我的使者」，是要在主前面預備道路的那一位；後半句「立約的使者」，則是那位進殿的主自己。新約作過明確的連結：馬可福音與馬太福音把「預備道路的使者」連到施洗約翰（可1:2–3；太11:10）。至於進殿的主，新約的福音書見證耶穌來到聖殿，也在殿裡行事。我們可以抓住新約已經說明的連結，其他的對應則不必多加猜測：重點是，神真的來了，而且先差遣了預備道路的人。"]],["d",["3:2–3 的火與鹼，是在說審判，還是在說潔淨？","兩者都有，而且次序很重要。經文用的是熬煉金銀、洗衣服的比喻：熬煉的目的是得著純淨的金銀，洗衣的目的是得著乾淨的衣服。所以這裡的火，不是拿來燒毀的火，而是拿來煉淨的火。同時，這個過程並不輕鬆，經文說「誰能當得起」，這是真的。更穩當的讀法是：神的來臨，對不肯回頭的人是審判，對願意被潔淨的人是更新。我們不必把這節話讀成只有嚇人，也不要把它讀成沒有重量。"]],["p","第五節把審判說得更具體：「我必臨近你們，施行審判。」（瑪3:5）被點名的，是邪術、姦淫、假誓、虧負人工價、欺壓寡婦孤兒與寄居的，最後是總結：不敬畏我。請注意，這一份清單裡有很多是「強者對弱者」的事：欠人工資，欺壓沒有保護的人。神臨近的時候，最先看見的是被壓住的人。"],["h","二、不改變的神與「現在你們要轉向我」"],["p","第六節是一句支撐全章的話：「因我－耶和華是不改變的，所以你們雅各之子沒有滅亡。」（瑪3:6）注意因果：不是因為你們好，所以沒有滅亡；是因為我不改變，所以你們沒有滅亡。全書第一章說「我曾愛你們」，這裡說「我是不改變的」，前後呼應：神的愛，是我們存活的原因。"],["p","這句話裡的「雅各之子」，把我們帶回第一章的起點：「我卻愛雅各」。三章之前，神用雅各與以掃的歷史，說明祂的愛；三章之後，神說雅各的子孫沒有滅亡，因為祂不改變。愛是起點，不變是保證，轉向是回應。一本書的首尾，在這裡接上了。"],["p","然後，是全書最溫柔的邀請：「從你們列祖的日子以來，你們常常偏離我的典章而不遵守。現在你們要轉向我，我就轉向你們。」（瑪3:7）「轉向」這個動詞，在原文是人轉，神也轉，同一個字，同一個動作。這是一個命令，也是一個應許：你向我走一步，我也向你轉過來。"],["p","可是百姓的回應，還是那個老樣子：「我們如何才是轉向呢？」（瑪3:7）這句話可以讀成頂嘴，也可以讀成真心的詢問：我們不是不想，是不知道怎麼做。神接下來就回答了，從一個很具體的地方開始。"],["p","神說：「人豈可奪取神之物呢？」（瑪3:8）他們反問：「我們在何事上奪取你的供物呢？」神指出的是當納的十分之一和當獻的供物。這是當時聖殿制度的一部分：利未人與祭司靠這份供給維持生活，倉庫空了，聖殿的事奉就停擺（尼13:10–12）。所以神的責備，指向一件很實際的事：把本來屬於神家、屬於事奉者的那一份，截留了。我們今天不再有那樣的殿與倉庫，但有一個原則仍然成立：屬於神的，不能被我們悄悄收進自己的口袋，那是對神家與服事者的虧欠。"],["p","接著是第十節，也是全卷最常被引用，也最常被誤用的一句：「使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。」（瑪3:10）這一節在說甚麼？它在說一個在特定約的處境裡的邀請：回到約的次序，神就會回到約的祝福。它不是一條「投資回報」的公式，更不是對今天任何人的保證。"],["p","第十一、十二節說，神要為他們斥責蝗蟲，不使莊稼受損，萬國必稱他們為有福。這幅圖畫的重點，是約的次序恢復之後的光景，而不是「獻得越多、賺得越多」。若把這幾節話拿來說：你獻了，神就一定使你生意興旺，那是把一段對全民的約，變成了個人的交易。"],["d",["3:10「試試我」，是不是說只要奉獻，神就一定使我富足？","不是。這是舊約全書唯一一次，神邀請人「試試祂」，而且是在那個特定的約的處境裡：全國性地回到約的次序，把聖殿的供應守住，神就守住祂對全地的祝福。這不是個人的投資方案，也不是對每一位信徒的財務保證。新約談奉獻的時候，強調的是甘心樂意，不是勉強，也不是為了換回報（林後9:7）。耶穌也提醒，不要為獲得而施捨。我們可以安心地奉獻，卻不必把神當成一個回報機器。若有人用這節經文向你施壓，說「你獻了就會發財」，請不要被說服。"]],["d",["十分之一，今天的教會與信徒要怎麼看？","各個教會與傳統看法並不完全一致。有些教會教導信徒以十分之一為基本的起點，有些教會強調新約的重點是甘心樂意，憑自己的情況，並不規定比例。無論採取哪一種做法，有幾件事是一致的：第一，奉獻是對神的回應，不是向神購買祝福；第二，不可用恐嚇、羞辱或比較來逼迫人；第三，奉獻的運用要公開、透明、負責；第四，沒有能力奉獻的人，不因此被輕看。這一課不會規定某一個比例，也不會問任何人的收入或金額。"]],["h","三、事奉神是徒然的嗎？一本紀念冊"],["p","第十三節開始，神又說：「你們用話頂撞我。」他們又說：「我們用什麼話頂撞了你呢？」神把那句話逐字念了出來：「事奉神是徒然的」，「在萬軍之耶和華面前苦苦齋戒，有什麼益處呢？」（瑪3:14）這是整卷書最誠實的一句話。他們不是否認有神，他們是累了，覺得做了這麼多，沒有任何回報。"],["p","他們看的是甚麼？「如今我們稱狂傲的人為有福，並且行惡的人得建立。」（瑪3:15）看起來，行惡的人興旺，守約的人辛苦，公平在哪裡？這個問題，詩篇裡有人問過，約伯也問過。你若曾有這樣的心情，請不要急著責怪自己，因為這個問題，在經文裡是被寫下來、被聽見的。"],["p","這個問題之所以痛，是因為它有一半是真的：公義有時真的看不見。經文沒有否認這一點，也沒有急著用一句話把問題壓下去。神的回答，是一個更長的時間表：有一個日子，有一本冊子，有一個分別。耐心，是信心在等待時的樣子。"],["p","接著，故事轉折：「那時，敬畏耶和華的彼此談論，耶和華側耳而聽，且有紀念冊在他面前。」（瑪3:16）在一群人抱怨的時候，有另一群人，他們沒有放棄，他們彼此談論；耶和華側耳而聽。祂把這些談話，記在一本紀念冊上。神是一位會豎起耳朵聽的神。"],["p","然後是這一章最溫暖的承諾：「在我所定的日子，他們必屬我，特特歸我。」（瑪3:17）「特特歸我」，這四個字在原文是珍寶、特別的產業，是出埃及記裡神對以色列說「你們要作我的珍寶」的同一個字。「我必憐恤他們，如同人憐恤服事自己的兒子。」（瑪3:17）神看見服事的人，祂記得，像父親記得兒子的辛苦。"],["d",["3:14–15 的抱怨，我們真的可以向神這樣問嗎？","可以。這段話沒有被刪掉，它被記在聖經裡，神把它原原本本地說出來，這表示祂聽見了。更重要的是，下一節接著說：「敬畏耶和華的彼此談論」，神聽見的，不只是抱怨，也包括那些仍然敬畏祂、仍然開口說話的人。這裡有兩件事要分開：一是把話說給神聽，包括疑問、疲累、不解，這是禱告，也是信心的一種形式；二是用「事奉有甚麼益處」來為自己的敷衍找理由，這是第一章已經責備過的。能分辨這兩者，是成熟。"]],["d",["紀念冊是一份名單嗎？名字不在冊上的人就沒有救恩嗎？","3:16 的紀念冊，是神記錄「敬畏祂、思念祂名的人」的一本冊子。它在這裡的作用，是向那些覺得被遺忘、覺得做的一切沒有人看見的人說：神記得。它不是在說，只有被記在這本冊子上的人才得救，也不是一份要靠「做得夠多」才能上榜的考績表。救恩，是神白白給的恩典，是基督為我們做成的事。紀念冊要安慰的，是正在疲累中仍然敬畏神的人，不是要驚嚇那些害怕自己不夠好的人。"]],["p","最後，第十八節說：「那時你們必歸回，將善人和惡人，事奉神的和不事奉神的，分別出來。」（瑪3:18）這是一個應許的畫面：神的日子，會把表面的好壞分清楚。不是由我們現在來分，也不是由我們去論斷誰是善人、誰是惡人。這是神的工作；我們的工作，是現在就轉向。"],["h","四、原文亮光：שׁוּב、סְגֻלָּה 與 זִכָּרוֹן"],["p","第一個字是 שׁוּב（shuv，H7725，轉回、歸回）。這是全書最重要的動作詞，在第三章第七節，連續出現三次：「轉向」、「我就轉向」、「如何才是轉向」。這個字的本意，是調頭、往回走。它不是「改進」，也不是「更努力」，是轉身，朝向另一個方向。"],["p","同一個字，神與人都用：人轉回，神也轉回。這代表我們的悔改，不是一個人孤獨地爬回來，而是神在原地等著；你轉過身，祂已經在那裡。更令人安慰的是，在 3:18 這個字又出現了，可以讀作「歸回」，也可以讀作「再一次」。神給我們的，是一次又一次轉向的機會。"],["p","第二個字是 סְגֻלָּה（segullah，H5459，珍寶、特別的產業）。這個字在舊約裡並不常見，最著名的一次，是在出埃及記，神對剛出埃及的以色列說：你們要作我的珍寶。瑪拉基在這裡，把同一個字用在一群疲累、失望、甚至頂撞過神的人身上。"],["p","這是這個字最動人的地方：神說「特特歸我」，不是在人最風光的時候，而是在人最失望的時候。珍寶，不是因為它自己多有價值，而是因為它被一個人看重。神看重我們，我們才成為珍寶。這份看重，不是我們用表現換來的。"],["p","第三個字是 זִכָּרוֹן（zikkaron，H2146，記念、紀念）。這個字不只是想起來，而是帶著行動的記得。聖經裡神記得挪亞、記得拉結、記得祂的約，每一次「記得」，都帶著拯救。所以紀念冊的意思不是神會忘記，所以要寫下來，而是：祂記得，並且要行動。"],["p","這個字也預備了下一章。第四章末了，神會吩咐百姓「記念」摩西的律法。神記得我們，我們也要記得祂；祂記念我們的名，我們也思念祂的名。這是約最美的樣子：彼此記念。"],["d",["שׁוּב「轉向」是一次決志，還是每天的事？","兩者都是。有一次決定性的轉向，就是第一次承認自己需要神，相信耶穌為我們死而復活；這是一次性的、改變方向的決定。同時，在跟隨的路上，我們也會一次又一次地偏離、一次又一次地轉回。3:18 的字可以讀作「再一次」，正好說明神沒有定一個轉向的次數上限。我們不必因為又一次跌倒就覺得前功盡棄；每一次轉回，都是神早就等著的那一步。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 3:10 當成「奉獻換祝福」的公式，用它保證富足、勸人多奉獻。這一節是在約的處境裡，向全國的人說的邀請，不是向每一位個人保證的投資回報。"],["p","第二個偏差，是用 3:8–9 的「咒詛」去恐嚇人，把生病、失業、虧損，解釋成「沒有獻十分之一的報應」。這是把受苦者再打擊一次，與經文的心完全相反。"],["p","第三個偏差，是只看見 3:2 的「火」，忘了熬煉的目的是得著金子。神的來臨，既有審判，也有潔淨與更新；若只讀出恐嚇，就讀偏了。"],["p","第四個偏差，是把 3:14–15 的話當成不信的罪，不准人在疲乏與不解中，問「事奉有甚麼益處」。神把這些話原原本本記在經上，因為祂聽見，並且回答了。"],["p","第五個偏差，是把 3:16 的紀念冊當成救恩的條件，擔心「自己的名字不在冊上」，於是不斷用表現去補。救恩是恩典，紀念冊是安慰；兩者不可顛倒。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題，是「交易式的信仰」。我們從小看慣了燒香拜拜換平安，捐香油錢換保佑，於是很容易把奉獻也想成交易：我獻多少，神就給多少。3:10 的「試試我」，特別容易被讀成這樣。可是神要的，是一個回到約的次序的人，不是一個計算回報的人。把神當作可以談條件的對象，是把祂放得太小了。"],["p","第二個問題，是「辛苦不說，苦苦撐著」。華人教會習慣說好話、報喜不報憂，很少有人敢說：「我累了，事奉有甚麼益處？」於是疲乏只能放在心裡，慢慢變成冷淡。可是 3:16 有一幅圖：敬畏耶和華的人彼此談論，而神側耳而聽。我們需要這樣的小圈子：一個可以說真話，而不會被論斷的地方。一個肯說真話的小圈子，往往比一場感人的講道，更能把疲乏的人留在神的家裡。"],["h","七、活出321——轉向祂，被祂記念"],["p","三個基礎：耶穌是我的榜樣，聖經是我的準則，聖靈是我的引導。耶穌是那位進入聖殿、也成為立約使者的主，祂自己經過了火，卻從來沒有偏離父神。聖經是我的準則，我們用神的話，而不是用我們的感覺，來決定怎麼轉向。聖靈是我的引導，祂光照我們，哪一個地方需要被熬煉，哪一個地方需要被洗淨。"],["p","兩個核心：讓耶穌作王，讓耶穌得著一切的榮耀。讓耶穌作王，就是承認倉庫、時間、才能、金錢，都屬於祂，我們只是管家。讓耶穌得著一切的榮耀，就是當我們奉獻、事奉、轉向的時候，不為換取回報，不為被人看見，只為讓祂的名被尊為大。"],["p","一個目的：建立屬神的體系。屬神的體系，先生命，再關係，後事工。先有一個被神潔淨的生命，才有對的關係，再有事奉。3:14 的疲乏，常常是次序倒了：事工先於關係，行動先於被愛，於是事奉成了工作。回到祂的面前，事奉才是果子，不是重擔。"],["p","驕傲，是離開本位，抓住權力。「事奉神是徒然的」，是人站在神的位置上計算：我付出多少，祢要給我多少。謙卑，是回到本位，讓人作人，讓神作神。無己，才能轉向：不是我自己努力回來，是基督在我裡面活，祂拉我，我跟著。無己，才能在疲乏中仍然說：我屬祢。"],["h","八、四種心，面對「現在你們要轉向我」"],["p","驕傲型：我覺得自己一直在轉向，一直在事奉，一直在奉獻，神為甚麼還沒有回報？第三章要我先放下計算，看見自己是不是又把神放在了「欠我」的位置上。"],["p","恐懼型：我讀到咒詛、讀到審判，就怕自己不夠好、奉獻不夠、轉向得不夠快。請你知道，這一章的重點是「我就轉向你們」，神先等著，神先回應，你不是被追著打的人。"],["p","羞恥型：我偏離太久了，不知道怎麼回去，覺得自己沒有資格被稱為珍寶。請你知道，「特特歸我」是對一群頂撞過神的人說的。珍寶不是因為你完美，而是因為祂看重你。"],["p","受傷型：我很認真事奉，卻被誤會，被忽略，甚至被傷害，所以我問：這有甚麼益處？請你知道，神聽見了，祂側耳而聽，祂把你的名字記在祂面前。你可以把疲乏說出來，不需要假裝沒事。"],["d",["如果我真的覺得事奉沒有回報，疲累透了，該怎麼辦？","第一，先承認，不要壓抑。3:14 的話被原樣記下來，神沒有迴避。第二，找一兩位可以說真話的人，像 3:16 那樣彼此談論，不用解決問題，只要被聽見。第三，檢查生活的節奏：有沒有足夠的休息？有沒有把自己放在服事的位置上，卻忘了與神的關係？事奉是果子，不是來源。第四，如果疲乏已經影響睡眠、情緒或日常功能，請尋求牧者或專業的協助，這不是軟弱，是對自己與家人的負責。神記得你的辛苦，祂不要你硬撐。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，寫下一件你一直知道要「轉向」、卻一直拖延的事，並寫下本週可以做的第一個具體動作：哪一天、幾點、對誰。"],["p","第二，在時間、才能、金錢三樣裡面選一樣，在禱告中問神：「我是不是把屬祢的，當成了自己的？」只在神面前處理，不需要告訴任何人數目。"],["p","第三，找一位敬畏主的朋友，約定每週二十分鐘的「彼此談論」，談的是主，不是八卦；談的是真話，不是客套。"],["p","第四，把一句真心話寫給神：「事奉有甚麼益處？」可以寫成一則短禱告，不用修飾，寫完之後，默想 3:16。"],["p","第五，為一位「做了很多卻很累」的服事者，寫一句具體的鼓勵：你記得他做過的哪一件事，那件事對你有甚麼影響。送出去。"],["p","我宣告：神是不改變的，所以我沒有滅亡。"],["p","我宣告：我轉向祂，祂也轉向我。"],["p","我宣告：我是祂的珍寶，祂記得我所有的辛苦。"],["p","我宣告：我所有的一切屬於耶穌，祂是我的王。"],["h","十、結語"],["p","我們回到那個站在老家門口的人。門把還在他手裡，他不知道門裡面是甚麼。這一章告訴我們：門裡面有一位父親，早就站在那裡了。祂說的第一句話，不是「你怎麼這麼久才回來」，而是「現在你們要轉向我，我就轉向你們」。"],["p","轉向，不是一場表演，是一個轉身。祂已經站在那裡，我們只要轉過身。哪怕是帶著疲乏、帶著失望、帶著一肚子的問號，神說：我側耳而聽，我有紀念冊，我要你們特特歸我。"],["p","讓我們帶著這個焦點離開。焦點在耶穌，不在自己，不在別人，不在環境。不在我轉得夠不夠好，不在別人怎麼看，不在處境有多辛苦。焦點在那位忽然進殿、立約的主，祂是我們的珍寶的擁有者，也是我們的記念者。"],["p","親愛的天父，謝謝祢是不改變的神，謝謝祢先轉向我們。求祢光照我們，讓我們看見自己需要轉向的地方；求祢保守疲累的人，使他們知道祢側耳而聽；求祢使我們成為祢的珍寶，榮耀祢的名。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","以下三個化請照次序帶。這一課碰到奉獻、疲乏與失望，誠實比漂亮重要，也請保守彼此聽到的分享，不問任何人的收入或奉獻金額。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★＝時間充裕再討論。【必做】不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：從「門口那個人」進入第三章。；承認自己也有想轉向卻沒轉的地方。；聽見神說「我就轉向你們」。"],["n","1. ★★★ 你生命裡有沒有一個「站在門口」的時刻？說一件事就好。"],["n","2. ★ 3:7 的「我就轉向你們」，這句話你最近有沒有聽見？在哪裡聽見？"],["n","3. 「事奉神是徒然的」這一句話，你有沒有想過？可以只說一句。"],["m","帶領提醒：第1題：說一件事即可，不追問細節。 第2題：說具體的場景。 第3題：說感受即可，不論斷。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：在這一章中定位自己。；聽見神說話。；想通轉向的意思。；說出口。；把決定化為行動。"],["t","【看】看見自己"],["n","4. ★ 這一章裡，你比較像誰？問「如何轉向」的人、抱怨「事奉徒然」的人，還是彼此談論的敬畏者？說出理由。"],["t","【聽】聽神說話"],["n","5. 默讀瑪3:17，把「他們」換成你的名字再讀一次。你聽見神說甚麼？"],["t","【想】想通關卡"],["n","6. ★★★ 如果轉向是調頭，你現在的哪一個方向，需要調頭？是甚麼讓你遲遲沒有轉？"],["t","【講】說出口"],["n","7. 兩人一組，說出你最近一次的疲乏，聆聽者只回應：「神側耳而聽，我也在聽。」"],["t","【行】走一步"],["n","8. ★ 本週你要做哪一個具體的轉向動作？寫下哪一天、幾點、對誰。"],["m","帶領提醒：第4題：若有人說自己是疲累的服事者，不追問，不要求立刻有答案，不對正在流淚的人說「你要有信心」，會後單獨關心。 第7題：只要求說出，不需要解決。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：操練 920。；把「彼此談論」帶進小組。；讓轉向成為每日的習慣。"],["n","9. ★★★ 920 的操練：找出你的那一個「2」，身邊誰正在疲累或遠離？當場說出他的名字，以及本週哪一天為他做一件事：一通電話、一頓飯、一句鼓勵。"],["n","10. 你的小組有沒有一個可以說真話的空間？你可以做哪一件事讓它更安全？"],["n","11. ★ 若朋友說「事奉有甚麼益處」，你會怎樣用這一章回應？寫下兩句，不說教。"],["n","12. 你可以向誰說一次具體的感謝，因為他的服事你看見了？"],["n","13. 本週每天問一次「主啊，我今天有沒有轉向祢」，與一位組員配對提醒。"],["n","14. 【必做】繁殖任務：請用三句話，把這一課講給一位教會外的朋友聽：神是不改變的；你轉向祂，祂也轉向你；祂記得每一個敬畏祂的人。"],["m","帶領提醒：第9題：說名字，不公開對方處境。 第10題：只談制度與做法，不談個案。 第12題：說具體的一件事即可。 全課不詢問收入、不討論奉獻金額、不比較奉獻多寡。"],["s","收尾（5分鐘）"],["p","請大家安靜，把心裡那一把還握在手裡的門把，輕輕放開。神已經在門內等著。讓我們一起為彼此禱告，求主使我們轉向祂，也被祂記念。"]],"chars":5289,"min":60,"deep":8,"dchars":1484,"tchars":446},"4":{"no":4,"vol":"《321瑪拉基書講義》第4課·瑪拉基書第4章","title":"必有公義的日頭出現——爐、翅、轉","blocks":[["h","一、那日如爐：長夜裡的最後一個應許"],["p","弟兄姊妹平安。你有沒有過這樣的夜晚？不是睡不著，是在等天亮。也許是醫院走廊上的長椅，也許是守著一個還沒有退燒的孩子，也許只是一個說不出原因的失眠。你一遍又一遍地看錶，窗外還是黑的。最難熬的，不是黑，是不知道天甚麼時候才會亮。舊約讀到瑪拉基書的結尾，就像讀完了一整個長夜。而這最後一章，是天亮之前，神說的幾句話。"],["p","第一句，是一幅叫人心驚的畫面：「那日臨近，勢如燒著的火爐。」（瑪4:1）這個「那日」，在全書反覆出現：3:2 他來的日子，3:17 我所定的日子，現在是「那日」。它不是一個日曆上的日子，是神親自出手的日子。前面說的火，是煉金的火，是潔淨的火；這裡說的火爐，是審判的火。"],["p","被燒的是誰？「凡狂傲的和行惡的必如碎秸。」（瑪4:1）「狂傲的」，正是 3:15 百姓說「稱為有福」的那一群人。他們看起來興旺、站得穩，可是在神的日子，他們像碎秸一樣：輕，沒有根。第一節的結尾說：「根本枝條一無存留。」（瑪4:1）連根帶枝，什麼也沒留下。這是一幅關於「沒有根的興旺」的畫面。"],["p","讀到這裡，我們要小心兩件事。第一，這一節不是時間表，不能拿來推算哪一年、哪一國會發生甚麼事。第二，「狂傲的和行惡的」是一類人，不是一個民族，不是一個政黨，也不是你不喜歡的某個人。經文講的是神的日子裡，狂傲沒有根；至於誰是狂傲的，最先要被光照的，是我們自己的心。"],["d",["「那日」是甚麼時候？4:1 可以用來推算末日嗎？","不可以。經文沒有給任何日期，也沒有說有多遠、有多近，只說「那日臨近」，並且強調是神「所定的日子」（4:3）。耶穌自己說，那日子和時辰，除了父，沒有人知道（太24:36）。歷史上許多用瑪拉基書或其他經文推算末日的人，一再落空，並且傷害了不少人的信心。這一節的功用不是讓我們計算，是讓我們看見：神的公義不會落空，狂傲的興旺沒有根。我們的責任是今天就轉向，而不是研究日期。"]],["d",["「狂傲的和行惡的」是指誰？可以對號入座嗎？","不可以對號入座。「狂傲的」原文意思是沸騰的、自高的人，3:15 的百姓稱這樣的人為有福；「行惡的」是做惡事的人。這是兩類人的行為特徵，不是一個國家、一個民族或一群特定的人。把它拿去指著某國、某政權、某宗派說「這就是被燒的」，是把神的審判拿來當作自己的立場。更穩當的讀法，是先拿來問自己：我心裡有沒有狂傲？我有沒有行過惡而不自知？神要先光照我們，才輪到別人。"]],["h","二、公義的日頭：光線有醫治之能"],["p","可是第二節開頭，有一個小小的字，把整個畫面翻轉了：「但」。「但向你們敬畏我名的人必有公義的日頭出現」（瑪4:2），而且「有醫治之能」（瑪4:2）。火爐的對面，是日頭。碎秸的對面，是敬畏的人。這一群人，就是 3:16 彼此談論、被記在紀念冊上的那一群人。"],["p","「日頭」，在原文是太陽，與 1:11「從日出之地到日落之處」遙遙呼應：太陽升起的地方，神的名要被尊為大。這個日頭是「公義的」，那位忽然進殿的主，祂的來臨，對狂傲的人是爐，對敬畏的人是光。同一個日子，同一位神，因為站的位置不同，經歷就完全不同。"],["p","「光線有醫治之能」，括弧裡的原文是「翅膀」：日頭的翅膀有醫治。翅膀，是母鳥護雛的畫面，是遮蔽、是保護、是被抱在底下的安全感。這不是一道從遠處射過來的光，是一雙把人收在懷裡的翅膀。神說的醫治，是被護著、被抱著、被修復的整個人。"],["p","然後是一幅最歡樂的畫面：「你們必出來跳躍如圈裡的肥犢。」（瑪4:2）小牛被關在圈裡很久，門一開，就是衝出來蹦跳。這是被釋放的歡喜，是長夜結束的第一個動作。注意，是「必出來」：這不是靠自己努力爬出來，而是門被打開了，人走出來。"],["p","第三節說：「你們必踐踏惡人」（瑪4:3），惡人必如灰塵，在你們腳掌之下。請不要把它讀成鼓勵信徒去報復。這是神所定的日子裡的畫面：站穩的人，腳下踏實，惡不再有力量。審判是神的工作，不是我們的；我們的工作，是現在就轉向，並且在受苦中仍然敬畏祂。"],["d",["「你們必踐踏惡人」，是不是鼓勵信徒去報復？","不是。這是神所定的日子裡的畫面，不是對今天信徒的行動指令。新約清楚教導，不要以惡報惡，不要自己伸冤，因為伸冤在主（羅12:17–19）。「踐踏」畫的是一幅勝利的景象：惡的力量被徹底壓下，站穩的人腳下踏實。它想要安慰的，是那些長期被惡人欺壓、覺得公義遲遲不來的人：惡不會永遠得勝。我們今天要做的，是不報復，仍然行善，並把審判的事交給那位公義的審判者。"]],["d",["「公義的日頭」是誰？「翅膀」是甚麼意思？","舊約沒有直接說出這位日頭的名字，但新約有一個很美的呼應：撒迦利亞稱頌，「清晨的日光」要從高天臨到我們，照亮坐在黑暗裡的人（路1:78–79）。許多基督徒讀到這裡，會想起耶穌：祂是世界的光，也是醫治者。至於「翅膀」，有人想到母鳥的護雛，有人想到衣服的邊（原文也有「衣角」的意思），各家看法不同。我們不必選一個非答不可的答案，只要抓住它的整體畫面：保護、遮蔽，以及帶著醫治的臨到。"]],["d",["4:2 的醫治，是不是說只要有信心，病就一定會好？","不是。這一節是對「敬畏耶和華的人」的整體應許：在神所定的日子，神的公義要像日頭一樣升起，翅膀下有完整的醫治，包括身體、心靈、關係與整個世界的修復。它不是一個針對今天某個病人的診斷標準，更不是「你的病沒好，是因為信心不夠」的證據。一位正在病中的人，需要的是陪伴、醫療與禱告，不是被指責。我們可以為病人祈求醫治，同時承認：全然的醫治，在那日。在那日之前，神是與我們同在、扶持我們的神。"]],["h","三、記念律法，轉向父子"],["p","日頭升起之前，還有一件事要做：「你們當記念我僕人摩西的律法。」（瑪4:4）「記念」，在原文是「記得」的命令式。第三章神有一本紀念冊，記念敬畏祂的人；第四章，輪到人要記念祂的話。神記得我們，我們也要記得祂。這是彼此記念的約。這是長夜裡守夜人的功課：天亮之前，先把手裡那本記錄翻開，重新讀一遍，記得是誰在說話。"],["p","何烈山，是西奈山的另一個名字，是神親自把律法交給百姓、與他們立約的地方。瑪拉基在全書的最後，把眼光帶回那座山，好像在說：要往前走，先回到起點。回到起點，不是倒退，是重新對準方向，像迷路的人，先找回路標。"],["p","為甚麼是「摩西的律法」？因為整卷書裡百姓的問題，都是「偏離」：偏離祭物的條例，偏離婚姻的約，偏離奉獻的次序。要回來，就是回到那一份最初的託付：何烈山上，神與百姓立的約。律法在這裡不是一堆規條，是「指方向」的教導，是回家的路標。"],["p","然後，全書最後一個應許：「看哪，耶和華大而可畏之日未到以前，我必差遣先知以利亞到你們那裡去。」（瑪4:5）這句話呼應 3:1 的「我要差遣我的使者」。神的來臨，永遠有人在前頭預備。新約作過明確的連結：施洗約翰，就是那位帶著以利亞心志與能力的預備者（太11:14；路1:17）。除了新約已經說明的，我們不必再把這個名字對到任何一位現代人物身上。"],["p","以利亞要做的事，是這樣的：「他必使父親的心轉向兒女，兒女的心轉向父親，免得我來咒詛遍地。」（瑪4:6）整本舊約的最後一個動作，不是打仗，不是審判，而是一顆心轉向另一顆心。「轉向」，就是 3:7 那個從 1:4 一路走來的動詞。全書的行動，在這裡收束：先是神轉向人，再是人轉向神，最後是人轉向人。"],["p","請注意經文的次序：先是「父親的心轉向兒女」，再是「兒女的心轉向父親」。先動的，是有權柄的一方。在關係裡，握有權力的人先放下身段，才有可能和好。這不是一條要求子女單方面順服的命令，也不是要求任何人回到不安全的關係裡。它是在說：神所盼望的家，是父母與兒女彼此轉向的家。"],["d",["以利亞是誰？新約怎麼說？","以利亞是舊約的先知，在列王紀裡與巴力的先知對質，後來被接升天。瑪拉基書說，在神大而可畏的日子以前，神要差遣以利亞。新約作了幾次明確的連結：天使對撒迦利亞說，施洗約翰要有以利亞的心志和能力（路1:17）；耶穌說，若人肯領受，約翰就是那應當來的以利亞（太11:14），並說以利亞已經來了（太17:10–13；可9:11–13）。除了這些新約已經說明的，聖經沒有說某一位當代人物就是以利亞。我們不必猜測，也不該把這個名字貼在任何人身上。"]],["h","四、原文亮光：שֶׁמֶשׁ צְדָקָה、כָּנָף 與 לֵב"],["p","第一個詞組，是 שֶׁמֶשׁ צְדָקָה（shemesh tsedaqah，H8121＋H6666，公義的日頭）。「公義」這個字，在 3:3 出現過：「他們就憑公義獻供物給耶和華」。神的公義，起先是要求人獻上；到了這裡，是神自己升起來。公義，原來不只是我們要做到的標準，是神要帶來的一個日子。"],["p","落到生活裡，我們常常以為公義是一把尺，用來量別人；瑪拉基告訴我們，公義是一個日頭，先要照亮人。尺是拿在手裡的，日頭是從上面來的。日頭來了，狂傲的人無處藏身，敬畏的人得著醫治，這兩件事，是同一道光造成的。"],["p","第二個字是 כָּנָף（kanaf，H3671，翅膀、衣角）。這個字在舊約常用來描寫神的保護：詩篇裡有人祈求，把我藏在祢翅膀的蔭下。路得記裡，波阿斯對路得說，你來投靠耶和華的翅膀底下。這個字的畫面，是一個人被護在一個更大的存在底下。"],["p","所以「翅膀有醫治」，意思是：醫治是在被遮蔽的地方發生的。人受了傷，先要有一個安全的地方，才能慢慢好起來。神的醫治，往往不是一道閃電，而是一個被抱住的過程：先被護住，再被修復。"],["p","「大而可畏」這個詞，也值得停一下：這是 1:14「我的名在外邦中是可畏的」的回響。全書一開始，神的名是可畏的；全書結束，神的日子也是「大而可畏」的。可畏，不是讓人逃跑，是讓人低頭：因為站在面前的，是真的大。敬畏，是整卷書的答案。"],["p","第三個字是 לֵב（lev，H3820，心）。4:6 說：「父親的心轉向兒女」。希伯來人說的「心」，不只是情感，是整個人的中心：思想、意志、情感都在裡面。所以「心轉向」，不是一個禮貌的動作，是整個人的重心轉過去。"],["p","這使我們想起一個很簡單的道理：用心靠聖靈，不要用腦靠自己。用腦，會先計算：值不值得、划不划算、誰先低頭；用心，才會轉身。全書的最後一個動作，是「心」，不是「腦」。人與人之間真正的和好，不是談判出來的，是心轉過去的。"],["d",["「光線」原文是「翅
