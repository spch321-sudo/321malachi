膀」，後面用「她」稱呼日頭，有甚麼意思？","希伯來文裡，「日頭」（שֶׁמֶשׁ）是陰性名詞，所以原文「她的翅膀」只是文法上的需要，並不表示神是女性，也不是在為日頭加上神學上的性別。這一點提醒我們，不要把文法上的細節，讀成神學結論；聖經稱神為父，這一點在瑪拉基書的開頭就已經說明了（瑪1:6）。我們真正要抓住的，是畫面所傳達的意思：一個帶來保護與醫治的臨到，一雙把人遮蔽在底下的翅膀。讀經時分辨哪些是語言的特徵、哪些是神學的宣告，會使我們少走許多彎路。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:1 當成時間表，推算哪一年、哪一個國家會發生甚麼事。經文只說「那日臨近」，沒有給任何日期，也沒有點任何一個民族的名字。"],["p","第二個偏差，是把「狂傲的和行惡的」對號入座，指著某一個國家、民族或群體說「他們就是被燒的」。這是把神的審判拿來替自己的立場背書，與經文的心相反。"],["p","第三個偏差，是把 4:2 的醫治當成「有信心就一定好」的公式，對正在生病的人說「你不好是因為信心不夠」。這是在傷口上撒鹽，不是這一節的意思。"],["p","第四個偏差，是把 4:5 的以利亞，直接對到某一位現代人物身上。新約已經說明的連結，只有施洗約翰；除此之外，我們不必猜測，也不該貼標籤。"],["p","第五個偏差，是把 4:6 讀成「你必須與傷害你的家人和好」的命令，或者讀成要求子女單方面孝順。經文的次序是父親的心先轉向兒女；它也沒有要求任何人回到不安全的關係裡。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題，是「善有善報，惡有惡報，不是不報，時候未到」。這句話是許多華人心裡的最後一道安慰，也是一種很深的無力感：人間不公平，只好等老天算帳。4:1–2 看起來像是這個意思，其實不同：聖經的「那日」，不是命運輪迴的算帳，是神親自來；義人的盼望，不是看對方倒楣，而是看見日頭升起、翅膀下有醫治。盼望的重心，是神，不是報應。"],["p","第二個問題，是把「孝」讀成單向的要求。華人家庭裡，孝順常常是兒女單方面的責任，父親的話是不可違抗的，心裡的話卻說不出來。於是父子之間常常隔著一層不說話的牆。4:6 的次序是先「父親的心轉向兒女」：握有權柄的人，先放下身段，先聽，先說「我錯了」。真正的家，是兩顆心都轉過去。報應的規則，免去了盼望；孝順的規則，免去了傾聽。可是第四章給我們的，不是一條固定的規則，而是一顆願意轉過去的心。"],["h","七、活出321——日頭升起，心也轉向"],["p","三個基礎：耶穌是我的榜樣，聖經是我的準則，聖靈是我的引導。耶穌是那位公義的日頭，祂來到世上，翅膀下有醫治；祂也是那位讓父與子的心轉向的主，祂向父神的順服，是所有關係的榜樣。聖經是我的準則，我們「記念摩西的律法」，是用神的話來定位，不是用感覺。聖靈是我的引導，祂使我們心裡的冰融化，使我們願意轉向。"],["p","兩個核心：讓耶穌作王，讓耶穌得著一切的榮耀。讓耶穌作王，就是承認那日要來的，是祂；公義要來的，是祂，審判與醫治都在祂手裡，不在我們手裡。讓耶穌得著一切的榮耀，就是當我們被醫治、被釋放、像小牛一樣跳躍的時候，把歡呼獻給那位日頭，不歸給自己。"],["p","一個目的：建立屬神的體系。屬神的體系，先生命，再關係，後事工。全書的最後，是一幅家的圖畫：父親的心轉向兒女，兒女的心轉向父親。這是「先生命、再關係」的最好說明：事工再大，若家裡的心沒有轉向，就是次序倒了。神要建立的，是有根的、有關係的體系。"],["p","驕傲，是離開本位，抓住權力。「狂傲的」，正是離開本位的人：想坐神的位子，卻沒有根。謙卑，是回到本位，讓人作人，讓神作神。無己，才能心轉向：不是我自己硬轉，是基督在我裡面活，祂的心轉向父，也轉向人。無己，才能站在日頭底下，不怕被照亮。"],["h","八、四種心，面對那日與日頭"],["p","驕傲型：我讀這一章，心裡浮現的都是別人：那些得罪我的人，終於要被燒了。第四章要我先看見：狂傲在經文裡是一個心態，我心裡有沒有一點？在日頭底下，我願意先被照亮嗎？"],["p","恐懼型：我讀到火爐就害怕，怕自己也是碎秸。請你知道，這一章是對兩種人說的，而第二節的第一個字是「但」：「但向你們敬畏我名的人」。你若敬畏祂，日頭是為你升起的。"],["p","羞恥型：我心裡有一個不能對人說的過去，覺得自己不配被日頭照。請你知道，光不是用來羞辱人的，光有醫治之能。你可以帶著傷痕站在日頭底下，翅膀會先遮住你。"],["p","受傷型：我的身體、我的家，或者我的心，仍然在受傷，日頭似乎還沒有升起。請你知道，經文沒有要你假裝已經好了。神記得你的名字，那日必來；在那日之前，祂與你同在，你可以誠實地說出你的疼。"],["d",["4:6 說父子之心要轉向，是不是要我與傷害過我的父母和好？","不是。4:6 描繪的是神所盼望的家：父母與兒女彼此轉向、彼此尊重。它不是要求受過傷害的人，必須回到不安全的關係裡，更不是叫人用沉默來換取和平。如果你曾經在家裡受過身體上、言語上或情感上的傷害，先確保安全與界線，並尋求牧者、輔導者的陪伴。和好是需要雙方的真實悔改與長時間的修復，不是一個人單方面可以硬做的事。你可以先為他們禱告，把心裡的疼交給神，在安全的前提下，由神帶領下一步。"]],["h","九、這一週，你可以做的幾件事"],["p","第一，找一個安靜的清晨，在天亮時走到窗邊，默想 4:2：公義的日頭，翅膀有醫治。把你心裡最疼的一個地方，在日光下安靜地交給神。"],["p","第二，寫下兩樣你相信「有根」的東西，與兩樣你發現其實「沒有根」的東西，在禱告中問神：我該把重心放在哪裡？"],["p","第三，選一個你願意先轉向的家人，本週先做一件小事：一句問候、一則訊息、一次傾聽。若關係並不安全，請改為為他禱告，並先找一位可信任的牧者談談。"],["p","第四，翻開一段摩西五經或詩篇，每天讀一小段，用「記念」的心情讀：神記得我，我也要記得祂。"],["p","第五，為一位正在生病、或在長夜中等待的人，送上一份具體的陪伴：一頓飯、一通電話、一段安靜的同行。不講道理，不給公式。"],["p","我宣告：公義的日頭要升起，我是敬畏祂名的人。"],["p","我宣告：祂的翅膀有醫治，我可以誠實地說出我的疼。"],["p","我宣告：我記念祂的話，我的心要轉向祂。"],["p","我宣告：耶穌是我的王，一切的榮耀歸給祂。"],["h","十、結語"],["p","舊約，就在這裡結束了。最後一個畫面，不是火爐，不是審判，是一個父親轉向孩子，一個孩子轉向父親。這一整卷書，從「我曾愛你們」開始，到「心轉向」結束；從一個被問「你在何事上愛我們」的神，到一個說「我要差遣使者，使心轉向」的神。沒有人知道這一頁翻過去之後，還要等多久；但這一頁的最後一個字，是一個溫柔的動作：轉向，而不是離開。"],["p","長夜好像還沒有過去，日頭還沒有看見。但經文說：那日必來。公義的日頭要升起，翅膀有醫治。我們還在等候，卻不是在黑暗裡摸索，因為神已經說了話：我記得你，我要來，我必定來。等候不是浪費時間，等候是在日頭升起之前，仍然把臉朝向東方。"],["p","讓我們帶著這個焦點離開。焦點在耶穌，不在自己，不在別人，不在環境。不在我多辛苦、不在別人多可恨，不在處境多漫長。焦點在那位公義的日頭，祂的翅膀下有醫治，祂的名要被尊為大，直到永遠。"],["p","親愛的天父，謝謝祢，在長夜的盡頭，祢說了「我必差遣」，說了「日頭要出現」。求祢使我們敬畏祢的名，使我們記念祢的話，使我們的心轉向祢，也轉向人。願榮耀歸給祢，直到永遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","以下三個化請照次序帶。這一課碰到疾病、長夜與家庭的傷，誠實比漂亮重要，也請保守彼此聽到的分享，不追問細節。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★＝時間充裕再討論。【必做】不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：從「等天亮的夜」進入第四章。；看見自己的長夜。；聽見神說「日頭必要出現」。"],["n","1. ★★★ 你生命裡有沒有一個「等天亮」的夜晚？說一件事就好。"],["n","2. ★ 讀瑪4:2：「翅膀」這個畫面，你心裡最先想起甚麼？"],["n","3. 「根本枝條一無存留」這句話，讓你想到你生命裡的哪一樣東西？可以只說一句。"],["m","帶領提醒：第1題：說一件事即可，不追問細節。 第2題：說感受即可。 第3題：說感受即可，不論斷任何人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：在這一章中定位自己。；聽見神說話。；想通日頭與火爐。；說出口。；把決定化為行動。"],["t","【看】看見自己"],["n","4. ★ 這一章裡，你比較像誰？被火爐嚇到的人、在圈裡等待的小牛、被記念的敬畏者，還是需要轉向的父親或兒女？說出理由。"],["t","【聽】聽神說話"],["n","5. 默讀瑪4:2，把「向你們敬畏我名的人」換成你的名字再讀一次。你聽見神說甚麼？"],["t","【想】想通關卡"],["n","6. ★★★ 如果「根」是支撐你的東西，你現在最信賴的是甚麼？它在長夜裡撐得住嗎？"],["t","【講】說出口"],["n","7. 兩人一組，說出你身上最需要翅膀遮蔽的一個地方，聆聽者只回應：「願神的翅膀護著你。」"],["t","【行】走一步"],["n","8. ★ 本週你要先轉向哪一個人？寫下哪一天、幾點、做甚麼。若關係不安全，改為寫下你要為他做的禱告。"],["m","帶領提醒：第4題：若有人說自己是病人或照顧者，不追問，不要求立刻有答案，不對正在流淚的人說「你要有信心就會好」，會後單獨關心，必要時協助尋求專業協助。 第8題：若牽涉家庭傷害，不要求原諒，不要求和好，會後單獨關心。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：操練 920。；把日頭的光帶給身邊的人。；讓心轉向成為生活的方向。"],["n","9. ★★★ 920 的操練：找出你的那一個「2」，身邊誰正在長夜裡？當場說出他的名字，以及本週哪一天為他做一件事：一通電話、一頓飯、一段陪伴。"],["n","10. 你的家裡，哪一段關係最需要「心轉向」？你本週可以先做的一件小事是甚麼？"],["n","11. ★ 若朋友說「為甚麼我的病還沒好」，你會怎樣用這一章回應？寫下兩句，不說教，不用公式。"],["n","12. 你的小組能不能是一個「翅膀底下」的地方？你可以做哪一件事讓它更安全？"],["n","13. 本週每天早晨看一次日出或天亮，默想「公義的日頭」，與一位組員配對提醒。"],["n","14. 【必做】繁殖任務：請用三句話，把這一課講給一位教會外的朋友聽：神說那日必來；敬畏祂的人，日頭要為他升起，翅膀有醫治；祂要使人的心彼此轉向。"],["m","帶領提醒：第9題：說名字，不公開對方處境。 第10題：若牽涉家庭傷害，不追問細節，不要求原諒，不要求和好，會後單獨關心。 第12題：只談做法，不談個案。"],["s","收尾（5分鐘）"],["p","請大家安靜，把心裡那個還在等天亮的地方，輕輕放在神面前。祂已經說了：日頭要出現。讓我們一起為彼此禱告，求主使我們敬畏祂的名，使我們的心轉向祂，也轉向人。"]],"chars":5240,"min":60,"deep":8,"dchars":1518,"tchars":467}},"issues":[{"id":"ISS00_1","t":"瑪拉基書寫在什麼時候？作者是誰？","r":"1:1--1；1:8--8；2:11--11","ch":[1,2,3,4],"why":"一、全卷沒有列出君王與年代，怎樣定位這卷書？","pos":[["以斯拉、尼希米年代（約主前五世紀中）","","殿已重建、獻祭恢復，總督（省長）已有，百姓鬆懈、與外邦通婚、奉獻不實，與尼希米記相近。多數學者採這個定位。"],["聖殿落成之後、尼希米之前","","認為風氣敗壞早於尼希米改革，時間稍早。證據是同樣的問題，但沒有決定性的記載。"],["年代難以確定","","經文本身不寫年代，只能從殿、省長與社會問題推測，所以保持開放。"]],"con":[],"say":"本講義採「殿已重建、百姓疲乏」的歸回後時期為背景，不依賴確切年份，也不因年代不確定而減損經文的重量。","care":"年代的討論不應取代經文的呼召。不要讓這些考據變成會眾在聚會裡的負擔，講台上只需要說：這是一群歸回之後、心卻疲乏的人。"},{"id":"ISS00_2","t":"神的「愛」與「揀選」：說的是國家的選召，還是個人的得救？","r":"1:2--3","ch":[1,2,3],"why":"二、「我曾愛你們」「我卻愛雅各，惡以掃」是在談預定，還是談選召？","pos":[["國家與歷史的選召","","愛與惡是比較性語言，說的是神在歷史中選了雅各的後裔承擔約，與每個人的永恆結局不是同一個問題。"],["個人預定的證據","","以羅馬書 9:13 引用此節，主張神在創世以前就決定了人的結局。這是改革宗傳統的重要讀法。"],["兩層並存","","本節先是民族與約的選召，保羅則在新約裡進一步用於救恩的恩典性質，兩層不互相取代。"]],"con":[],"say":"本講義取「選召為先，恩典為底」：神先說愛，這份愛不是因為雅各好，也不是用來論斷任何民族。不在此下個人預定的結論。","care":"不要把這節用來說誰被丟棄。若有人因此擔心自己是不是被揀選，要回到 1:2 的第一句：我曾愛你們。愛在前面，且是完成式。"},{"id":"ISS00_3","t":"婚姻與約：瑪拉基把婚姻當作約，這對今天的人意味著什麼？","r":"2:10--16；3:1--1","ch":[2,3],"why":"三、從 2:14「盟約的妻」到 3:1「立約的使者」，這個約的語言怎樣連在一起？","pos":[["類比說","","神與百姓的約，與丈夫與妻子的約，是彼此照亮的比喻：守約就是信實與誠實，詭詐就是背約。"],["規範說","","強調 2:14–16 是對婚姻本身的直接規範，婚姻關係具有約的嚴肅性，離婚不可輕率。"],["牧養並用","","兩者並用：經文既說明神的心，也提醒人的責任，同時也保護受傷的人，不得被用來壓迫受害者。"]],"con":[],"say":"本講義取「類比與規範並用，但以牧養為先」：這一章最重的是詭詐，而不是離婚的人。對受傷的人，神先看見眼淚。","care":"不要用約的名義叫受害者留在暴力裡，也不要用經文去審判離婚的人。婚姻問題要個別牧養，先確保人身安全。"},{"id":"ISS00_4","t":"奉獻與成功神學：瑪拉基書 3 章能不能拿來保證財富與祝福？","r":"3:8--12","ch":[3],"why":"四、「試試我，是否為你們敞開天上的窗戶」，能不能講成「奉獻就必發財」？","pos":[["成功神學式的讀法","","把「傾福與你們，甚至無處可容」讀成對今天任何奉獻者的物質保證。這是最常見的誤用。"],["約內原則說","","這是對守約的以色列整體說的，奉獻與土地的豐收、約內的祝福相連，不是一個個人投資公式。"],["慷慨與敬畏說","","把重點放在回到神面前的慷慨與敬畏，奉獻是信靠的表達，不是交易的工具。"]],"con":[],"say":"本講義取約內原則與慷慨敬畏並用，明確不同意成功神學：奉獻不是向神買福氣，也不是向人施壓的工具。","care":"不要點名追問誰奉獻多少。貧窮的人用僅有的所獻上，神是看見的。要讓會眾聽完，是更愛神，而不是更怕被神處罰。"},{"id":"ISS00_5","t":"「使者」與彌賽亞盼望：瑪拉基書怎樣預備新約？","r":"3:1--1；4:2--2；4:5--6","ch":[3,4],"why":"五、「我的使者」「立約的使者」「公義的日頭」「以利亞」，哪些是新約自己作的連結？","pos":[["嚴格取新約的連結","","只採用新約作過的連結：3:1 前半指施洗約翰（太11:10、可1:2、路7:27）；4:5 的以利亞指施洗約翰（太11:14、17:10–13、可9:11–13、路1:17）。"],["加上教會傳統的讀法","","「立約的使者」「公義的日頭」指向基督，是教會長久以來的讀法，也和路1:78 等新約主題呼應。"],["謹慎保留","","沒有新約明說的，只說「這使我們想起」，不說「這是預表」。"]],"con":[],"say":"本講義採第一與第三並用：新約明說的，直接講；沒有明說的，標示為教會傳統的讀法或「使我們想起」。","care":"不要把這些稱呼貼在任何今天的人身上，也不要借此建立個人的權威。"},{"id":"ISS00_6","t":"審判的日子：瑪拉基書有末世時間表嗎？","r":"3:2--5；4:1--3","ch":[3,4],"why":"六、「他來的日子」「那日臨近」「我所定的日子」，可以排時間表、算日子嗎？","pos":[["歷史審判說","","認為這些話主要是針對歸回後的社會，並在聖殿被毀等歷史事件中有一定的應驗。"],["末世審判說","","認為這些話指向基督再來的日子，與其他先知書的「耶和華的日子」相連。"],["多層應驗說","","既有近期的警告，也有終局的審判，並指向基督的第一次與第二次來臨。"]],"con":[],"say":"本講義不排時間表、不算日子，只取「那日」的嚴肅與盼望：它對狂傲是火，對敬畏的人是日頭。講台上不說某國某人是「惡人」。","care":"果效是忍耐，不是恐慌。要讓會眾走出去更愛主，而不是更怕世界。"},{"id":"ISS01_1","t":"「我的使者」是人名，還是稱號？","r":"1:1--1","ch":[1],"why":"一、1:1「藉瑪拉基傳給以色列的默示」，瑪拉基是人名嗎？","pos":[["人名說","","傳統上視為作者的名字，如同其他先知書，書名即作者名。"],["稱號說","","「瑪拉基」（מַלְאָכִי）字面是「我的使者」，七十士譯本譯作「藉他使者的手」，有人認為這是匿名的稱號，並與 3:1 呼應。"],["兩者兼顧","","名字可能同時是人名，也有「我的使者」的意思，不影響解經。"]],"con":[],"say":"本講義用書名「瑪拉基」，並注意它與 3:1「我的使者」同音同形，不把作者身分當成這卷書權威的基礎。","care":"作者問題不應引起不安。重點是：這是神藉人傳的話，要讓會眾聽見神說：我曾愛你們。"},{"id":"ISS01_2","t":"「愛雅各，惡以掃」是什麼意思？可以拿來論斷哪個民族嗎？","r":"1:2--3","ch":[1],"why":"二、1:2–3 神說愛雅各、惡以掃，這個「惡」要怎麼讀？","pos":[["比較性語言","","「愛」與「惡」在聖經裡常是比較的語言（創29:30–31；路14:26），意思是「選了」與「沒有選」，不是情緒性的憎恨。"],["個人預定說","","保羅在羅9:13 引用此節，有些傳統用來說明神在創世以前的預定。"],["歷史審判說","","強調以東後來被毀的歷史事實，為這句話提供了歷史印證。"]],"con":[],"say":"本講義取比較性語言：這是神的約的揀選，不是對任何族群的態度，也不用來說哪一個國家被丟棄。","care":"這是最容易被拿去論斷別人的一節。講的時候要讓會眾看見：不是在比較誰被丟下，而是我們被拿起來；不要拿這節評論任何民族或國家。"},{"id":"ISS01_3","t":"「你在何事上愛我們呢？」：覺得不被愛的人，該怎麼聽這句話？","r":"1:2--2","ch":[1],"why":"三、百姓問「你在何事上愛我們呢」，這是頂撞，還是誠實？","pos":[["不信的頂撞","","把它當成對神的挑釁，與「你們說」的後續句式一起，顯出百姓的硬心。"],["疲累者的誠實","","他們剛回到故土，日子不如預期，這句話是不敢明說的疑問。神沒有責備，而是回答。"]],"con":[],"say":"本講義取疲累者的誠實：神的回答，是先說「我曾愛你們」，再慢慢指出問題，說明神肯聽這個問題。","care":"不要對正在受苦的人說「你不該這樣問」。要先聽見，再說：愛已經先發生了。"},{"id":"ISS01_4","t":"瞎眼、瘸腿、有病的祭物，與今日的敬拜有什麼關係？","r":"1:8--8；1:13--14","ch":[1],"why":"四、1:8 的瞎眼瘸腿祭牲，今天對應什麼？","pos":[["字面規範說","","利未記 22:20–22 明禁以有殘疾的獻祭，百姓是明知故犯，核心是「有好的卻拿壞的」。"],["象徵說","","今天的敬拜對應「最好的時間、精神、心思」，把剩下的給神，就是今日的瘸腿祭牲。"],["兩者並用","","先看原本的祭牲問題，再取其中的原則：對神的態度。"]],"con":[],"say":"本講義取兩者並用：先尊重原來的祭牲規範，再把原則應用在敬拜的心。神責備的是「心」，不是一個奉獻金額。","care":"不要借此向貧窮的人施壓，也不要要求人付出無止境的時間與金錢。神看的是誠實的心。"},{"id":"ISS01_5","t":"「我的名在外邦中必尊為大」：各教都在拜同一位神嗎？","r":"1:11--11","ch":[1],"why":"五、1:11 說「在各處，人必奉我的名燒香」，這是現在還是將來？指誰？","pos":[["現在式說","","原文沒有動詞，可譯為「現在」，認為當時已有外邦人（或離散的猶太人）敬畏耶和華。"],["將來式說","","認為這是指將來萬國歸向神，與以賽亞書、詩篇的普世盼望相呼應。"],["宗教混同說（不採）","","有人說各教所拜的都是同一位神。這是把這節推得過頭，經文的重點是「我的名」，是耶和華的名。"]],"con":[],"say":"本講義取現在與將來並存的盼望，並明確不推論各教同拜一神：這節的重點是神的名要被認出，不是替各宗教背書。","care":"不要用這節貶低別人的信仰，也不要用它說「怎麼拜都一樣」。要講的是神的名本來就大，我們是回應者。"},{"id":"ISS01_6","t":"責備祭司，與今日的領袖：怎樣不攻擊牧者？","r":"1:6--10","ch":[1],"why":"六、1:6–10 對祭司的責備，今天對應誰？","pos":[["只針對祭司制度","","認為這是對當時祭司職任的特定控告，與今日的牧者沒有直接對應。"],["所有帶領者","","原則適用於所有肩上有託付的人，包括牧者、同工、父母與老師。"],["每一位信徒","","新約說信徒是君尊的祭司（彼前2:9），這面鏡子是每一個站在神面前的人要照的。"]],"con":[],"say":"本講義取「所有肩上有託付的人」並延伸到每一位信徒：這面鏡子，先照講的人自己。","care":"不要借此在會眾面前點名批評任何牧者，也不要讓牧者拿來責怪會眾冷淡。講完之後，大家是各自照鏡子，不是尋找被責備的那一位。"},{"id":"ISS02_1","t":"「利未的約」是什麼約？","r":"2:4--9","ch":[2],"why":"一、2:4–5、8 的「與利未所立的約」，指哪一個約？","pos":[["利未支派的約","","與利未支派承擔聖職的約，參申33:8–11、民18。"],["非尼哈的平安之約","","經文用「生命和平安的約」，與民25:12–13 神與祭司非尼哈所立的「平安之約」相呼應。"],["兩者相連","","利未支派的聖職與非尼哈的約，在祭司傳統裡是同一條線。"]],"con":[],"say":"本講義取兩者相連：重點不在考據哪一個約，而在「生命和平安」是約的本質，也是祭司口中該有的東西。","care":"不要把這段變成對牧者的嚴苛標準。要讓會眾看見：每一個說話的人，口中都該有生命與平安。"},{"id":"ISS02_2","t":"「一位父」指神，還是列祖亞伯拉罕？","r":"2:10--10","ch":[2],"why":"二、「我們豈不都是一位父嗎？豈不是一位神所造的嗎？」這位父是誰？","pos":[["指神","","與 1:6「我既為父親」前後呼應；下一句「一位神所造」也指向創造者。"],["指亞伯拉罕或雅各","","下一句提到「列祖所立的約」，有些註釋把「一位父」讀為先祖。"],["兩者並存","","民族同源與神的創造，兩層並存：同一位神，同一個家。"]],"con":[],"say":"本講義讀為神（1:6 的呼應），也兼顧同一位神所造、同一個約的民族觀念。","care":"不要用這節推論所有人都已自動成為神的兒女（救恩的問題），也不要否定神是萬人的造物主。講的重點是：我們是一個家，所以不可以詭詐待人。"},{"id":"ISS02_3","t":"「娶事奉外邦神的女子為妻」：是排外嗎？","r":"2:11--12","ch":[2],"why":"三、2:11 的「外邦神的女子」，是民族問題，還是信仰問題？","pos":[["民族通婚說","","反對以色列人與其他民族通婚，保持血統純正。"],["信仰之約說","","重點是「事奉外邦神」：配偶若帶入偶像，百姓的心就被帶離約。"],["比喻說","","「外邦神的女子」也是對神不忠的象徵，並與 2:14 的婚約背叛相呼應。"]],"con":[],"say":"本講義取信仰之約：經文說的是「事奉外邦神」，不是國籍或膚色；路得記等經文也顯示外邦人可以歸向神。","care":"不要借此對跨族群、跨國婚姻說三道四，也不要傷害已經信主的外邦配偶。"},{"id":"ISS02_4","t":"前妻的眼淚：這段在說誰？","r":"2:13--14","ch":[2],"why":"四、2:13「使前妻嘆息哭泣的眼淚遮蓋耶和華的壇」，指誰、做了什麼？","pos":[["離棄猶大妻子說","","指男人為了娶外邦女子，而休掉猶大的妻子（承接 2:11）。"],["一般離婚說","","泛指百姓對妻子詭詐，不一定與外邦婚姻相關。"],["屬靈比喻說","","也可與神與百姓的關係相呼應，但不是首要的讀法。"]],"con":[],"say":"本講義取離棄妻子的字面讀法，並看重重點：神看見眼淚，比看見供物更清楚。","care":"對被離棄的人，這段話是安慰：神看見你的眼淚。不要用這節對離婚者說「神不收你的禱告」。"},{"id":"ISS02_5","t":"2:15 這節很難解，各家怎麼譯？","r":"2:15--15","ch":[2],"why":"五、「他不是單造一人嗎？為何只造一人呢？」這一節原文難解，怎樣翻譯？","pos":[["夫妻合一說","","譯為「神不是使他們（夫妻）成為一體，並賜給他們靈的餘力嗎？」（如 ESV、NIV 1984），強調夫妻合一。"],["亞當一人說","","和合本、上帝版的讀法：神只造亞當一人，為的是虔誠的後裔，婚姻的目的是一對一。"],["亞伯拉罕說","","拉比傳統認為「一人」是亞伯拉罕，指他是唯一為了得虔誠後裔而作出抉擇的人。"]],"con":[],"say":"本講義採和合本的讀法，同時誠實說明原文有幾種譯法。無論哪一種，下半句「所以當謹守你們的心，誰也不可以詭詐待幼年所娶的妻」都很清楚。","care":"不要用這節去要求人生育，也不要讓不孕、單身或沒有孩子的人覺得被定罪。"},{"id":"ISS02_6","t":"「休妻的事……是我所恨惡的」：這是禁止離婚嗎？","r":"2:16--16","ch":[2],"why":"六、2:16 的譯法有爭議，神恨的是什麼？","pos":[["神恨休妻","","和合本、上帝版：「休妻的事和以強暴待妻的人都是我所恨惡的」，神恨的是休妻與強暴待妻的人。"],["休妻的人以強暴遮蓋衣服","","另一種譯法（如 ESV）：「那恨惡妻子而休她的，用強暴蓋住自己的衣服」，重點是休妻者的詭詐與暴力。"],["原文難解","","動詞形式有不同讀法，本節是整卷最難的節之一。"]],"con":[],"say":"本講義取：無論哪一種譯法，神所憎惡的是詭詐與強暴；本講義不定罪離婚的人，也不要求受害者為了維持婚姻留在危險裡。","care":"這是全卷最需要小心的一節。受暴的人，安全優先；曾經離婚的人，神看見你的眼淚。不可用這節論斷任何一個人。"},{"id":"ISS02_7","t":"「公義的神在哪裡呢？」是頂撞，還是哀問？","r":"2:17--17","ch":[2],"why":"七、2:17 的問句，是不信，還是誠實的呼求？","pos":[["冷冷的判斷","","整句連同「凡行惡的，耶和華眼看為善」，是在判神不公義，因此煩瑣神。"],["誠實的哀問","","詩篇、約伯記裡也有很多類似的問，這是受傷的人的呼求。"],["兩者並看","","要看說話的人的心：開著的心是問，關上的心是判。"]],"con":[],"say":"本講義取兩者並看：2:17 的語境是「判」，但經文並沒有禁止誠實地問。神在下一章就回答了。","care":"不要對真正受傷的人說「你不可以這樣問」。誠實地哭，是靠近。"},{"id":"ISS02_8","t":"「煩瑣」：用言語使神疲倦，是什麼意思？","r":"2:17--17","ch":[2],"why":"八、「你們用言語煩瑣耶和華」，神也會累嗎？","pos":[["擬人化說","","這是對神的描寫：人的話使神厭煩，不是神真的疲累。"],["神的忍耐說","","強調神已多次忍耐，百姓的詭詐仍使神不悅。"],["提醒人說","","這是對人的警戒：不要用言語把神說得不公義。"]],"con":[],"say":"本講義取擬人化與警戒並用：這句話是要人看見言語的重量，不是在說神軟弱。","care":"不要用這節禁止人向神說出真實的心情。要區分：是在傾訴，還是在控告。"},{"id":"ISS03_1","t":"「我的使者」與「立約的使者」是誰？","r":"3:1--1","ch":[3],"why":"一、3:1 的兩位使者，是同一位還是兩位？新約怎麼說？","pos":[["前者指約翰，後者指基督","","新約引用 3:1 前半，指向施洗約翰（太11:10、可1:2、路7:27）；「立約的使者」在教會傳統中指向基督。"],["兩者是同一位","","有人認為兩個稱呼指同一位使者，神的使者。"],["立約的使者是耶和華的使者","","有人把「立約的使者」連到舊約中的「耶和華的使者」。"]],"con":[],"say":"本講義取：新約自己作了連結的（前半）直接講；後半是教會傳統的讀法，標示為傳統，不說成經文明講。","care":"不要把這些稱呼貼在今天的任何人身上。講完之後，要讓會眾更認識耶穌，而不是更迷上一個說法。"},{"id":"ISS03_2","t":"「煉金的火」與「漂布的鹼」：是審判，還是潔淨？","r":"3:2--3","ch":[3],"why":"二、他來的日子，是毀滅，還是潔淨？","pos":[["審判說","","這日子無人能立住，是對整個民族的審判。"],["潔淨說","","煉金、漂布都是潔淨的工作；3:3 說他「潔淨利未人」，目的是使人憑公義獻供物。"],["先潔淨後審判","","對祭司先潔淨，對不悔改的人審判（3:5）。"]],"con":[],"say":"本講義取潔淨為首：火是衝著雜質來的，不是衝著人。煉銀的人是坐著的，他一直在那裡。","care":"不要對受苦的人說「這是神在煉你，所以不可抱怨」。尤其對受害者、喪親者，這句話會造成傷害。"},{"id":"ISS03_3","t":"十分之一（3:8–12）：今天還要不要奉獻十分之一？","r":"3:8--12","ch":[3],"why":"三、3:8–10 的「十分之一」，今天的教會應該怎麼理解？","pos":[["今日仍須遵守","","認為十分之一是跨越新舊約的原則，今天仍是標準。"],["舊約制度，新約不再規定","","新約強調樂意、慷慨、按著收入奉獻（林後9:7），沒有規定固定比例。"],["以十分之一為起點的慷慨","","把十分之一看作一個起點，不是一條律法的底線。"]],"con":[],"say":"本講義不對今天的奉獻比例下規定：3:8–12 的重點是約內回到神，不是一個金額，更不是成功神學的公式。各教會可有不同的做法。","care":"不要用這段向會眾施壓，不要點名誰奉獻多少。對經濟困難的人，神看的是心。"},{"id":"ISS03_4","t":"「以此試試我」：人可以試驗神嗎？","r":"3:10--10","ch":[3],"why":"四、3:10 神說「試試我」，與「不可試探主你的神」（申6:16；太4:7）怎麼並存？","pos":[["約內的邀請","","這是神在約的範圍內向百姓發出的邀請，不是人任意測試神。"],["原則的邀請","","回到神面前，會經歷神的信實，這是信心的實踐。"],["兩者並存","","神自己邀請的，可以；人自己設定條件逼神的，不可。"]],"con":[],"say":"本講義取約內邀請：重點是回到約裡，不是向神要一個交易的結果。","care":"不要教人「你放一份，神就必須回一份」。那是把神當成機器。"},{"id":"ISS03_5","t":"「事奉神是徒然的」：疲累的人說這句話，算不算不信？","r":"3:13--15","ch":[3],"why":"五、3:14 的話，是背道，還是疲累者的真話？","pos":[["背道之言","","把這句話與 3:15 的「稱狂傲的人為有福」一起，看成對神公義的懷疑。"],["疲累者的真話","","與詩篇 73 類似，是看見惡人亨通時的掙扎。神原原本本記下，並回答他們。"]],"con":[],"say":"本講義取疲累者的真話：神沒有罵他們，反而說「紀念冊」與「特特歸我」。","care":"不要對倦怠的同工說「你信心不夠」。要先陪伴，再談休息與調整。"},{"id":"ISS03_6","t":"紀念冊（3:16）：是生命冊，還是記念的記錄？","r":"3:16--16","ch":[3],"why":"六、3:16 的「紀念冊」，是決定得救的名冊嗎？","pos":[["生命冊說","","與出32:32、詩69:28、啟20:12 的書冊相連，認為是得救的名冊。"],["記念的記錄","","重點是神記得敬畏他的人，像波斯王朝記錄恩人的冊子（斯6:1–2）。"],["比喻說","","是神的記念的形象化描寫。"]],"con":[],"say":"本講義取記念的記錄：神側耳而聽、神記得；這不是得救的條件，也不要讓人活在「有沒有被記上」的恐懼裡。","care":"不確定自己屬不屬神的人，需要的是安穩，不是焦慮。"},{"id":"ISS03_7","t":"「特特歸我」：是整個民族，還是敬畏的人？","r":"3:17--17","ch":[3],"why":"七、「特特歸我」（סְגֻלָּה）指誰？","pos":[["以色列民族","","與出19:5「作我的子民」的用語相呼應，指全民族。"],["敬畏的人","","上下文 3:16 說的是「敬畏耶和華、思念他名的人」，因此是其中的餘民。"],["兩者相連","","民族是被選召的，敬畏者是其中真實回應的人。"]],"con":[],"say":"本講義取敬畏者為主：神的珍愛，不是榮耀的徽章，而是「如同人憐恤服事自己的兒子」的父心。","care":"不要把「特特歸我」講成誰比誰更屬神。要讓每一個疲累的人聽見：他被珍愛。"},{"id":"ISS03_8","t":"善人與惡人的分別（3:18）：現在就能分嗎？","r":"3:18--18","ch":[3],"why":"八、3:18 的「分別」，是今生的分辨，還是將來的審判？","pos":[["今生的分辨","","百姓回頭之後，就能看出誰事奉神、誰不事奉。"],["末後的審判","","指向「我所定的日子」，是神的審判。"],["兩層並存","","今生有部分的顯明，最終在神面前完全分明。"]],"con":[],"say":"本講義取：分別是神的事，而且是在「我所定的日子」。我們的功課是今天站在敬畏他的人中間。","care":"不要在教會裡貼「善人」「惡人」的標籤。這節話是安慰疲累的人，不是用來論斷別人。"},{"id":"ISS04_1","t":"那日如爐（4:1）：要排時間表嗎？指誰？","r":"4:1--1","ch":[4],"why":"一、「那日臨近，勢如燒著的火爐」，是什麼時候？指誰是狂傲的人？","pos":[["歷史審判","","認為包括聖殿被毀等歷史事件。"],["末世審判","","認為是基督再來時的審判。"],["多層應驗","","近期與終局同樣有關。"]],"con":[],"say":"本講義不排時間表，也不指認某國某人就是「狂傲的、行惡的」。重點是：那一日對狂傲是火，對敬畏的人是日頭。","care":"果效是忍耐，不是恐慌。講完之後，會眾要更愛主，不是更怕世界。"},{"id":"ISS04_2","t":"「公義的日頭」與「光線有醫治之能」：是在說彌賽亞嗎？","r":"4:2--2","ch":[4],"why":"二、「公義的日頭」是比喻，還是特指彌賽亞？「醫治」能不能直接應用到身體的病？","pos":[["彌賽亞稱號","","教會傳統上把「公義的日頭」連到基督，也與路1:78 的「清晨的日光」相呼應。"],["神的公義的形象","","不特指某人，是神親自帶來公義與醫治的畫面。"],["醫治的範圍","","「醫治」首先是神親自撫平百姓最深的傷，不是身體疾病的保證。"]],"con":[],"say":"本講義取：神親自來的盼望，並使我們想起基督；不說「有信心就會好」。","care":"不要對病人說「你還沒好，是因為信心不夠」。病痛中的人，仍然可以敬畏他的名、等候他。"},{"id":"ISS04_3","t":"「如圈裡的肥犢」與「踐踏惡人」（4:2–3）：可以講成勝利與報復嗎？","r":"4:2--3","ch":[4],"why":"三、「出來跳躍」與「踐踏惡人」，是什麼意思？","pos":[["字面的勝利","","字面指義人在審判時得勝。"],["象徵邪惡的終結","","象徵邪惡不再轄制人。"],["屬靈的盼望","","是公義與自由的圖像，不是報復的許可。"]],"con":[],"say":"本講義取象徵的讀法：邪惡不再有力量；不拿來鼓勵報復，也不要求黑夜中的人必須歡喜。","care":"不要借此對任何人幸災樂禍。講完之後，會眾要對公義更盼望，對任何人更沒有仇恨。"},{"id":"ISS04_4","t":"以利亞（4:5）：誰是那位以利亞？","r":"4:5--5","ch":[4],"why":"四、4:5 說神要差遣先知以利亞，誰是這位以利亞？","pos":[["施洗約翰","","新約明說：太11:14、17:10–13、可9:11–13、路1:17。"],["以利亞本人再來","","猶太傳統期待以利亞本人再來，今天的逾越節仍為他留一個座位。"],["以利亞的心志","","路1:17 說「有以利亞的心志、能力」，是一種精神的預備。"]],"con":[],"say":"本講義只用新約自己的連結：施洗約翰。不把這個稱呼貼在任何今天的人身上。","care":"不要借此尋找「現代以利亞」，也不要建立個人權威。"},{"id":"ISS04_5","t":"「使父親的心轉向兒女」（4:6）：是要求與傷害我的人和好嗎？","r":"4:6--6","ch":[4],"why":"五、4:6 的父子之心，指什麼？可以要求受害者與家人和好嗎？","pos":[["家庭修復說","","神的心意是家的修復，父親與兒女的心彼此轉向。"],["世代的信仰傳承","","強調父親與兒女之間對神的信仰與盟約的傳遞。"],["悔改的整體說","","「轉向」是整個民族悔改的縮影，從最小的單位開始。"]],"con":[],"say":"本講義取：神的心意是修復，但不是對受害者的命令。和好需要真實的悔改、時間與適當的協助，安全優先。","care":"不要要求受過家人傷害的人先原諒、先回去。對那些人，神看見眼淚，也看見他們的安全。"}],"terrain":{"points":[[1.071,80,0,"我曾愛你們","top"],[1.1,48,0,"你在何事上愛我們呢",null],[1.357,36,0,"尊敬我的在哪裡",null],[1.5,24,0,"瞎眼瘸腿的獻上","bot"],[1.714,84,0,"我的名必尊為大","top"],[2.529,58,0,"我們豈不都是一位父",null],[2.941,10,0,"公義的神在哪裡呢","bot"],[3.0,46,0,"主忽然進殿",null],[3.333,86,0,"現在你們要轉向我","top"],[3.722,28,0,"事奉神是徒然的","bot"],[3.833,70,0,"有紀念冊在他面前","top"],[4.167,97,0,"公義的日頭","top"]]},"tracks":[{"gk":"צְבָאוֹת","tr":"tsevaot","gl":"萬軍（萬軍之耶和華）","code":"H6635","root":"√צבא（軍旅）","stops":[["1:4","萬軍之耶和華說：任他們建造，我必拆毀","bot"],["1:6","萬軍之耶和華對藐視我名的祭司說：尊敬我的在哪裡呢",""],["1:11","萬軍之耶和華說：我的名在外邦中必尊為大","top"],["2:2","萬軍之耶和華說：你們若不聽從，也不放在心上",""],["2:7","祭司是萬軍之耶和華的使者，口中當存知識",""],["2:16","這是萬軍之耶和華說的：所以當謹守你們的心，不可行詭詐",""],["3:1","萬軍之耶和華說：我要差遣我的使者在我前面預備道路","top"],["3:7","萬軍之耶和華說：現在你們要轉向我，我就轉向你們","top"],["3:14","你們說：在萬軍之耶和華面前苦苦齋戒有什麼益處","bot"],["3:17","萬軍之耶和華說：在我所定的日子，他們必屬我","top"],["4:1","萬軍之耶和華說：那日臨近，勢如燒著的火爐",""]],"ins":"全卷二十四次，說話的永遠是同一位：萬軍之耶和華。責問祭司的是他，差遣使者的是他，點燃爐火的是他，也是說「他們必屬我」的是他。誰在說話，決定了每一句話的重量。"},{"gk":"אֲמַרְתֶּם","tr":"amartem","gl":"你們說","code":"H559","root":"√אמר（說）","stops":[["1:2","你在何事上愛我們呢？","top"],["1:6","我們在何事上藐視你的名呢？",""],["1:7","我們在何事上污穢你呢？",""],["1:13","這些事何等煩瑣！",""],["2:14","這是為什麼呢？",""],["2:17","我們在何事上煩瑣他呢？","bot"],["3:7","我們如何才是轉向呢？","top"],["3:8","我們在何事上奪取你的供物呢？",""],["3:13","我們用什麼話頂撞了你呢？",""],["3:14","事奉神是徒然的，有什麼益處呢？","bot"]],"ins":"十次「你們說」，十次反問，神每一次都肯回答。問句的味道一路改變：從「你何曾愛我」，到「如何才是轉向」，再到「有什麼益處」。神把人的話原原本本記下來，因為他願意聽。"},{"gk":"שֵׁם","tr":"shem","gl":"名（神的名）","code":"H8034","root":"שֵׁם（名）","stops":[["1:6","藐視我名的祭司啊","bot"],["1:6","我們在何事上藐視你的名呢",""],["1:11","我的名在外邦中必尊為大","top"],["1:11","人必奉我的名燒香，獻潔淨的供物",""],["1:14","我是大君王，我的名在外邦中是可畏的",""],["2:2","你們若不將榮耀歸與我的名",""],["2:5","他就敬畏我，懼怕我的名",""],["3:16","敬畏耶和華、思念他名的人","top"],["4:2","向你們敬畏我名的人必有公義的日頭出現","top"]],"ins":"名的重量一路翻轉：從祭司「藐視我名」（1:6），到外邦「尊為大」（1:11），到敬畏者「思念他名」（3:16），最後在敬畏者面前升起日頭（4:2）。名不是用來被撐大的，是用來被認出的。"},{"gk":"בְּרִית","tr":"berit","gl":"約","code":"H1285","root":"בְּרִית（約，常與「立」連用）","stops":[["1:2","（主題）我曾愛你們：約的起點，是先給的愛","top"],["1:6","（主題）我既為父親，我既為主人：約的家庭語言",""],["2:4","使我與利未所立的約可以常存",""],["2:5","我曾與他立生命和平安的約","top"],["2:8","你們廢棄我與利未所立的約","bot"],["2:10","背棄了神與我們列祖所立的約",""],["2:14","她是你盟約的妻，你卻以詭詐待她","bot"],["3:1","立約的使者，就是你們所仰慕的，快要來到","top"]],"ins":"這個字全卷只出現六次，卻串起整卷書：從祭司的約，到列祖的約，到婚姻的約，最後落在「立約的使者」身上。約從祭司，到家，到主。前兩站是主題的呼應，詞本身沒有出現。"},{"gk":"שׁוּב","tr":"shuv","gl":"轉、歸回","code":"H7725","root":"√שׁוב（轉回）","stops":[["1:4","以東說：我們要重建荒廢之處","bot"],["2:6","使多人回頭離開罪孽",""],["3:7","你們要轉向我","top"],["3:7","我就轉向你們","top"],["3:7","你們卻問說：我們如何才是轉向呢？",""],["3:18","那時你們必歸回，將善人和惡人分別出來",""],["4:6","他必使父親的心轉向兒女","top"],["4:6","兒女的心轉向父親","top"]],"ins":"全卷七次，是全卷的行動詞：以東說要重建，祭司曾使人回頭，神說你轉向我、我就轉向你，最後舊約最後的動作是心與心彼此轉向。（4:6 的兩個「轉向」由同一個動詞管轄，這裡分成兩站。）"}]}</script>

      '接下來談{t}。',
      '底下是{t}。',
      '這一段講{t}。'
    ],
    /* 序號題目：{n} 是題序 */
    numbered: [
      '第{n}題。',
      '我們看第{n}題。',
      '接著是第{n}題。',
      '來到第{n}題。',
      '第{n}題這樣問。',
      '我們往下，第{n}題。'
    ],
    /* 條列裡的第幾點 */
    item: [
      '第{n}，',
      '{n}是，',
      '再來，',
      '接著，',
      '還有一點，'
    ],
    /* 想更深：問 */
    deeper: [
      '我們在這裡想更深一點。有人會問，',
      '這裡容我多說一句。可能有人心裡正在問，',
      '我知道有人讀到這裡會停下來問，',
      '讓我們把這一段再往裡走一步。有人問，',
      '這裡有一個問題值得停下來。有人問，',
      '也許你正在想這個問題：'
    ],
    /* 想更深：答 */
    deeperAnswer: [
      '我的回答是這樣。',
      '我是這樣看的。',
      '我們可以這樣想。',
      '這一題我會這樣回答。',
      '讓我這樣說。',
      '答案其實就在經文裡。'
    ],
    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [
      '這一步是「{k}」。{t}',
      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'
    ],
    /* 收尾 */
    wrap: [
      '我們來收尾。',
      '最後，我們把這一段收起來。',
      '到這裡，我們收個尾。',
      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [
      '這裡有一張表，我用說的帶你看過一遍。',
      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'
    ],
    /* 條列 */
    list: [
      '這裡有幾點。',
      '底下分成幾點來看。',
      '這一段有幾點。',
      '我列了幾點。'
    ],
    /* 引用經文 */
    quote: [
      '經上說：',
      '聖經這樣說：',
      '我們來讀這一節：',
      '這一節是這樣寫的：'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  /* 行內：粗體、行內碼。斜體不做——`*` 跟條列的記號同一個，
     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  const songName = s => EN ? (s.ne || s.n) : (isSC() ? (s.ns || s.n) : s.n);

    if (hymnEl) return hymnEl;

    hymnEl.setAttribute('playsinline', ''); hymnEl.setAttribute('webkit-playsinline', '');

  function hymnPlay(i) {
    const s = hymns && hymns[i]; if (!s) return;
    const a = hymnAudio();
    if (hymnPrev === i) { hymnStop(); return; }
    hymnStop();
    const base = songBase[s.f] != null ? songBase[s.f] : '';
    a.src = SITE + base + encodeURIComponent(s.f);
    const p = a.play(); if (p && p.catch) p.catch(() => {
      if (base === '') { a.src = SITE + 'music/' + encodeURIComponent(s.f); const p2 = a.play(); if (p2 && p2.catch) p2.catch(() => say(T('這首歌暫時放不出來', 'This song could not play'))); }
    });
    hymnPrev = i;
    const b = q1('#gxhp' + i); if (b) b.textContent = '⏸';
  }
  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();
        if (!blob.size || /text\/html/.test(blob.type || '')) { why = T('檔案不對', 'bad file'); continue; }
        songBase[s.f] = b;
        return blob;
      } catch (e) { why = T('網路', 'network'); }
    }
    throw new Error(why || 'fail');
  }

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){

  function assemble(mdatStart){
    const newTraks=[];

      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];

      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);
      const mdhd=mx_one(mdc,"mdhd");
      const mv=b[mdhd.body];
      const mts=mx_u32(b,mdhd.body+(mv===1?20:12));

      const mdhdBuf=b.slice(mdhd.start,mdhd.end);
      if(mv===1)writeU64(mdhdBuf,mdhd.body-mdhd.start+24,dur);
      else writeU32(mdhdBuf,mdhd.body-mdhd.start+16,dur);

      const minf=mx_one(mdc,"minf");

      const stblParts=parts.map(x=>x.__co?mx_box("co64",x.data):x);

      const minfParts=mic.map(x=>x.type==="stbl"?newStbl:b.slice(x.start,x.end));

    let maxDur=0;

      let d=0;tk.samples.forEach(s=>d+=s.dur);

    if(b[mvhd.body]===1)writeU64(mvhdBuf,mvhd.body-mvhd.start+24,maxDur);
    else writeU32(mvhdBuf,mvhd.body-mvhd.start+16,maxDur);

    return mx_box("moov",mvhdBuf,...newTraks);
  }

  function writeU32(buf,p,v){buf[p]=(v>>>24)&255;buf[p+1]=(v>>>16)&255;buf[p+2]=(v>>>8)&255;buf[p+3]=v&255;}
  function writeU64(buf,p,v){const hi=Math.floor(v/4294967296),lo=v>>>0;

  const ftypBuf=ftyp?b.slice(ftyp.start,ftyp.end)

  const mdatHead=new Uint8Array(16);

  writeU32(mdatHead,8,hi);writeU32(mdatHead,12,lo);

  const out=new Uint8Array(ftypBuf.length+moovNew.length+16+mdatSize);
  let p=0;
  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;
  order.forEach(o=>{out.set(b.subarray(o.off,o.off+o.size),p);p+=o.size;});

    try { mr = new MediaRecorder(stream, Object.assign(mime ? { mimeType: mime } : {}, { videoBitsPerSecond: 2200000 })); }
    catch (e) { cancelAnimationFrame(recAnim); say(T('這台裝置不能錄影片', 'This device cannot record video')); return; }
    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); cancelAnimationFrame(recAnim); curFade = null; recFading = false;
      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };
    mr.start(1000);
    try { await bgmEl.play(); } catch (e) {}
    fadeIn(mcGain, ac, 1, 0.6);
    curFade = () => fadeOutStop(mcGain, ac, BGM_FADEOUT);
    const len = +st().mc;
    bgmEl.onended = () => { if (recOn()) mr.stop(); };
    bgmEl.ontimeupdate = () => {
      if (len > 0 || recFading || !isFinite(bgmEl.duration)) return;
      const left = bgmEl.duration - bgmEl.currentTime;
      if (left <= BGM_FADEOUT && recOn()) fadeOutStop(mcGain, ac, Math.max(.5, left));
    };
    const lim = len > 0 ? len : 8 * 60;
    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);
    paint();
    recTick(T('音樂卡片製作中', 'Making music card') + '　♪');
  }

   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();

function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = LASTCH;
  /* 點的 x 是「章＋章內位置」（例 7.345＝第 7 章三分之一處），所以軸從 1 走到 LAST+1 */
  const XMAX = Math.max(LAST + 1, ...P.map(p => p[0]));
  const x = c => pad + (c - 1) / Math.max(1, XMAX - 1) * (W - pad * 2);
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);

  if (cur) { const cx = x(cur + .5), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }

    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));

  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur + .5).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="瑪拉基書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">哭 · 怒 · 望 · 求</p></div>`;
}

function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">

      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>瑪拉基書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}

    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        TTSQ.bulk = true;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);

  const segs = lesSegs(n); if (!segs.length) return;

  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}

const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
/* -rf1105（互動聖經 v2.60 朗讀升級）：雲端逾時、20 秒斷路器、失敗改用裝置語音、看門狗、睡前定時。
   TTSQ 由 plFetch／預先下載在呼叫前設定，ttsFetch 一開頭就讀走（PRON321 的包裝只轉第一個參數）。 */
let TTS_DOWN = 0;                       // 雲端暫停到什麼時候（失敗後 20 秒內，沒有快取的段落不再等待）
const TTSQ = { quick:false, bulk:false };
let NATIVE_STOP = null;                 // 目前這一句若正在用裝置語音，可以用它收掉
let WD2 = null;                         // 看門狗：音檔放完卻沒觸發 ended 時，依實際長度推進
const SLEEP = { mode:0, mins:[0, 15, 30, 60], t:0, iv:0 };
async function ttsFetch(piece){
  const quick = TTSQ.quick, bulk = TTSQ.bulk; TTSQ.quick = TTSQ.bulk = false;
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  /* 剛失敗過的 20 秒內，沒有快取的段落不再等待，立刻讓呼叫端改用裝置語音（整課預先下載不受影響） */
  if (!bulk && Date.now() < TTS_DOWN) throw new Error('cloud paused');
  let ctrl = null, timer = null;
  try { if (window.AbortController) ctrl = new AbortController(); } catch(e){}
  if (ctrl) timer = setTimeout(() => { try { ctrl.abort(); } catch(e){} }, (quick && !bulk) ? 6000 : 15000);
  try {
    const res = await fetch(SVC.tts, { signal: ctrl ? ctrl.signal : undefined, method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (timer) clearTimeout(timer);
    ttsPut(key, blob);
    return blob;
  } catch (err) {
    if (timer) clearTimeout(timer);
    if (!bulk) TTS_DOWN = Date.now() + 20000;
    throw err;
  }
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"][sizes="180x180"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({

/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  TTS_DOWN = 0;                       // 按 ▶ 開新一輪：歸零，重新試雲端
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);

  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  TTSQ.quick = (k === (PL.need != null ? PL.need : PL.i)) || PL.fail > 0;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3){
      if (Date.now() < TTS_DOWN && k !== (PL.need != null ? PL.need : PL.i)) continue;   /* 雲端暫停中：只替現在要唸的那一句試 */
      plFetch(k);
    }
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (!PL.blobs[0] && (PL.try[0] || 0) >= 3 && window.speechSynthesis) return plPlay(0);   /* 第一句雲端就連不上：逐句改用裝置語音，仍有逐句標示 */
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (NATIVE_STOP){ const ns0 = NATIVE_STOP; NATIVE_STOP = null; ns0(); }
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if (Date.now() < TTS_DOWN && PL.pend[k]) PL.try[k] = 3;   /* 雲端剛判定失敗：還在等的這一句也不再等 */
    if ((PL.try[k] || 0) >= 3){              // 這一段雲端抓不到：改用裝置語音唸這一句，唸完再回雲端
      return nativeUnit(k);
    }
    PL.need = k;
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];

  const armWd = () => {
    clearWd2();
    const d = a.duration;
    if (!(d > 0 && isFinite(d))) return;
    const left = Math.max(0, d - (a.currentTime || 0)) / (a.playbackRate || 1);
    WD2 = setTimeout(() => {
      WD2 = null;
      if (!PL || PL.tok !== SPK.tok || PL.i !== k || SPK.pause) return;
      if (!a.ended){ try { URL.revokeObjectURL(a.src); } catch(e){} PL.cur = 1 - PL.cur; plPlay(k + 1); }

  a.onpause = clearWd2;
  a.onended = () => {
    clearWd2();
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}

    plPlay(k + 1);
  };
  a.onerror = () => { clearWd2(); if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function utter(t){
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  return u;
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  speechSynthesis.speak(utter(t));
}
function clearWd2(){ if (WD2){ try { clearTimeout(WD2); } catch(e){} WD2 = null; } }
/* 雲端這一句抓不到：只這一句改用裝置語音（仍逐句標示），唸完 plPlay(k+1) 回到雲端；提示每輪只彈一次 */
function nativeUnit(k){
  if (!PL) return;
  if (!window.speechSynthesis){ PL.i = k; SPK.i = k; return plPlay(k + 1); }
  const my = SPK.tok; let done = false, tm = null;
  PL.i = k; SPK.i = k; PL.need = null; SPK.buffering = false; SPK.native = true;
  if (!SPK.toasted){ SPK.toasted = true; toast('真人語音連不上，這一句先用裝置語音'); }
  spkMark(PL.segs[k]);
  drawBar();
  const txt = PL.segs[k].t;
  const fin = (cancelOnly) => {
    if (done) return; done = true;
    if (tm){ clearTimeout(tm); tm = null; }
    NATIVE_STOP = null; SPK.native = false;
    if (cancelOnly) return;
    if (!PL || PL.tok !== my || !SPK.on) return;
    plPlay(k + 1);
  };
  NATIVE_STOP = () => { if (done) return; fin(true); try { speechSynthesis.cancel(); } catch(e){} };
  const guard = () => {
    tm = setTimeout(() => { if (done) return; if (SPK.pause) return guard(); fin(); }, Math.max(15000, txt.length * 480 / (S.set.rate * 0.05 + 0.94)) + 10000);
  };
  try {
    const u = utter(txt);
    u.onend = () => fin(); u.onerror = () => fin();
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    if (SPK.pause) speechSynthesis.pause();
    guard();
  } catch(e){ fin(); }
}
/* 睡前定時：關 → 15 → 30 → 60 分鐘 → 關。時間到淡出 5 秒再停 */
function sleepMsg(m){ return m ? ('睡前定時：' + m + ' 分鐘後停止') : '睡前定時：關'; }
function sleepClear(){
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  if (SLEEP.iv){ clearInterval(SLEEP.iv); SLEEP.iv = 0; try { audioPair().forEach(a => { a.volume = 1; }); } catch(e){} }
  SLEEP.mode = 0;
}
function sleepCycle(){
  if (!SPK.on) return;
  const m = (SLEEP.mode + 1) % SLEEP.mins.length;
  if (SLEEP.t){ clearTimeout(SLEEP.t); SLEEP.t = 0; }
  SLEEP.mode = m;
  if (m) SLEEP.t = setTimeout(sleepFire, SLEEP.mins[m] * 60000);
  toast(sleepMsg(SLEEP.mins[m]));
  drawBar();
}
function sleepFire(){
  SLEEP.t = 0; SLEEP.mode = 0;
  if (!SPK.on) return;
  const els = audioPair(); let n = 0;
  SLEEP.iv = setInterval(() => {
    n++;
    try { els.forEach(a => { a.volume = Math.max(0, 1 - n * 0.2); }); } catch(e){}
    if (n >= 5){ clearInterval(SLEEP.iv); SLEEP.iv = 0; stopSpeak(); try { els.forEach(a => { a.volume = 1; }); } catch(e){} }
  }, 1000);
}
function stopSpeak(){
  if (NATIVE_STOP){ const ns1 = NATIVE_STOP; NATIVE_STOP = null; ns1(); }

  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false; SPK.native = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}

  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){

/* 往前／往後跳一句 */
function spkStep(d){

function drawBar(){

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();
  const n = PL.lesson;
  const els = [];
  if (seg.js && seg.js.length){
    seg.js.forEach(j => {
      const e = document.querySelector(`.les .mks[data-k="l|${n}|${seg.i}|${seg.part}|${j}"]`);
      if (e) els.push(e);

    if (blk) els.push(blk);

  if (!els.length) return;

  SPK_LAST = els;
  if (S.set.follow === 0) return;

  SPK.autoScrolling = true;

/* 使用者自己動手捲動時，先讓畫面歸他，六秒後再接手 */

/* ═══════ ② 畫線與領受 ═══════ */

function mkText(k){

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // 標籤內不切
    let brk = '。！？'.includes(ch);
    if (!brk && EN_SENT && '.!?'.includes(ch)){      // 英文：句點後須接空白
      const nx = html[i + 1];
      brk = (nx === undefined || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
    }
    if (!brk) continue;
    while (i + 1 < html.length && '」』）”"\''.includes(html[i + 1])){ i++; cur += html[i]; }
    while (i + 1 < html.length && html[i + 1] === ' '){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

}

    if (!t) t = '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？';

    XZ.msgs.push({ role:'assistant', text:(e && e.name === 'AbortError' ? '小智等候得有點久，先暫停一下。' : '小智暫時連不上線，請稍後再試。')

function xzSavedIdx(i){
  const a = XZ.msgs[i]; if (!a) return -1;
  return S.xz.findIndex(x => x.a === a.text);
}
function xzSave(i){
  const a = XZ.msgs[i]; if (!a) return;
  const k = xzSavedIdx(i);
  if (k >= 0){ S.xz.splice(k, 1); save(); drawXz(); return toast('已取消收藏'); }
  let q = '';
  for (let p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user'){ q = XZ.msgs[p].text; break; }
  S.xz.unshift({ q, a:a.text, ch:(R.ch || S.last || 0), at:Date.now() });
  save(); drawXz(); toast('已加入收藏');
}
function xzDel(i){
